<!doctype html><html lang="bn"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><meta name="theme-color" content="#087d59"><title>Notifications • Wildlife Explorer</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet"><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{--bg:#f3f8f5;--card:#fff;--ink:#17251f;--muted:#718078;--line:#dfeae5;--green:#087d59;--soft:#e8f6f0;--red:#d65353;--blue:#3978df;--shadow:0 18px 45px rgba(20,70,53,.08)}*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;background:#dfe9e4;color:var(--ink)}body{font-family:Inter,"Hind Siliguri",sans-serif}.app{max-width:680px;min-height:100vh;margin:auto;background:var(--bg);overflow:hidden}.header{padding:20px 17px 22px;background:linear-gradient(135deg,#056b4b,#0b9b6d);color:#fff;position:relative;overflow:hidden}.header:before,.header:after{content:"";position:absolute;border-radius:50%;background:rgba(255,255,255,.08);animation:float 7s ease-in-out infinite}.header:before{width:180px;height:180px;right:-80px;top:-110px}.header:after{width:110px;height:110px;left:-65px;bottom:-75px}@keyframes float{50%{transform:translate(10px,8px)}}.top{position:relative;z-index:2}.eyebrow{font-size:8px;font-weight:800;letter-spacing:1.2px;opacity:.72}.header h1{font-size:27px;margin:5px 0 2px}.header p{font-size:9px;margin:0;opacity:.8}.live{position:absolute;right:15px;top:20px;z-index:3;font-size:7px;background:rgba(255,255,255,.12);padding:6px 8px;border-radius:99px}.dot{display:inline-block;width:6px;height:6px;border-radius:50%;background:#b8ffd9;margin-right:4px}.content{padding:14px}.toolbar{display:flex;gap:7px;margin-bottom:12px;overflow:auto}.filter{border:1px solid var(--line);background:#fff;color:var(--muted);border-radius:99px;padding:8px 11px;font-size:8px;font-weight:800;white-space:nowrap}.filter.active{background:var(--green);color:#fff;border-color:var(--green)}.card{background:#fff;border:1px solid var(--line);border-radius:22px;overflow:hidden;box-shadow:var(--shadow);margin-bottom:11px;animation:rise .42s ease both}.card img{width:100%;max-height:230px;object-fit:cover;display:block}.body{padding:15px}.meta{display:flex;gap:6px;flex-wrap:wrap;align-items:center}.badge{font-size:7px;font-weight:800;padding:5px 8px;border-radius:99px;background:var(--soft);color:var(--green)}.badge.imp{background:#fff1dd;color:#b97816}.badge.urg{background:#ffe7e7;color:var(--red)}.date{font-size:7px;color:var(--muted)}.title{font-size:15px;font-weight:800;line-height:1.35;margin-top:8px}.en{font-size:9px;color:var(--muted);font-weight:600;margin-top:3px}.desc{font-family:"Hind Siliguri",Inter,sans-serif;font-size:11px;line-height:1.75;color:#405048;margin-top:10px;white-space:pre-line}.desc.en{font-family:Inter,sans-serif;font-size:9px;line-height:1.65}.divider{height:1px;background:#edf2ef;margin:12px 0}.actions{display:flex;gap:7px}.action{flex:1;border:0;border-radius:12px;padding:10px;font-size:8px;font-weight:800;background:#f2f7f4;color:var(--ink)}.open{background:var(--green);color:#fff}.copy{background:#eef4ff;color:var(--blue)}.empty{text-align:center;padding:55px 20px;color:var(--muted)}.emptyicon{width:66px;height:66px;border-radius:22px;background:var(--soft);color:var(--green);display:grid;place-items:center;margin:0 auto 13px;font-size:23px;animation:pulse 2.2s ease-in-out infinite}.empty b{display:block;color:var(--ink);font-size:13px}.empty span{display:block;font-size:9px;line-height:1.6;margin-top:4px}.retry{margin-top:12px;border:0;background:var(--green);color:#fff;border-radius:12px;padding:10px 14px;font-size:8px;font-weight:800}.loading{text-align:center;padding:55px;color:var(--muted);font-size:9px}.spin{animation:spin .8s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}@keyframes rise{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}@keyframes pulse{50%{transform:translateY(-4px)}}.toast{position:fixed;left:50%;bottom:18px;transform:translate(-50%,20px);opacity:0;z-index:50;background:#18251f;color:#fff;border-radius:13px;padding:11px 14px;font-size:9px;font-weight:700;transition:.25s;max-width:92%;text-align:center}.toast.show{opacity:1;transform:translate(-50%,0)}
</style></head><body><div class="app"><header class="header"><div class="live"><span class="dot"></span>Live</div><div class="top"><div class="eyebrow">WILDLIFE EXPLORER</div><h1>Notifications</h1><p>Latest updates, announcements & useful information.</p></div></header><main class="content"><div class="toolbar"><button class="filter active" onclick="setFilter('all',this)">All</button><button class="filter" onclick="setFilter('update',this)">Updates</button><button class="filter" onclick="setFilter('announcement',this)">Announcements</button><button class="filter" onclick="setFilter('important',this)">Important</button><button class="filter" onclick="setFilter('ticket',this)">Tickets</button></div><div id="list"><div class="loading"><i class="fa-solid fa-spinner spin"></i><br><br>Loading notifications...</div></div></main></div><div id="toast" class="toast"></div>
<script>
const URL="https://hnhphoqfylwbuptronqh.supabase.co",KEY="sb_publishable_ZBJhCw5h6JKGRD29loq4bw_OV1G_Fz0",db=window.supabase.createClient(URL,KEY);let rows=[],filter="all";
const icons={bell:"fa-bell",tree:"fa-tree",ticket:"fa-ticket",paw:"fa-paw",route:"fa-route",app:"fa-mobile-screen",info:"fa-circle-info",warning:"fa-triangle-exclamation",calendar:"fa-calendar-days",location:"fa-location-dot",binoculars:"fa-binoculars",sparkles:"fa-sparkles",megaphone:"fa-bullhorn",download:"fa-download"};
function esc(v){return String(v??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]))}function toast(m){const t=document.getElementById("toast");t.textContent=m;t.classList.add("show");clearTimeout(window.tt);window.tt=setTimeout(()=>t.classList.remove("show"),2500)}function date(v){return new Date(v).toLocaleDateString("bn-BD",{day:"numeric",month:"long",year:"numeric"})}
function copyLink(u){if(!u)return;if(navigator.clipboard&&window.isSecureContext)navigator.clipboard.writeText(u).then(()=>toast("Link copied successfully")).catch(()=>fallback(u));else fallback(u)}function fallback(u){const t=document.createElement("textarea");t.value=u;document.body.appendChild(t);t.select();try{document.execCommand("copy");toast("Link copied successfully")}catch{toast("Could not copy link")}t.remove()}
function openLink(u){if(u)window.open(u,"_blank","noopener,noreferrer")}function setFilter(v,b){filter=v;document.querySelectorAll(".filter").forEach(x=>x.classList.remove("active"));b.classList.add("active");render()}
function render(){const data=rows.filter(x=>filter==="all"||x.category===filter),list=document.getElementById("list");if(!data.length){list.innerHTML='<div class="empty"><div class="emptyicon"><i class="fa-regular fa-bell-slash"></i></div><b>No notifications yet</b><span>There are no published notifications in this category right now.</span></div>';return}list.innerHTML=data.map((x,i)=>`<article class="card" style="animation-delay:${Math.min(i*45,400)}ms">${x.image_url?`<img src="${esc(x.image_url)}" alt="">`:""}<div class="body"><div class="meta"><span class="badge ${x.priority==="urgent"?"urg":x.priority==="important"?"imp":""}"><i class="fa-solid ${icons[x.icon]||"fa-bell"}"></i> ${esc(x.category||"app")}</span><span class="date"><i class="fa-regular fa-clock"></i> ${date(x.created_at)}</span></div><div class="title">${esc(x.title_bn)}</div><div class="en">${esc(x.title_en)}</div><div class="desc">${esc(x.description_bn)}</div><div class="desc en">${esc(x.description_en)}</div>${x.action_url?`<div class="divider"></div><div class="actions"><button class="action open" onclick='openLink(${JSON.stringify(x.action_url)})'><i class="fa-solid fa-arrow-up-right-from-square"></i> Open Link</button><button class="action copy" onclick='copyLink(${JSON.stringify(x.action_url)})'><i class="fa-regular fa-copy"></i> Copy Link</button></div>`:""}</div></article>`).join("")}
async function load(){document.getElementById("list").innerHTML='<div class="loading"><i class="fa-solid fa-spinner spin"></i><br><br>Loading notifications...</div>';const {data,error}=await db.from("notifications").select("id,title_bn,title_en,description_bn,description_en,category,icon,priority,is_published,created_at,image_url,action_url").eq("is_published",true).order("created_at",{ascending:false});if(error){document.getElementById("list").innerHTML='<div class="empty"><div class="emptyicon"><i class="fa-solid fa-cloud"></i></div><b>Unable to load notifications</b><span>Please check your connection and try again.</span><button class="retry" onclick="load()">Try Again</button></div>';return}rows=data||[];render()}
window.addEventListener("online",()=>{toast("Connection restored");load()});window.addEventListener("offline",()=>toast("You are offline"));load();
</script></body></html>
