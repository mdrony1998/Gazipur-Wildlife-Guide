<!doctype html>
<html lang="bn">
<head>

<meta charset="utf-8">

<meta name="viewport"
content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">

<meta name="theme-color" content="#087d59">

<meta name="apple-mobile-web-app-capable" content="yes">

<title>Notifications • Wildlife Explorer</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700;800&display=swap"
rel="stylesheet">

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>

/* =========================================================
   WILDLIFE EXPLORER
   PREMIUM MOBILE NOTIFICATION SYSTEM
========================================================= */

:root{

 --bg:#f4f8f6;
 --card:#ffffff;

 --ink:#16251f;
 --ink2:#34453e;

 --muted:#78857f;
 --muted2:#9aa59f;

 --green:#087d59;
 --green2:#0ba978;

 --soft:#e8f6f0;

 --blue:#3978df;
 --blueSoft:#edf3ff;

 --orange:#d98a24;
 --orangeSoft:#fff3df;

 --red:#d95353;
 --redSoft:#ffe9e9;

 --line:#e1ebe6;

 --shadow:
 0 12px 35px rgba(18,70,52,.075);

 --shadow2:
 0 22px 60px rgba(18,70,52,.12);

 --radius:21px;

}


/* =========================================================
   RESET
========================================================= */

*{
 box-sizing:border-box;
 -webkit-tap-highlight-color:transparent;
}

html,
body{
 margin:0;
 padding:0;
 width:100%;
 min-height:100%;
 background:#dfe9e4;
 color:var(--ink);
}

body{

 font-family:
 Inter,
 "Hind Siliguri",
 sans-serif;

 overflow-x:hidden;

}

button,
input{
 font-family:inherit;
}

button{
 border:0;
 cursor:pointer;
}

button:active{
 transform:scale(.97);
}


/* =========================================================
   APP
========================================================= */

.app{

 width:100%;
 max-width:680px;

 min-height:100vh;

 margin:auto;

 background:var(--bg);

 position:relative;

 overflow:hidden;

}


/* =========================================================
   HEADER
========================================================= */

.header{

 position:relative;

 padding:
 18px
 16px
 19px;

 color:#fff;

 background:
 linear-gradient(
 135deg,
 #056b4b 0%,
 #087d59 48%,
 #0ca777 100%
 );

 overflow:hidden;

}

.header:before{

 content:"";

 position:absolute;

 width:230px;
 height:230px;

 right:-120px;
 top:-150px;

 border-radius:50%;

 background:
 rgba(255,255,255,.075);

 animation:
 headerFloat 8s ease-in-out infinite;

}

.header:after{

 content:"";

 position:absolute;

 width:145px;
 height:145px;

 left:-90px;
 bottom:-105px;

 border-radius:50%;

 background:
 rgba(255,255,255,.06);

 animation:
 headerFloat2 7s ease-in-out infinite;

}

@keyframes headerFloat{

 50%{
  transform:
  translate(-12px,10px)
  scale(1.05);
 }

}

@keyframes headerFloat2{

 50%{
  transform:
  translate(10px,-8px);
 }

}


.headerInner{

 position:relative;
 z-index:2;

}


.brandRow{

 display:flex;
 align-items:center;

 gap:10px;

}


.brandIcon{

 width:42px;
 height:42px;

 border-radius:15px;

 display:grid;
 place-items:center;

 background:
 rgba(255,255,255,.14);

 border:
 1px solid
 rgba(255,255,255,.13);

 box-shadow:
 0 8px 25px rgba(0,0,0,.09);

 animation:
 bellFloat 3s ease-in-out infinite;

}

.brandIcon i{

 font-size:17px;

}

@keyframes bellFloat{

 50%{
  transform:translateY(-2px);
 }

}


.brandText small{

 display:block;

 font-size:7px;

 font-weight:800;

 letter-spacing:1.3px;

 opacity:.68;

}

.brandText b{

 display:block;

 margin-top:2px;

 font-size:13px;

}


.live{

 margin-left:auto;

 display:flex;
 align-items:center;

 gap:6px;

 padding:
 6px 9px;

 border-radius:99px;

 background:
 rgba(255,255,255,.11);

 border:
 1px solid
 rgba(255,255,255,.12);

 font-size:7px;

 font-weight:800;

}

.liveDot{

 width:6px;
 height:6px;

 border-radius:50%;

 background:#b9ffda;

 box-shadow:
 0 0 0 4px
 rgba(185,255,218,.08);

 animation:
 livePulse 1.8s infinite;

}

@keyframes livePulse{

 50%{
  box-shadow:
  0 0 0 8px
  rgba(185,255,218,.02);
 }

}


.headerTitle{

 margin-top:19px;

 font-size:26px;

 font-weight:800;

 letter-spacing:-.6px;

 line-height:1.1;

}


.headerSubtitle{

 margin-top:5px;

 font-size:9px;

 opacity:.76;

 line-height:1.5;

}


/* =========================================================
   CONTENT
========================================================= */

.content{

 padding:
 13px
 13px
 30px;

}


/* =========================================================
   SEARCH
========================================================= */

.utility{

 display:flex;

 gap:8px;

 margin-bottom:10px;

}


.searchBox{

 flex:1;

 position:relative;

}


.searchBox i{

 position:absolute;

 left:12px;
 top:50%;

 transform:
 translateY(-50%);

 color:#89958f;

 font-size:10px;

 pointer-events:none;

}


.searchBox input{

 width:100%;

 height:40px;

 padding:
 0 12px 0 32px;

 border:
 1px solid
 var(--line);

 border-radius:14px;

 outline:none;

 background:#fff;

 color:var(--ink);

 font-size:9px;

 box-shadow:
 0 7px 20px
 rgba(20,70,53,.035);

 transition:.2s;

}


.searchBox input::placeholder{

 color:#9aa59f;

}


.searchBox input:focus{

 border-color:#91cdb8;

 box-shadow:
 0 0 0 3px
 rgba(11,169,120,.08);

}


.refresh{

 width:40px;
 height:40px;

 flex:none;

 border:
 1px solid
 var(--line);

 border-radius:14px;

 background:#fff;

 color:var(--green);

 display:grid;
 place-items:center;

 box-shadow:
 0 7px 20px
 rgba(20,70,53,.035);

}

.refresh.loading i{

 animation:
 spin .7s linear infinite;

}

@keyframes spin{

 to{
  transform:rotate(360deg);
 }

}


/* =========================================================
   FILTER
========================================================= */

.filters{

 display:flex;

 gap:7px;

 overflow-x:auto;

 padding:
 1px 1px 5px;

 scrollbar-width:none;

}

.filters::-webkit-scrollbar{
 display:none;
}


.filter{

 flex:none;

 padding:
 8px 11px;

 border:
 1px solid
 var(--line);

 border-radius:99px;

 background:#fff;

 color:var(--muted);

 font-size:8px;

 font-weight:800;

 white-space:nowrap;

 transition:.2s;

}


.filter i{

 margin-right:4px;

}


.filter.active{

 background:var(--green);

 border-color:var(--green);

 color:#fff;

 box-shadow:
 0 7px 18px
 rgba(8,125,89,.17);

}


/* =========================================================
   SUMMARY
========================================================= */

.summary{

 display:flex;

 align-items:center;

 justify-content:space-between;

 margin:
 12px 1px
 10px;

}


.summaryLeft{

 display:flex;

 align-items:center;

 gap:8px;

}


.summaryIcon{

 width:32px;
 height:32px;

 border-radius:11px;

 background:var(--soft);

 color:var(--green);

 display:grid;
 place-items:center;

 font-size:10px;

}


.summaryText b{

 display:block;

 font-size:10px;

}


.summaryText span{

 display:block;

 margin-top:2px;

 font-size:7px;

 color:var(--muted);

}


.count{

 padding:
 6px 9px;

 border-radius:99px;

 background:#fff;

 border:
 1px solid
 var(--line);

 color:var(--green);

 font-size:7px;

 font-weight:800;

}


/* =========================================================
   NOTIFICATION LIST
========================================================= */

.notificationList{

 display:flex;

 flex-direction:column;

 gap:9px;

}


/* =========================================================
   LIST ITEM
========================================================= */

.notificationItem{

 position:relative;

 display:flex;

 gap:11px;

 padding:12px;

 background:#fff;

 border:
 1px solid
 var(--line);

 border-radius:19px;

 box-shadow:var(--shadow);

 cursor:pointer;

 overflow:hidden;

 animation:
 itemIn .42s
 cubic-bezier(.2,.8,.2,1)
 both;

 transition:
 transform .2s,
 box-shadow .2s;

}


.notificationItem:active{

 transform:scale(.985);

 box-shadow:
 0 8px 20px
 rgba(20,70,53,.08);

}


@keyframes itemIn{

 from{

  opacity:0;

  transform:
  translateY(12px)
  scale(.985);

 }

 to{

  opacity:1;

  transform:none;

 }

}


/* unread */

.notificationItem.unread{

 border-color:
 #cce9dc;

 background:
 linear-gradient(
 135deg,
 #fff 0%,
 #fbfffd 100%
 );

}


.notificationItem.unread:before{

 content:"";

 position:absolute;

 left:0;
 top:13px;
 bottom:13px;

 width:3px;

 border-radius:0 5px 5px 0;

 background:
 linear-gradient(
 180deg,
 var(--green),
 var(--green2)
 );

}


/* thumbnail */

.thumb{

 width:61px;
 height:61px;

 flex:none;

 border-radius:16px;

 overflow:hidden;

 background:
 linear-gradient(
 135deg,
 #e8f6f0,
 #dcefe7
 );

 display:grid;
 place-items:center;

 color:var(--green);

 position:relative;

}


.thumb img{

 width:100%;
 height:100%;

 object-fit:cover;

 display:block;

}


.thumbIcon{

 font-size:17px;

}


/* content */

.itemContent{

 min-width:0;

 flex:1;

}


.itemTop{

 display:flex;

 align-items:center;

 gap:6px;

 min-width:0;

}


.category{

 display:inline-flex;

 align-items:center;

 gap:4px;

 padding:
 4px 7px;

 border-radius:99px;

 background:var(--soft);

 color:var(--green);

 font-size:6.5px;

 font-weight:800;

 white-space:nowrap;

}


.category.important{

 background:var(--orangeSoft);

 color:var(--orange);

}


.category.urgent{

 background:var(--redSoft);

 color:var(--red);

}


.time{

 margin-left:auto;

 flex:none;

 color:var(--muted2);

 font-size:6.5px;

 white-space:nowrap;

}


.itemTitle{

 margin-top:7px;

 font-family:
 "Hind Siliguri",
 sans-serif;

 font-size:13px;

 font-weight:700;

 line-height:1.4;

 display:
 -webkit-box;

 -webkit-line-clamp:2;

 -webkit-box-orient:vertical;

 overflow:hidden;

}


.itemPreview{

 margin-top:4px;

 color:var(--muted);

 font-family:
 "Hind Siliguri",
 sans-serif;

 font-size:8.5px;

 line-height:1.55;

 display:
 -webkit-box;

 -webkit-line-clamp:2;

 -webkit-box-orient:vertical;

 overflow:hidden;

}


.itemBottom{

 display:flex;

 align-items:center;

 gap:6px;

 margin-top:7px;

}


.unreadText{

 font-size:6.5px;

 color:var(--green);

 font-weight:800;

}


.unreadDot{

 width:6px;
 height:6px;

 border-radius:50%;

 background:var(--green);

 box-shadow:
 0 0 0 4px
 rgba(8,125,89,.08);

 animation:
 unreadPulse 2s infinite;

}


@keyframes unreadPulse{

 50%{
  box-shadow:
  0 0 0 7px
  rgba(8,125,89,.02);
 }

}


.arrow{

 width:25px;
 height:25px;

 flex:none;

 border-radius:9px;

 background:#f3f7f5;

 color:#809089;

 display:grid;
 place-items:center;

 font-size:8px;

}


/* =========================================================
   DETAIL VIEW
========================================================= */

.detailView{

 position:fixed;

 inset:0;

 z-index:500;

 background:
 rgba(20,40,32,.34);

 backdrop-filter:
 blur(9px);

 -webkit-backdrop-filter:
 blur(9px);

 opacity:0;

 visibility:hidden;

 pointer-events:none;

 transition:
 opacity .25s,
 visibility .25s;

}


.detailView.open{

 opacity:1;

 visibility:visible;

 pointer-events:auto;

}


.detailPanel{

 position:absolute;

 left:50%;

 bottom:0;

 width:100%;

 max-width:680px;

 height:
 min(94vh,850px);

 transform:
 translate(-50%,105%);

 background:var(--bg);

 border-radius:
 25px 25px 0 0;

 overflow:hidden;

 display:flex;

 flex-direction:column;

 box-shadow:
 0 -20px 70px
 rgba(0,0,0,.20);

 transition:
 transform .42s
 cubic-bezier(.2,.85,.2,1);

}


.detailView.open .detailPanel{

 transform:
 translate(-50%,0);

}


/* detail top */

.detailHeader{

 height:57px;

 flex:none;

 display:flex;

 align-items:center;

 gap:8px;

 padding:
 8px 12px;

 background:#fff;

 border-bottom:
 1px solid
 var(--line);

}


.backBtn,
.detailAction{

 width:38px;
 height:38px;

 border-radius:13px;

 background:#f3f7f5;

 color:var(--ink);

 display:grid;
 place-items:center;

 font-size:11px;

 flex:none;

}


.detailHeading{

 min-width:0;

 flex:1;

}


.detailHeading small{

 display:block;

 font-size:6.5px;

 font-weight:800;

 letter-spacing:.8px;

 color:var(--green);

}


.detailHeading b{

 display:block;

 margin-top:2px;

 font-size:10px;

 white-space:nowrap;

 overflow:hidden;

 text-overflow:ellipsis;

}


.detailActions{

 display:flex;

 gap:6px;

}


/* detail scroll */

.detailScroll{

 flex:1;

 overflow-y:auto;

 overscroll-behavior:contain;

 padding-bottom:35px;

}


.detailImageWrap{

 position:relative;

 width:100%;

 background:#e7efeb;

}


.detailImage{

 display:block;

 width:100%;

 max-height:310px;

 object-fit:cover;

}


.detailImageShade{

 position:absolute;

 left:0;
 right:0;
 bottom:0;

 height:100px;

 background:
 linear-gradient(
 transparent,
 rgba(0,0,0,.25)
 );

 pointer-events:none;

}


.detailBody{

 padding:
 17px 16px 30px;

 background:#fff;

}


.detailMeta{

 display:flex;

 align-items:center;

 flex-wrap:wrap;

 gap:6px;

}


.detailTitle{

 margin-top:11px;

 font-family:
 "Hind Siliguri",
 sans-serif;

 font-size:22px;

 line-height:1.38;

 font-weight:800;

 letter-spacing:-.2px;

}


/*
 IMPORTANT:
 English title is hidden by default.
*/

.englishTitle{

 display:none;

 margin-top:8px;

 color:var(--muted);

 font-size:10px;

 line-height:1.6;

 font-weight:600;

}


.englishTitle.visible{

 display:block;

}


.languageToggle{

 margin-top:9px;

 display:none;

}


.languageToggle.show{

 display:inline-flex;

 align-items:center;

 gap:5px;

 padding:
 7px 10px;

 border-radius:99px;

 background:#f1f5f3;

 color:#66756e;

 font-size:7px;

 font-weight:800;

}


.detailDescription{

 margin-top:15px;

 font-family:
 "Hind Siliguri",
 sans-serif;

 font-size:12px;

 line-height:1.9;

 color:#3d4e47;

 white-space:pre-line;

 word-break:break-word;

}


.detailDescription.en{

 display:none;

 margin-top:11px;

 font-family:Inter,sans-serif;

 font-size:9.5px;

 line-height:1.75;

 color:#68756f;

}


.detailDescription.en.visible{

 display:block;

}


.detailDivider{

 height:1px;

 background:#edf2ef;

 margin:
 17px 0
 13px;

}


/* =========================================================
   LINK AREA
========================================================= */

.linkBox{

 padding:12px;

 border-radius:16px;

 background:
 linear-gradient(
 135deg,
 #f5faf7,
 #eef7f3
 );

 border:
 1px solid
 #dcebe4;

}


.linkLabel{

 font-size:7px;

 color:var(--muted);

 font-weight:800;

 margin-bottom:8px;

}


.linkButtons{

 display:flex;

 gap:7px;

}


.linkBtn{

 flex:1;

 min-height:40px;

 border-radius:12px;

 font-size:8px;

 font-weight:800;

 display:flex;

 align-items:center;

 justify-content:center;

 gap:5px;

}


.openLink{

 background:var(--green);

 color:#fff;

}


.copyLink{

 background:var(--blueSoft);

 color:var(--blue);

}


/* =========================================================
   SHARE
========================================================= */

.shareRow{

 display:flex;

 gap:7px;

 margin-top:9px;

}


.shareBtn{

 flex:1;

 height:38px;

 border-radius:12px;

 background:#f3f7f5;

 color:#52635b;

 font-size:8px;

 font-weight:800;

}


/* =========================================================
   EMPTY / ERROR
========================================================= */

.state{

 text-align:center;

 padding:
 65px 22px;

}


.stateIcon{

 width:70px;
 height:70px;

 margin:
 0 auto
 14px;

 border-radius:23px;

 background:var(--soft);

 color:var(--green);

 display:grid;

 place-items:center;

 font-size:23px;

 animation:
 stateFloat 2.5s
 ease-in-out infinite;

}


@keyframes stateFloat{

 50%{
  transform:translateY(-5px);
 }

}


.state b{

 display:block;

 font-size:13px;

}


.state span{

 display:block;

 max-width:310px;

 margin:
 5px auto 0;

 color:var(--muted);

 font-size:9px;

 line-height:1.7;

}


.retry{

 margin-top:13px;

 padding:
 10px 15px;

 border-radius:13px;

 background:var(--green);

 color:#fff;

 font-size:8px;

 font-weight:800;

}


/* =========================================================
   SKELETON
========================================================= */

.skeleton{

 display:flex;

 gap:11px;

 padding:12px;

 background:#fff;

 border:
 1px solid
 var(--line);

 border-radius:19px;

 overflow:hidden;

}


.skeletonBox{

 background:
 linear-gradient(
 90deg,
 #edf2ef,
 #f7faf8,
 #edf2ef
 );

 background-size:200% 100%;

 animation:
 skeleton 1.3s infinite;

}


.skeletonThumb{

 width:61px;
 height:61px;

 flex:none;

 border-radius:16px;

}


.skeletonContent{

 flex:1;

}


.skeletonLine{

 height:8px;

 border-radius:5px;

 margin-bottom:8px;

}


.skeletonLine.short{

 width:42%;

}


.skeletonLine.medium{

 width:72%;

}


.skeletonLine.long{

 width:90%;

}


@keyframes skeleton{

 from{
  background-position:200% 0;
 }

 to{
  background-position:-200% 0;
 }

}


/* =========================================================
   TOAST
========================================================= */

.toast{

 position:fixed;

 left:50%;
 bottom:19px;

 z-index:1000;

 width:max-content;

 max-width:90%;

 padding:
 11px 14px;

 border-radius:14px;

 background:#18251f;

 color:#fff;

 font-size:8.5px;

 font-weight:700;

 text-align:center;

 opacity:0;

 pointer-events:none;

 transform:
 translate(-50%,18px);

 transition:.25s;

 box-shadow:
 0 12px 30px
 rgba(0,0,0,.20);

}


.toast.show{

 opacity:1;

 transform:
 translate(-50%,0);

}


/* =========================================================
   MOBILE
========================================================= */

@media(max-width:390px){

 .headerTitle{
  font-size:24px;
 }

 .itemTitle{
  font-size:12.5px;
 }

 .detailTitle{
  font-size:20px;
 }

}


/* =========================================================
   REDUCED MOTION
========================================================= */

@media(prefers-reduced-motion:reduce){

 *,
 *:before,
 *:after{

  animation:none!important;

  transition:none!important;

 }

}

</style>

</head>


<body>


<div class="app">


<!-- ======================================================
     HEADER
====================================================== -->

<header class="header">

 <div class="headerInner">

  <div class="brandRow">

   <div class="brandIcon">
    <i class="fa-solid fa-bell"></i>
   </div>

   <div class="brandText">

    <small>
     WILDLIFE EXPLORER
    </small>

    <b>
     Notification Center
    </b>

   </div>


   <div class="live">

    <span class="liveDot"></span>

    LIVE

   </div>

  </div>


  <div class="headerTitle">
   Notifications
  </div>


  <div class="headerSubtitle">
   Stay updated with the latest Wildlife Explorer news.
  </div>

 </div>

</header>


<!-- ======================================================
     MAIN
====================================================== -->

<main class="content">


<!-- SEARCH -->

<div class="utility">

 <div class="searchBox">

  <i class="fa-solid fa-magnifying-glass"></i>

  <input
   id="search"
   type="search"
   placeholder="Search notifications..."
   autocomplete="off"
  >

 </div>


 <button
  class="refresh"
  id="refreshBtn"
  onclick="loadNotifications(true)"
  aria-label="Refresh notifications"
 >

  <i class="fa-solid fa-rotate-right"></i>

 </button>

</div>


<!-- FILTER -->

<div class="filters">

 <button
  class="filter active"
  onclick="setFilter('all',this)"
 >

  <i class="fa-solid fa-layer-group"></i>

  All

 </button>


 <button
  class="filter"
  onclick="setFilter('app',this)"
 >

  <i class="fa-solid fa-mobile-screen"></i>

  App

 </button>


 <button
  class="filter"
  onclick="setFilter('park',this)"
 >

  <i class="fa-solid fa-tree"></i>

  Park

 </button>


 <button
  class="filter"
  onclick="setFilter('ticket',this)"
 >

  <i class="fa-solid fa-ticket"></i>

  Tickets

 </button>


 <button
  class="filter"
  onclick="setFilter('wildlife',this)"
 >

  <i class="fa-solid fa-paw"></i>

  Wildlife

 </button>


 <button
  class="filter"
  onclick="setFilter('travel',this)"
 >

  <i class="fa-solid fa-route"></i>

  Travel

 </button>


 <button
  class="filter"
  onclick="setFilter('important',this)"
 >

  <i class="fa-solid fa-star"></i>

  Important

 </button>

</div>


<!-- SUMMARY -->

<div class="summary">

 <div class="summaryLeft">

  <div class="summaryIcon">

   <i class="fa-regular fa-bell"></i>

/* =========================================================
   DATE
========================================================= */

function timeAgo(value){

 const d =
 new Date(value);

 if(
  isNaN(d.getTime())
 )
  return "";

 const diff =
 Math.floor(
  (Date.now()-d.getTime())/1000
 );


 if(diff < 60)
  return "এইমাত্র";


 if(diff < 3600)
  return Math.floor(diff/60)+" মিনিট আগে";


 if(diff < 86400)
  return Math.floor(diff/3600)+" ঘণ্টা আগে";


 if(diff < 604800)
  return Math.floor(diff/86400)+" দিন আগে";


 return d.toLocaleDateString(
  "bn-BD",
  {
   day:"numeric",
   month:"short",
   year:"numeric"
  }
 );

}

/* =========================================================
   VALID URL
========================================================= */

function validUrl(url){

 if(!url)
  return null;

 try{

  const u =
  new URL(url);

  if(
   u.protocol!=="http:" &&
   u.protocol!=="https:"
  )
   return null;

  return u.href;

 }catch{

  return null;

 }

}


/* =========================================================

function openLink(url){

 const safe =
 validUrl(url);

 if(!safe){

  return;

 }

 window.open(
  safe,
  "_blank",
  "noopener,noreferrer"
 );

}


/* =========================================================
   COPY LINK
========================================================= */

async function copyLink(url){

 const safe =
 validUrl(url);

 if(!safe){

  toast("No valid link available");

  return;

 }


 try{

  if(
   navigator.clipboard &&
   window.isSecureContext
  ){

   await navigator.clipboard.writeText(
    safe
   );

  }else{

   const textarea =
   document.createElement("textarea");

   textarea.value =
   safe;

   textarea.style.position =
   "fixed";

   textarea.style.opacity =
   "0";

   document.body.appendChild(
    textarea
   );

   textarea.focus();

   textarea.select();

   document.execCommand(
    "copy"
   );

   textarea.remove();

  }

  toast("Link copied successfully");

 }catch{

  toast("Unable to copy link");

 }

}

 try{

/* =========================================================

========================================================= */

function openFromHash(){

 const hash =
 location.hash;


 if(
  !hash.startsWith(
   "#notification="
  )
 )
  return;


 const id =
 decodeURIComponent(
  hash.replace(
   "#notification=",
   ""
  )
 );


 if(!id)
  return;


 const exists =
 notifications.some(
  item=>
  String(item.id)===String(id)
 );


 if(exists){

  setTimeout(
   ()=>{
    openNotification(id);
   },
   80
  );

 }

}

   location.hash
  ){

   openFromHash();

  }else{

   closeDetail();

  }

 }
);


/* =========================================================
   REALTIME
========================================================= */

try{

 db

 .channel(
  "notifications-live"
 )

 .on(

  "postgres_changes",

  {

   event:"*",

   schema:"public",

   table:"notifications"

  },

  payload=>{

   /*
    Debounce realtime events.
    Prevents multiple simultaneous
    reload requests.
   */

   clearTimeout(
    realtimeTimer
   );


   realtimeTimer =
   setTimeout(
    ()=>{

     loadNotifications(false);

    },
    350
   );

  }

 )

 .subscribe();

}catch(error){

 console.warn(
  "Realtime unavailable",
  error
 );

}


/* =========================================================
   ONLINE / OFFLINE
========================================================= */

window.addEventListener(
 "online",
 ()=>{

  toast(
   "Connection restored"
  );

  loadNotifications(false);

 }
);


window.addEventListener(
 "offline",
 ()=>{

  toast(
   "You are offline"
  );

 }
);


/* =========================================================
   SWIPE DOWN TO CLOSE DETAIL
========================================================= */

let touchStartY=0;

document
.getElementById(
 "detailScroll"
)
.addEventListener(
 "touchstart",
 event=>{

  touchStartY =
  event.touches[0].clientY;

 },
 {
  passive:true
 }
);


document
.getElementById(
 "detailScroll"
)
.addEventListener(
 "touchend",
 event=>{

  const endY =
  event.changedTouches[0].clientY;

  const diff =
  endY-touchStartY;


  /*
   Only close when user is
   near top and swipes down.
  */

  const scroll =
  document.getElementById(
   "detailScroll"
  );


  if(
   scroll.scrollTop<=2 &&
   diff>90
  ){

   closeDetail();

  }

 },
 {
  passive:true
 }
);


/* =========================================================
   ESC KEY
========================================================= */

document.addEventListener(
 "keydown",
 event=>{

  if(
   event.key==="Escape"
  ){

   closeDetail();

  }

 }
);


/* =========================================================
   INITIAL LOAD
========================================================= */

loadNotifications(false);

</script>

</body>
</html>
