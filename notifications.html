<!doctype html>
<html lang="bn">
<head>

<meta charset="utf-8">

<meta name="viewport"
content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">

<meta name="theme-color" content="#087d59">

<title>Notifications • Wildlife Explorer</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>


<style>

/* =========================================================
   ROOT
========================================================= */

:root{

 --bg:#f3f8f5;
 --card:#ffffff;

 --ink:#14231d;
 --ink2:#30423a;
 --muted:#74827b;

 --green:#087d59;
 --green2:#0ba978;

 --soft:#e8f6f0;

 --blue:#3978df;
 --blueSoft:#edf3ff;

 --orange:#d88a24;
 --orangeSoft:#fff2dc;

 --red:#d95252;
 --redSoft:#ffe8e8;

 --line:#dfeae5;

 --shadow:
 0 15px 45px rgba(20,70,53,.075);

 --shadowStrong:
 0 24px 70px rgba(20,70,53,.16);

}


/* =========================================================
   RESET
========================================================= */

*{
 box-sizing:border-box;
 -webkit-tap-highlight-color:transparent;
}

html{
 margin:0;
 padding:0;
 background:#dfe9e4;
 scroll-behavior:smooth;
}

body{
 margin:0;
 padding:0;

 color:var(--ink);

 background:#dfe9e4;

 font-family:
 Inter,
 "Hind Siliguri",
 sans-serif;

 overflow-x:hidden;

 -webkit-font-smoothing:antialiased;
 text-rendering:optimizeLegibility;
}

button,
input{
 font-family:inherit;
}

button{
 cursor:pointer;
}

img{
 max-width:100%;
}


/* =========================================================
   APP
========================================================= */

.app{

 width:100%;
 max-width:680px;

 min-height:100vh;

 margin:auto;

 background:var(--bg);

 position:relative;

 overflow:hidden;

}


/* =========================================================
   HEADER
========================================================= */

.header{

 position:relative;

 padding:
 18px
 16px
 20px;

 color:#fff;

 background:
 linear-gradient(
 135deg,
 #056b4b 0%,
 #087d59 48%,
 #0ca777 100%
 );

 overflow:hidden;

}

.header::before,
.header::after{

 content:"";

 position:absolute;

 border-radius:50%;

 background:
 rgba(255,255,255,.075);

 pointer-events:none;

}

.header::before{

 width:220px;
 height:220px;

 right:-110px;
 top:-145px;

 animation:
 headerFloat 8s ease-in-out infinite;

}

.header::after{

 width:130px;
 height:130px;

 left:-75px;
 bottom:-90px;

 animation:
 headerFloat2 7s ease-in-out infinite;

}

@keyframes headerFloat{

 50%{
  transform:
  translate(-10px,10px)
  scale(1.06);
 }

}

@keyframes headerFloat2{

 50%{
  transform:
  translate(10px,-8px);
 }

}

.headerContent{

 position:relative;

 z-index:2;

}


/* BRAND */

.brandLine{

 display:flex;

 align-items:center;

 gap:10px;

}

.brandIcon{

 width:42px;
 height:42px;

 flex:none;

 border-radius:15px;

 display:grid;

 place-items:center;

 background:
 rgba(255,255,255,.14);

 border:
 1px solid rgba(255,255,255,.12);

 box-shadow:
 0 8px 22px rgba(0,0,0,.08);

 animation:
 iconFloat 3s ease-in-out infinite;

}

@keyframes iconFloat{

 50%{
  transform:translateY(-2px);
 }

}

.brandText small{

 display:block;

 font-size:7px;

 font-weight:800;

 letter-spacing:1.2px;

 opacity:.68;

}

.brandText b{

 display:block;

 margin-top:2px;

 font-size:13px;

}


.liveBadge{

 margin-left:auto;

 display:flex;

 align-items:center;

 gap:6px;

 padding:
 6px
 9px;

 border-radius:99px;

 background:
 rgba(255,255,255,.12);

 border:
 1px solid rgba(255,255,255,.12);

 font-size:7px;

 font-weight:800;

}

.liveDot{

 width:6px;
 height:6px;

 border-radius:50%;

 background:#baffdb;

 box-shadow:
 0 0 0 4px
 rgba(186,255,219,.10);

 animation:
 livePulse 1.8s infinite;

}

@keyframes livePulse{

 50%{
  box-shadow:
  0 0 0 8px
  rgba(186,255,219,.02);
 }

}


/* HEADER TITLE */

.headerTitle{

 margin-top:19px;

 font-size:27px;

 line-height:1.1;

 font-weight:800;

 letter-spacing:-.7px;

}

.headerSubtitle{

 margin-top:5px;

 font-size:9px;

 line-height:1.55;

 opacity:.78;

}


/* =========================================================
   CONTENT
========================================================= */

.content{

 padding:
 13px
 14px
 35px;

}


/* =========================================================
   SEARCH
========================================================= */

.utility{

 display:flex;

 gap:8px;

 margin-bottom:11px;

}

.searchBox{

 flex:1;

 position:relative;

}

.searchBox i{

 position:absolute;

 left:12px;
 top:50%;

 transform:
 translateY(-50%);

 color:#89958f;

 font-size:10px;

 pointer-events:none;

}

.searchBox input{

 width:100%;

 height:40px;

 border:
 1px solid var(--line);

 border-radius:14px;

 outline:none;

 background:#fff;

 color:var(--ink);

 padding:
 0 12px
 0 32px;

 font-size:9px;

 box-shadow:
 0 7px 20px
 rgba(20,70,53,.035);

 transition:.2s;

}

.searchBox input:focus{

 border-color:#98d1ba;

 box-shadow:
 0 0 0 3px
 rgba(11,169,120,.08);

}

.refresh{

 width:40px;
 height:40px;

 flex:none;

 border:
 1px solid var(--line);

 border-radius:14px;

 background:#fff;

 color:var(--green);

 display:grid;

 place-items:center;

 box-shadow:
 0 7px 20px
 rgba(20,70,53,.035);

 transition:.18s;

}

.refresh:active{

 transform:scale(.94);

}

.refresh.loading i{

 animation:
 spin .7s linear infinite;

}


/* =========================================================
   FILTER
========================================================= */

.filters{

 display:flex;

 gap:7px;

 overflow-x:auto;

 padding:
 1px
 1px
 5px;

 scrollbar-width:none;

}

.filters::-webkit-scrollbar{
 display:none;
}

.filter{

 flex:none;

 border:
 1px solid var(--line);

 background:#fff;

 color:var(--muted);

 border-radius:99px;

 padding:
 8px
 12px;

 font-size:8px;

 font-weight:800;

 white-space:nowrap;

 transition:.2s;

}

.filter i{

 margin-right:4px;

}

.filter.active{

 color:#fff;

 background:var(--green);

 border-color:var(--green);

 box-shadow:
 0 7px 18px
 rgba(8,125,89,.16);

}


/* =========================================================
   SUMMARY
========================================================= */

.summary{

 margin:
 11px
 0
 12px;

 display:flex;

 align-items:center;

 justify-content:space-between;

}

.summaryLeft{

 display:flex;

 align-items:center;

 gap:8px;

}

.summaryIcon{

 width:31px;
 height:31px;

 border-radius:11px;

 background:var(--soft);

 color:var(--green);

 display:grid;

 place-items:center;

 font-size:10px;

}

.summaryText b{

 display:block;

 font-size:10px;

}

.summaryText span{

 display:block;

 margin-top:2px;

 color:var(--muted);

 font-size:7px;

}

.count{

 padding:
 6px
 9px;

 border-radius:99px;

 background:#fff;

 border:
 1px solid var(--line);

 color:var(--green);

 font-size:7px;

 font-weight:800;

}


/* =========================================================
   NOTIFICATION LIST
========================================================= */

.notificationList{

 display:flex;

 flex-direction:column;

 gap:9px;

}


/* =========================================================
   LIST ITEM
========================================================= */

.notificationItem{

 width:100%;

 border:
 1px solid var(--line);

 background:#fff;

 border-radius:19px;

 padding:12px;

 display:flex;

 align-items:center;

 gap:11px;

 text-align:left;

 box-shadow:
 0 8px 25px
 rgba(20,70,53,.045);

 position:relative;

 overflow:hidden;

 opacity:0;

 transform:
 translateY(12px)
 scale(.985);

 animation:
 itemIn .4s
 cubic-bezier(.2,.8,.2,1)
 forwards;

 transition:
 transform .2s,
 box-shadow .2s,
 border-color .2s;

}

@keyframes itemIn{

 to{

  opacity:1;

  transform:
  translateY(0)
  scale(1);

 }

}

.notificationItem:active{

 transform:
 scale(.975);

 box-shadow:
 0 4px 15px
 rgba(20,70,53,.07);

}

.notificationItem.important{

 border-color:#f0d5a5;

}

.notificationItem.urgent{

 border-color:#efbcbc;

}

.notificationItem.unread::before{

 content:"";

 position:absolute;

 left:0;

 top:10px;
 bottom:10px;

 width:3px;

 border-radius:0 5px 5px 0;

 background:var(--green);

}

.notificationItem.urgent.unread::before{

 background:var(--red);

}

.notificationItem.important.unread::before{

 background:var(--orange);

}


/* ITEM IMAGE */

.itemImage{

 width:57px;
 height:57px;

 flex:none;

 border-radius:15px;

 object-fit:cover;

 background:#edf3ef;

 border:
 1px solid #e3ece8;

}


/* ICON BOX */

.itemIcon{

 width:57px;
 height:57px;

 flex:none;

 border-radius:15px;

 background:var(--soft);

 color:var(--green);

 display:grid;

 place-items:center;

 font-size:17px;

}

.itemIcon.important{

 background:var(--orangeSoft);

 color:var(--orange);

}

.itemIcon.urgent{

 background:var(--redSoft);

 color:var(--red);

}


/* ITEM BODY */

.itemBody{

 min-width:0;

 flex:1;

}

.itemTop{

 display:flex;

 align-items:center;

 gap:5px;

 margin-bottom:4px;

 min-width:0;

}

.itemCategory{

 font-size:7px;

 font-weight:800;

 color:var(--green);

 background:var(--soft);

 padding:
 4px
 7px;

 border-radius:99px;

 white-space:nowrap;

 max-width:110px;

 overflow:hidden;

 text-overflow:ellipsis;

}

.itemCategory.important{

 color:var(--orange);

 background:var(--orangeSoft);

}

.itemCategory.urgent{

 color:var(--red);

 background:var(--redSoft);

}

.itemTime{

 color:#8a9690;

 font-size:6.5px;

 white-space:nowrap;

 overflow:hidden;

 text-overflow:ellipsis;

}

.itemTitle{

 font-family:
 "Hind Siliguri",
 sans-serif;

 font-size:13px;

 font-weight:700;

 line-height:1.42;

 display:-webkit-box;

 -webkit-line-clamp:2;

 -webkit-box-orient:vertical;

 overflow:hidden;

}

.itemPreview{

 margin-top:3px;

 color:#7b8781;

 font-family:
 "Hind Siliguri",
 sans-serif;

 font-size:8px;

 line-height:1.5;

 display:-webkit-box;

 -webkit-line-clamp:1;

 -webkit-box-orient:vertical;

 overflow:hidden;

}


/* CHEVRON */

.itemArrow{

 width:25px;
 height:25px;

 flex:none;

 border-radius:9px;

 background:#f2f6f4;

 color:#829089;

 display:grid;

 place-items:center;

 font-size:8px;

 transition:.2s;

}

.notificationItem:active
.itemArrow{

 background:var(--soft);

 color:var(--green);

 transform:
 translateX(2px);

}


/* =========================================================
   DETAIL VIEW
========================================================= */

.detailView{

 position:fixed;

 inset:0;

 z-index:500;

 background:#f3f8f5;

 display:none;

 overflow-y:auto;

 overscroll-behavior:contain;

 -webkit-overflow-scrolling:touch;

}

.detailView.active{

 display:block;

 animation:
 detailIn .28s
 cubic-bezier(.2,.8,.2,1)
 both;

}

@keyframes detailIn{

 from{

  opacity:0;

  transform:
  translateY(18px);

 }

 to{

  opacity:1;

  transform:none;

 }

}


/* =========================================================
   DETAIL HEADER
========================================================= */

.detailHeader{

 position:sticky;

 top:0;

 z-index:10;

 height:58px;

 display:flex;

 align-items:center;

 gap:10px;

 padding:
 0
 13px;

 color:#fff;

 background:
 linear-gradient(
 135deg,
 #056b4b,
 #087d59,
 #0ba978
 );

 box-shadow:
 0 5px 20px
 rgba(0,0,0,.08);

}

.backButton{

 width:38px;
 height:38px;

 flex:none;

 border:0;

 border-radius:13px;

 background:
 rgba(255,255,255,.13);

 color:#fff;

 display:grid;

 place-items:center;

 font-size:12px;

 transition:.18s;

}

.backButton:active{

 transform:scale(.90);

 background:
 rgba(255,255,255,.20);

}

.detailHeaderTitle{

 flex:1;

 min-width:0;

 font-size:12px;

 font-weight:800;

 white-space:nowrap;

 overflow:hidden;

 text-overflow:ellipsis;

}

.langButton{

 height:35px;

 padding:
 0
 10px;

 border:
 1px solid
 rgba(255,255,255,.16);

 border-radius:11px;

 background:
 rgba(255,255,255,.12);

 color:#fff;

 font-size:7px;

 font-weight:800;

 flex:none;

 transition:.18s;

}

.langButton:active{

 transform:scale(.94);

}


/* =========================================================
   DETAIL CONTENT
========================================================= */

.detailContent{

 max-width:680px;

 margin:auto;

 padding:
 12px
 0
 40px;

}


/*
  IMPORTANT BUG FIX:

  When there is NO hero image,
  the old margin-top:-16px caused
  Announcement / Urgent / time to touch
  the sticky header.

  Now normal detail body gets spacing.
*/

.detailContent.noHero{

 padding-top:13px;

}


/* =========================================================
   HERO
========================================================= */

.detailHero{

 position:relative;

 width:100%;

 background:#e9f0ec;

 overflow:hidden;

 border-radius:
 0
 0
 22px
 22px;

}

.detailHero img{

 display:block;

 width:100%;

 max-height:330px;

 object-fit:cover;

 animation:
 heroZoom .6s
 cubic-bezier(.2,.8,.2,1)
 both;

}

@keyframes heroZoom{

 from{

  opacity:0;

  transform:
  scale(1.04);

 }

 to{

  opacity:1;

  transform:
  scale(1);

 }

}


/* =========================================================
   DETAIL BODY
========================================================= */

.detailBody{

 padding:
 18px
 16px
 35px;

 background:#fff;

 border-radius:
 25px
 25px
 0
 0;

 margin-top:-16px;

 position:relative;

 z-index:2;

 box-shadow:
 0 -8px 30px
 rgba(20,70,53,.06);

}


/*
  NO HERO = NO NEGATIVE MARGIN
*/

.detailContent.noHero .detailBody{

 margin-top:0;

 border-radius:20px 20px 0 0;

 box-shadow:
 0 8px 30px
 rgba(20,70,53,.045);

}


/* =========================================================
   META
========================================================= */

.detailMeta{

 display:flex;

 flex-wrap:wrap;

 align-items:center;

 gap:7px;

}

.detailBadge{

 display:inline-flex;

 align-items:center;

 gap:5px;

 padding:
 6px
 9px;

 border-radius:99px;

 font-size:7px;

 font-weight:800;

 background:var(--soft);

 color:var(--green);

}

.detailBadge.important{

 background:var(--orangeSoft);

 color:var(--orange);

}

.detailBadge.urgent{

 background:var(--redSoft);

 color:var(--red);

}

.detailDate{

 color:var(--muted);

 font-size:7px;

 padding-left:2px;

}


/* =========================================================
   DETAIL TITLE
========================================================= */

.detailTitle{

 margin-top:13px;

 font-family:
 "Hind Siliguri",
 sans-serif;

 font-size:22px;

 line-height:1.42;

 font-weight:700;

 letter-spacing:-.2px;

 animation:
 titleReveal .35s ease both;

}

@keyframes titleReveal{

 from{

  opacity:0;

  transform:
  translateY(6px);

 }

 to{

  opacity:1;

  transform:none;

 }

}


/*
  OLD .detailEnglishTitle REMOVED.

  This was the reason Bengali + English
  title could appear together.

  Only the active language title is now shown.
*/


/* =========================================================
   LANGUAGE CONTENT
========================================================= */

.languagePanel{

 margin-top:19px;

}

.languageLabel{

 display:flex;

 align-items:center;

 gap:6px;

 color:var(--green);

 font-size:7px;

 font-weight:800;

 text-transform:uppercase;

 letter-spacing:.5px;

 margin-bottom:9px;

}

.languageLabel::after{

 content:"";

 height:1px;

 flex:1;

 background:#edf2ef;

}

.detailDescription{

 font-family:
 "Hind Siliguri",
 sans-serif;

 color:#3d4d45;

 font-size:13px;

 line-height:1.9;

 white-space:pre-line;

 animation:
 descriptionReveal .4s ease both;

}

.detailDescription.english{

 font-family:Inter,sans-serif;

 font-size:10px;

 line-height:1.75;

 color:#5f6d66;

}

@keyframes descriptionReveal{

 from{

  opacity:0;

  transform:
  translateY(5px);

 }

 to{

  opacity:1;

  transform:none;

 }

}


/* =========================================================
   ACTIONS
========================================================= */

.detailActions{

 margin-top:19px;

 padding-top:14px;

 border-top:
 1px solid #edf2ef;

 display:flex;

 gap:8px;

}

.detailAction{

 flex:1;

 min-height:42px;

 border:0;

 border-radius:13px;

 font-size:8px;

 font-weight:800;

 transition:.18s;

}

.detailAction:active{

 transform:scale(.96);

}

.openAction{

 background:var(--green);

 color:#fff;

 box-shadow:
 0 8px 18px
 rgba(8,125,89,.16);

}

.copyAction{

 background:var(--blueSoft);

 color:var(--blue);

}


/* =========================================================
   EMPTY / ERROR / LOADING
========================================================= */

.state{

 text-align:center;

 padding:
 60px
 20px;

}

.stateIcon{

 width:70px;
 height:70px;

 margin:
 0
 auto
 14px;

 border-radius:23px;

 background:var(--soft);

 color:var(--green);

 display:grid;

 place-items:center;

 font-size:23px;

 animation:
 stateFloat 2.4s
 ease-in-out infinite;

}

@keyframes stateFloat{

 50%{

  transform:
  translateY(-5px);

 }

}

.state b{

 display:block;

 font-size:13px;

}

.state span{

 display:block;

 max-width:310px;

 margin:
 5px
 auto
 0;

 color:var(--muted);

 font-size:9px;

 line-height:1.65;

}

.retry{

 margin-top:13px;

 border:0;

 border-radius:13px;

 padding:
 10px
 15px;

 background:var(--green);

 color:#fff;

 font-size:8px;

 font-weight:800;

}

.loading{

 text-align:center;

 padding:
 65px
 20px;

 color:var(--muted);

 font-size:9px;

}

.loadingIcon{

 width:48px;
 height:48px;

 margin:
 0
 auto
 13px;

 border-radius:16px;

 background:var(--soft);

 color:var(--green);

 display:grid;

 place-items:center;

}

.loadingIcon i{

 animation:
 spin .8s
 linear infinite;

}


/* =========================================================
   TOAST
========================================================= */

.toast{

 position:fixed;

 left:50%;

 bottom:18px;

 z-index:1000;

 width:max-content;

 max-width:90%;

 padding:
 11px
 14px;

 border-radius:14px;

 background:#18251f;

 color:#fff;

 font-size:9px;

 font-weight:700;

 text-align:center;

 opacity:0;

 transform:
 translate(-50%,18px);

 pointer-events:none;

 transition:.25s;

 box-shadow:
 0 12px 30px
 rgba(0,0,0,.2);

}

.toast.show{

 opacity:1;

 transform:
 translate(-50%,0);

}


/* =========================================================
   ANIMATIONS
========================================================= */

@keyframes spin{

 to{

  transform:
  rotate(360deg);

 }

}


/* =========================================================
   RESPONSIVE
========================================================= */

@media(max-width:390px){

 .headerTitle{

  font-size:24px;

 }

 .detailTitle{

  font-size:20px;

 }

 .itemTitle{

  font-size:12px;

 }

 .itemImage,
 .itemIcon{

  width:53px;
  height:53px;

 }

 .detailContent{

  padding-left:0;
  padding-right:0;

 }

}


/* =========================================================
   REDUCED MOTION
========================================================= */

@media(prefers-reduced-motion:reduce){

 *,
 *::before,
 *::after{

  animation-duration:.01ms !important;

  animation-iteration-count:1 !important;

  scroll-behavior:auto !important;

  transition-duration:.01ms !important;

 }

}

</style>

</head>


<body>


<!-- =======================================================
     MAIN APP
======================================================= -->

<div class="app" id="mainApp">


<header class="header">

 <div class="headerContent">

  <div class="brandLine">

   <div class="brandIcon">
    <i class="fa-solid fa-bell"></i>
   </div>

   <div class="brandText">

    <small>
     WILDLIFE EXPLORER
    </small>

    <b>
     Notification Center
    </b>

   </div>

   <div class="liveBadge">

    <span class="liveDot"></span>

    LIVE

   </div>

  </div>


  <div class="headerTitle">
   Notifications
  </div>

  <div class="headerSubtitle">
   Stay updated with the latest information.
  </div>

 </div>

</header>



<main class="content">


<!-- SEARCH -->

<div class="utility">

 <div class="searchBox">

  <i class="fa-solid fa-magnifying-glass"></i>

  <input
   id="search"
   type="search"
   placeholder="Search notifications..."
   autocomplete="off"
  >

 </div>


 <button
  class="refresh"
  id="refreshBtn"
  onclick="loadNotifications(true)"
  aria-label="Refresh notifications"
 >

  <i class="fa-solid fa-rotate-right"></i>

 </button>

</div>



<!-- FILTERS -->

<div class="filters">


 <button
  class="filter active"
  onclick="setFilter('all',this)"
 >

  <i class="fa-solid fa-layer-group"></i>
  All

 </button>


 <button
  class="filter"
  onclick="setFilter('app',this)"
 >

  <i class="fa-solid fa-mobile-screen"></i>
  App

 </button>


 <button
  class="filter"
  onclick="setFilter('park',this)"
 >

<script>

/* =========================================================
   SUPABASE
========================================================= */

const SUPABASE_URL =
"https://hnhphoqfylwbuptronqh.supabase.co";

const SUPABASE_KEY =
"sb_publishable_ZBJhCw5h6JKGRD29loq4bw_OV1G_Fz0";

const db =
window.supabase.createClient(
 SUPABASE_URL,
 SUPABASE_KEY
);


/* =========================================================
   STATE
========================================================= */

let notifications = [];

let currentFilter = "all";

let currentNotification = null;

let currentLanguage = "bn";

let searchTimer = null;

let loading = false;

let realtimeTimer = null;

let realtimeChannel = null;

let detailOpening = false;


/* =========================================================
   ICONS
========================================================= */

const ICONS = {

 bell:"fa-bell",

 tree:"fa-tree",

 ticket:"fa-ticket",

 paw:"fa-paw",

 route:"fa-route",

 app:"fa-mobile-screen",

 info:"fa-circle-info",

 warning:"fa-triangle-exclamation",

 calendar:"fa-calendar-days",

 location:"fa-location-dot",

 binoculars:"fa-binoculars",

 sparkles:"fa-sparkles",

 megaphone:"fa-bullhorn",

 download:"fa-download",

 announcement:"fa-bullhorn"

};


/* =========================================================
   CATEGORY
========================================================= */

const CATEGORY = {

 app:"App",

 park:"Park",

 ticket:"Tickets",

 wildlife:"Wildlife",

 travel:"Travel",

 announcement:"Announcement"

};


/* =========================================================
   ESCAPE HTML
========================================================= */

function esc(value){

 return String(value ?? "")

 .replace(/&/g,"&amp;")

 .replace(/</g,"&lt;")

 .replace(/>/g,"&gt;")

 .replace(/"/g,"&quot;")

 .replace(/'/g,"&#039;");

}


/* =========================================================
   TOAST
========================================================= */

function toast(message){

 const box =
 document.getElementById("toast");

 box.textContent =
 message;

 box.classList.add("show");

 clearTimeout(
  window.toastTimer
 );

 window.toastTimer =
 setTimeout(()=>{

  box.classList.remove("show");

 },2500);

}


/* =========================================================
   DATE
========================================================= */

function formatDate(value){

 const d =
 new Date(value);

 if(
  isNaN(d.getTime())
 )
  return "";

 return d.toLocaleDateString(
  "bn-BD",
  {
   day:"numeric",
   month:"long",
   year:"numeric"
  }
 );

}


/* =========================================================
   TIME AGO
========================================================= */

function timeAgo(value){

 const d =
 new Date(value);

 if(
  isNaN(d.getTime())
 )
  return "";

 const diff =
 Math.max(
  0,
  Math.floor(
   (Date.now()-d.getTime())/1000
  )
 );

 if(diff < 60)
  return "এইমাত্র";

 if(diff < 3600)
  return Math.floor(diff/60)+" মিনিট আগে";

 if(diff < 86400)
  return Math.floor(diff/3600)+" ঘণ্টা আগে";

 if(diff < 604800)
  return Math.floor(diff/86400)+" দিন আগে";

 return formatDate(value);

}


/* =========================================================
   ICON
========================================================= */

function iconName(value){

 return ICONS[value] ||
 "fa-bell";

}


/* =========================================================
   PRIORITY
========================================================= */

function priorityInfo(priority){

 if(priority==="urgent"){

  return {

   cls:"urgent",

   label:"Urgent",

   icon:"fa-triangle-exclamation"

  };

 }


 if(priority==="important"){

  return {

   cls:"important",

   label:"Important",

   icon:"fa-star"

  };

 }


 return {

  cls:"",

  label:"Update",

  icon:"fa-circle-info"

 };

}


/* =========================================================
   FILTER
========================================================= */

function setFilter(value,button){

 currentFilter =
 value;

 document
 .querySelectorAll(".filter")
 .forEach(el=>{

  el.classList.remove("active");

 });

 button.classList.add("active");

 render();

}


/* =========================================================
   SEARCH
========================================================= */

document
.getElementById("search")
.addEventListener(
 "input",
 ()=>{

  clearTimeout(
   searchTimer
  );

  searchTimer =
  setTimeout(
   render,
   120
  );

 }
);


/* =========================================================
   IMAGE URL VALIDATION
========================================================= */

function safeImage(url){

 if(!url)
  return "";

 try{

  const u =
  new URL(url);

  if(
   u.protocol==="http:" ||
   u.protocol==="https:"
  ){

   return u.href;

  }

 }catch(e){}

 return "";

}


/* =========================================================
   URL VALIDATION
========================================================= */

function validUrl(url){

 if(!url)
  return false;

 try{

  const u =
  new URL(url);

  return (
   u.protocol==="http:" ||
   u.protocol==="https:"
  );

 }catch{

  return false;

 }

}


/* =========================================================
   COPY
========================================================= */

async function copyLink(url){

 if(!validUrl(url)){

  toast("No valid link available");

  return;

 }


 try{

  if(
   navigator.clipboard &&
   window.isSecureContext
  ){

   await navigator.clipboard
   .writeText(url);

  }else{

   const textarea =
   document.createElement("textarea");

   textarea.value =
   url;

   textarea.style.position="fixed";

   textarea.style.opacity="0";

   document.body.appendChild(
    textarea
   );

   textarea.focus();

   textarea.select();

   document.execCommand(
    "copy"
   );

   textarea.remove();

  }

  toast(
   "Link copied successfully"
  );

 }catch(error){

  console.error(error);

  toast(
   "Unable to copy link"
  );

 }

}


/* =========================================================
   OPEN LINK
========================================================= */

function openLink(url){

 if(!validUrl(url)){

  toast("Invalid link");

  return;

 }

 window.open(
  url,
  "_blank",
  "noopener,noreferrer"
 );

}


/* =========================================================
   GET FILTERED DATA
========================================================= */

function getFilteredData(){

 const search =
 document
 .getElementById("search")
 .value
 .trim()
 .toLowerCase();


 return notifications.filter(
  item=>{

   if(
    currentFilter==="important"
   ){

    if(
     item.priority!=="important" &&
     item.priority!=="urgent"
    ){

     return false;

    }

   }else if(

    currentFilter!=="all" &&

    item.category!==currentFilter

   ){

    return false;

   }


   if(!search)
    return true;


   const searchable = [

    item.title_bn,

    item.description_bn,

    item.title_en,

    item.description_en,

    item.category,

    item.priority

   ]

   .join(" ")
   .toLowerCase();


   return searchable
   .includes(search);

  }
 );

}


/* =========================================================
   RENDER LIST
========================================================= */

function render(){

 const data =
 getFilteredData();


 document
 .getElementById("count")
 .textContent =
 data.length+" Updates";


 const list =
 document.getElementById("list");


 if(!data.length){

  list.innerHTML = `

   <div class="state">

    <div class="stateIcon">

     <i class="fa-regular fa-bell-slash"></i>

    </div>

    <b>
     No notifications found
    </b>

    <span>
     এই মুহূর্তে আপনার নির্বাচিত category-তে কোনো notification পাওয়া যায়নি।
    </span>

   </div>

  `;

  return;

 }


 list.innerHTML = `

  <div class="notificationList">

   ${data.map(
    (item,index)=>
    renderListItem(item,index)
   ).join("")}

  </div>

 `;

}


/* =========================================================
   LIST ITEM
========================================================= */

function renderListItem(item,index){

 const priority =
 priorityInfo(
  item.priority
 );


 const category =
 CATEGORY[item.category] ||

 item.category ||

 "App";


 const image =
 safeImage(
  item.image_url
 );


 const visual =
 image

 ? `

  <img
   class="itemImage"
   src="${esc(image)}"
   alt=""
   loading="lazy"
   onerror="this.style.display='none';this.nextElementSibling.style.display='grid';"
  >

  <div
   class="itemIcon ${priority.cls}"
   style="display:none"
  >

   <i class="fa-solid ${iconName(item.icon)}"></i>

  </div>

 `

 : `

  <div
   class="itemIcon ${priority.cls}"
  >

   <i class="fa-solid ${iconName(item.icon)}"></i>

  </div>

 `;


 /*
   Safer ID insertion.
 */

 const safeId =
 JSON.stringify(
  String(item.id)
 );


 return `

  <button

   class="
    notificationItem
    ${priority.cls}
    unread
   "

   style="
    animation-delay:${Math.min(index*45,350)}ms
   "

   onclick="openDetailById(${esc(safeId)})"

  >

   ${visual}


   <div class="itemBody">


    <div class="itemTop">


     <span
      class="itemCategory ${priority.cls}"
     >

      <i class="fa-solid ${iconName(item.icon)}"></i>

      ${esc(category)}

     </span>


     ${
      priority.cls

      ? `

       <span
        class="itemCategory ${priority.cls}"
       >

        <i class="fa-solid ${priority.icon}"></i>

        ${esc(priority.label)}

       </span>

      `

      :""
     }


     <span class="itemTime">

      ${esc(
       timeAgo(item.created_at)
      )}

     </span>


    </div>


    <!-- ONLY BANGLA TITLE IN LIST -->

    <div class="itemTitle">

     ${esc(
      item.title_bn ||
      item.title_en ||
      "Notification"
     )}

    </div>


    ${
     item.description_bn

     ? `

      <div class="itemPreview">

       ${esc(
        item.description_bn
       )}

      </div>

     `

     :""
    }


   </div>


   <div class="itemArrow">

    <i class="fa-solid fa-chevron-right"></i>

   </div>


  </button>

 `;

}


/* =========================================================
   OPEN DETAIL
========================================================= */

function openDetailById(id){

 if(detailOpening)
  return;

 const item =
 notifications.find(
  x=>String(x.id)===String(id)
 );


 if(!item){

  toast(
   "Notification unavailable"
  );

  return;

 }


 detailOpening=true;


 currentNotification =
 item;

 currentLanguage =
 "bn";


 renderDetail();


 const detail =
 document.getElementById(
  "detailView"
 );


 detail.classList.add(
  "active"
 );


 document.body.style.overflow =
 "hidden";


 /*
   Scroll detail to top every time.
 */

 detail.scrollTop=0;


 /*
   Browser history.
 */

 try{

  if(
   location.hash !==
   "#notification-"+encodeURIComponent(String(id))
  ){

   history.pushState(
    {
     notification:true,
     id:String(id)
    },
    "",
    "#notification-"+encodeURIComponent(String(id))
   );

  }

 }catch(e){}


 setTimeout(()=>{

  detailOpening=false;

 },320);

}


/* =========================================================
   RENDER DETAIL
========================================================= */

function renderDetail(){

 if(!currentNotification)
  return;


 const item =
 currentNotification;


 const priority =
 priorityInfo(
  item.priority
 );


 const category =
 CATEGORY[item.category] ||

 item.category ||

 "App";


 const image =
 safeImage(
  item.image_url
 );


 const isEnglish =
 currentLanguage==="en";


 /*
   IMPORTANT FIX:

   Only ONE title is rendered.
   English title is no longer displayed
   below the Bangla title.
 */

 const title =
 isEnglish

 ? (
   item.title_en ||
   item.title_bn ||
   "Notification"
  )

 : (
   item.title_bn ||
   item.title_en ||
   "Notification"
  );


 const description =
 isEnglish

 ? (
   item.description_en ||
   item.description_bn ||
   "No description available."
  )

 : (
   item.description_bn ||
   item.description_en ||
   "কোনো বিস্তারিত তথ্য পাওয়া যায়নি।"
  );


 document
 .getElementById(
  "detailHeaderTitle"
 )
 .textContent =
 title;


 document
 .getElementById(
  "langButton"
 )
 .textContent =
 isEnglish
 ? "বাংলা"
 : "English";


 const detailContent =
 document.getElementById(
  "detailContent"
 );


 /*
   Add noHero class.

   This is the MAJOR spacing fix.
 */

 detailContent.classList.toggle(
  "noHero",
  !image
 );


 detailContent.innerHTML = `


  ${
   image

   ? `

    <div class="detailHero">

     <img
      src="${esc(image)}"
      alt="${esc(title)}"
      onerror="
       this.parentElement.remove();
       document.getElementById('detailContent').classList.add('noHero');
      "
     >

    </div>

   `

   :""
  }


  <article class="detailBody">


   <div class="detailMeta">


    <span
     class="detailBadge ${priority.cls}"
    >

     <i class="fa-solid ${iconName(item.icon)}"></i>

     ${esc(category)}

    </span>


    ${
     priority.cls

     ? `

      <span
       class="detailBadge ${priority.cls}"
      >

       <i class="fa-solid ${priority.icon}"></i>

       ${esc(priority.label)}

      </span>

     `

     :""
    }


    <span class="detailDate">

     <i class="fa-regular fa-clock"></i>

     ${esc(
      timeAgo(item.created_at)
     )}

    </span>


   </div>


   <!-- ONLY CURRENT LANGUAGE TITLE -->

   <div class="detailTitle">

    ${esc(title)}

   </div>


   <div class="languagePanel">


    <div class="languageLabel">

     <i class="fa-solid fa-language"></i>

     ${
      isEnglish
      ? "English"
      : "বাংলা"
     }

    </div>


    <div
     class="
      detailDescription
      ${isEnglish?"english":""}
     "
    >

     ${esc(description)}

    </div>


   </div>


   ${
    item.action_url &&
    validUrl(item.action_url)

    ? `

     <div class="detailActions">


      <button
       class="detailAction openAction"
       onclick='openLink(${JSON.stringify(String(item.action_url))})'
      >

       <i class="fa-solid fa-arrow-up-right-from-square"></i>

       Open Link

      </button>


      <button
       class="detailAction copyAction"
       onclick='copyLink(${JSON.stringify(String(item.action_url))})'
      >

       <i class="fa-regular fa-copy"></i>

       Copy Link

      </button>


     </div>

    `

    :""
   }


  </article>

 `;

}


/* =========================================================
   LANGUAGE TOGGLE
========================================================= */

function toggleLanguage(){

 if(!currentNotification)
  return;


 currentLanguage =
 currentLanguage==="bn"
 ? "en"
 : "bn";


 renderDetail();


 const detail =
 document.getElementById(
  "detailView"
 );


 detail.scrollTop=0;

}


/* =========================================================
   CLOSE DETAIL
========================================================= */

function closeDetail(
 fromPopState=false
){

 const detail =
 document.getElementById(
  "detailView"
 );


 if(
  !detail.classList.contains(
   "active"
  )
 )
  return;


 detail.classList.remove(
  "active"
 );


 document.body.style.overflow =
 "";


 currentNotification =
 null;


 detailOpening=false;


 /*
   Remove hash safely.

   When normal back button is clicked,
   history.back() will trigger popstate.
 */

 if(
  !fromPopState &&
  location.hash.startsWith(
   "#notification-"
  )
 ){

  try{

   history.back();

  }catch(e){

   history.replaceState(
    null,
    "",
    location.pathname+
    location.search
   );

  }

 }

}


/* =========================================================
   BROWSER BACK
========================================================= */

window.addEventListener(
 "popstate",
 event=>{

  const detail =
  document.getElementById(
   "detailView"
  );


  if(
   detail.classList.contains(
    "active"
   )
  ){

   closeDetail(true);

  }

 }
);


/* =========================================================
   ESCAPE
========================================================= */

document.addEventListener(
 "keydown",
 event=>{

  if(
   event.key==="Escape"
  ){

   const detail =
   document.getElementById(
    "detailView"
   );


   if(
    detail.classList.contains(
     "active"
    )
   ){

    closeDetail();

   }

  }

 }
);


/* =========================================================
   LOAD NOTIFICATIONS
========================================================= */

async function loadNotifications(
 showToast=false
){

 if(loading)
  return;


 loading=true;


 const list =
 document.getElementById(
  "list"
 );


 const refresh =
 document.getElementById(
  "refreshBtn"
 );


 refresh.classList.add(
  "loading"
 );


 if(!notifications.length){

  list.innerHTML = `

   <div class="loading">

    <div class="loadingIcon">

     <i class="fa-solid fa-spinner"></i>

    </div>

    Loading notifications...

   </div>

  `;

 }


 try{


  const {
   data,
   error
  } =
  await db

  .from("notifications")

  .select(`

   id,

   title_bn,

   title_en,

   description_bn,

   description_en,

   category,

   icon,

   priority,

   is_published,

   created_at,

   updated_at,

   image_url,

   action_url

  `)

  .eq(
   "is_published",
   true
  )

  .order(
   "created_at",
   {
    ascending:false
   }
  );


  if(error)
   throw error;


  notifications =
  Array.isArray(data)
  ? data
  : [];


  render();


  if(showToast){

   toast(
    "Notifications refreshed"
   );

  }


 }catch(error){

  console.error(
   "Notification error:",
   error
  );


  if(!notifications.length){

   list.innerHTML = `

    <div class="state">

     <div class="stateIcon">

      <i class="fa-solid fa-cloud"></i>

     </div>

     <b>
      Unable to load notifications
     </b>

     <span>
      Notifications could not be loaded right now. Please check your connection and try again.
     </span>

     <button
      class="retry"
      onclick="loadNotifications(true)"
     >

      <i class="fa-solid fa-rotate-right"></i>

      Try Again

     </button>

    </div>

   `;

  }else{

   toast(
    "Could not refresh notifications"
   );

  }


 }finally{

  loading=false;

  refresh.classList.remove(
   "loading"
  );

 }

}


/* =========================================================
   REALTIME
========================================================= */

function setupRealtime(){

 try{

  if(realtimeChannel){

   try{

    db.removeChannel(
     realtimeChannel
    );

   }catch(e){}

  }


  realtimeChannel =

  db

  .channel(
   "notifications-live"
  )

  .on(

   "postgres_changes",

   {
    event:"*",
    schema:"public",
    table:"notifications"
   },

   payload=>{

    clearTimeout(
     realtimeTimer
    );


    realtimeTimer =

    setTimeout(
     ()=>{

      loadNotifications(false);

     },
     500
    );

   }

  )

  .subscribe(
   status=>{

    console.log(
     "Realtime status:",
     status
    );

   }
  );


 }catch(error){

  console.warn(
   "Realtime unavailable:",
   error
  );

 }

}

setupRealtime();


/* =========================================================
   ONLINE
========================================================= */

window.addEventListener(
 "online",
 ()=>{

  toast(
   "Connection restored"
  );

  loadNotifications(false);

 }
);


/* =========================================================
   OFFLINE
========================================================= */

window.addEventListener(
 "offline",
 ()=>{

  toast(
   "You are offline"
  );

 }
);


/* =========================================================
   VISIBILITY
========================================================= */

document.addEventListener(
 "visibilitychange",
 ()=>{

  if(
   document.visibilityState==="visible"
  ){

   /*
     Lightweight refresh when user
     returns to the app.
   */

   if(
    notifications.length
   ){

    loadNotifications(false);

   }

  }

 }
);


/* =========================================================
   INITIAL LOAD
========================================================= */

loadNotifications(false);


/* =========================================================
   HANDLE INITIAL HASH
========================================================= */

window.addEventListener(
 "load",
 ()=>{

  if(
   location.hash.startsWith(
    "#notification-"
   )
  ){

   const encodedId =
   location.hash
   .replace(
    "#notification-",
    ""
   );


   let id="";

   try{

    id =
    decodeURIComponent(
     encodedId
    );

   }catch(e){

    id=encodedId;

   }


   /*
     Data may not have loaded yet.
     Wait briefly if necessary.
   */

   const tryOpen=()=>{

    const item =
    notifications.find(
     x=>String(x.id)===String(id)
    );


    if(item){

     openDetailById(id);

     return true;

    }

    return false;

   };


   if(!tryOpen()){

    let attempts=0;

    const timer =
    setInterval(()=>{

     attempts++;

     if(
      tryOpen() ||
      attempts>=20
     ){

      clearInterval(timer);

     }

    },250);

   }

  }

 });

</script>
