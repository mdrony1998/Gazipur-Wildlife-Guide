<!doctype html>
<html lang="bn">
<head>

<meta charset="utf-8">

<meta name="viewport"
content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">

<meta name="theme-color" content="#087d59">

<title>Notifications • Wildlife Explorer</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link
href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700;800&display=swap"
rel="stylesheet">

<link
rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>


<style>

/* =========================================================
   ROOT
========================================================= */

:root{

 --bg:#f3f8f5;
 --card:#ffffff;

 --ink:#17251f;
 --muted:#74817b;

 --green:#087d59;
 --green2:#0baa79;

 --soft:#e8f6f0;

 --line:#dfeae5;

 --orange:#d98a24;
 --orangeSoft:#fff2dc;

 --red:#d65353;
 --redSoft:#ffe8e8;

 --blue:#3978df;
 --blueSoft:#edf3ff;

 --shadow:
 0 12px 38px rgba(20,70,53,.075);

 --shadow2:
 0 18px 50px rgba(20,70,53,.11);

}


/* =========================================================
   RESET
========================================================= */

*{
 box-sizing:border-box;
 -webkit-tap-highlight-color:transparent;
}

html,
body{

 margin:0;
 padding:0;

 background:#e3ebe7;

 color:var(--ink);

}

body{

 font-family:
 Inter,
 "Hind Siliguri",
 sans-serif;

}

button,
input{

 font-family:inherit;

}

button{

 cursor:pointer;

}


/* =========================================================
   APP
========================================================= */

.app{

 width:100%;
 max-width:680px;

 min-height:100vh;

 margin:auto;

 background:var(--bg);

 overflow:hidden;

 position:relative;

}


/* =========================================================
   HEADER
========================================================= */

.header{

 position:relative;

 overflow:hidden;

 padding:20px 17px 22px;

 color:#fff;

 background:
 linear-gradient(
 135deg,
 #056b4b 0%,
 #087d59 48%,
 #0ca777 100%
 );

}

.header:before,
.header:after{

 content:"";

 position:absolute;

 border-radius:50%;

 background:
 rgba(255,255,255,.075);

 pointer-events:none;

}

.header:before{

 width:220px;
 height:220px;

 right:-115px;
 top:-145px;

 animation:
 floatOne 8s ease-in-out infinite;

}

.header:after{

 width:130px;
 height:130px;

 left:-75px;
 bottom:-90px;

 animation:
 floatTwo 7s ease-in-out infinite;

}

@keyframes floatOne{

 50%{
  transform:
  translate(-10px,10px)
  scale(1.05);
 }

}

@keyframes floatTwo{

 50%{
  transform:
  translate(10px,-7px);
 }

}


.headerContent{

 position:relative;

 z-index:2;

}


.brandLine{

 display:flex;

 align-items:center;

 gap:10px;

}


.brandIcon{

 width:43px;
 height:43px;

 border-radius:15px;

 display:grid;

 place-items:center;

 background:
 rgba(255,255,255,.14);

 border:
 1px solid rgba(255,255,255,.12);

 box-shadow:
 0 8px 20px rgba(0,0,0,.08);

 animation:
 logoFloat 3s ease-in-out infinite;

}

@keyframes logoFloat{

 50%{
  transform:translateY(-2px);
 }

}


.brandText small{

 display:block;

 font-size:7px;

 font-weight:800;

 letter-spacing:1.2px;

 opacity:.68;

}

.brandText b{

 display:block;

 margin-top:2px;

 font-size:13px;

}


.liveBadge{

 margin-left:auto;

 display:flex;

 align-items:center;

 gap:5px;

 padding:6px 9px;

 border-radius:99px;

 font-size:7px;

 font-weight:800;

 background:
 rgba(255,255,255,.12);

 border:
 1px solid rgba(255,255,255,.12);

}


.liveDot{

 width:6px;
 height:6px;

 border-radius:50%;

 background:#b9ffda;

 box-shadow:
 0 0 0 4px rgba(185,255,218,.10);

 animation:
 livePulse 1.8s infinite;

}

@keyframes livePulse{

 50%{
  box-shadow:
  0 0 0 7px rgba(185,255,218,.03);
 }

}


.headerTitle{

 margin-top:20px;

 font-size:27px;

 line-height:1.1;

 font-weight:800;

 letter-spacing:-.7px;

}

.headerSubtitle{

 margin-top:5px;

 font-size:9px;

 opacity:.78;

 line-height:1.55;

}


/* =========================================================
   CONTENT
========================================================= */

.content{

 padding:14px 14px 35px;

}


/* =========================================================
   SEARCH
========================================================= */

.utility{

 display:flex;

 gap:8px;

 margin-bottom:11px;

}

.searchBox{

 flex:1;

 position:relative;

}

.searchBox i{

 position:absolute;

 left:12px;
 top:50%;

 transform:translateY(-50%);

 color:#8a9790;

 font-size:10px;

 pointer-events:none;

}

.searchBox input{

 width:100%;

 height:40px;

 padding:
 0
 12px
 0
 32px;

 border:
 1px solid var(--line);

 border-radius:14px;

 outline:none;

 background:#fff;

 color:var(--ink);

 font-size:9px;

 box-shadow:
 0 7px 20px rgba(20,70,53,.035);

}

.searchBox input:focus{

 border-color:#9ad3bd;

 box-shadow:
 0 0 0 3px rgba(11,169,120,.08);

}


.refresh{

 width:40px;
 height:40px;

 border:
 1px solid var(--line);

 border-radius:14px;

 background:#fff;

 color:var(--green);

 display:grid;

 place-items:center;

 box-shadow:
 0 7px 20px rgba(20,70,53,.035);

}

.refresh:active{

 transform:scale(.94);

}

.refresh.loading i{

 animation:
 spin .7s linear infinite;

}


/* =========================================================
   FILTERS
========================================================= */

.filters{

 display:flex;

 gap:7px;

 overflow-x:auto;

 padding:
 1px
 1px
 5px;

 scrollbar-width:none;

}

.filters::-webkit-scrollbar{

 display:none;

}

.filter{

 flex:none;

 border:
 1px solid var(--line);

 background:#fff;

 color:var(--muted);

 border-radius:99px;

 padding:
 8px
 12px;

 font-size:8px;

 font-weight:800;

 white-space:nowrap;

 transition:.2s;

}

.filter i{

 margin-right:4px;

}

.filter.active{

 background:var(--green);

 border-color:var(--green);

 color:#fff;

 box-shadow:
 0 7px 18px rgba(8,125,89,.16);

}


/* =========================================================
   SUMMARY
========================================================= */

.summary{

 margin:
 11px
 0
 12px;

 display:flex;

 align-items:center;

 justify-content:space-between;

}

.summaryLeft{

 display:flex;

 align-items:center;

 gap:8px;

}

.summaryIcon{

 width:31px;
 height:31px;

 border-radius:11px;

 background:var(--soft);

 color:var(--green);

 display:grid;

 place-items:center;

 font-size:10px;

}

.summaryText b{

 display:block;

 font-size:10px;

}

.summaryText span{

 display:block;

 margin-top:2px;

 color:var(--muted);

 font-size:7px;

}

.count{

 padding:
 6px
 9px;

 border-radius:99px;

 background:#fff;

 border:
 1px solid var(--line);

 color:var(--green);

 font-size:7px;

 font-weight:800;

}


/* =========================================================
   NOTIFICATION LIST CARD
========================================================= */

.notificationItem{

 position:relative;

 display:flex;

 gap:11px;

 margin-bottom:9px;

 padding:11px;

 background:#fff;

 border:
 1px solid var(--line);

 border-radius:18px;

 box-shadow:var(--shadow);

 cursor:pointer;

 overflow:hidden;

 animation:
 listIn .42s cubic-bezier(.2,.8,.2,1) both;

 transition:
 transform .2s,
 box-shadow .2s,
 border-color .2s;

}

.notificationItem:active{

 transform:scale(.985);

}

.notificationItem:hover{

 box-shadow:var(--shadow2);

 transform:translateY(-1px);

}

.notificationItem.important{

 border-color:#efd5a6;

}

.notificationItem.urgent{

 border-color:#efbaba;

}

@keyframes listIn{

 from{

  opacity:0;

  transform:
  translateY(12px)
  scale(.985);

 }

 to{

  opacity:1;

  transform:none;

 }

}


/* =========================================================
   LIST THUMBNAIL
========================================================= */

.thumb{

 position:relative;

 flex:none;

 width:76px;
 height:76px;

 border-radius:15px;

 overflow:hidden;

 background:
 linear-gradient(
 135deg,
 #e8f6f0,
 #dcefe7
 );

 display:grid;

 place-items:center;

 color:var(--green);

}

.thumb img{

 width:100%;
 height:100%;

 object-fit:cover;

 display:block;

 transition:
 transform .45s ease;

}

.notificationItem:hover .thumb img{

 transform:scale(1.06);

}

.thumbIcon{

 font-size:19px;

}

.thumbPriority{

 position:absolute;

 top:5px;
 left:5px;

 width:23px;
 height:23px;

 border-radius:8px;

 display:grid;

 place-items:center;

 background:
 rgba(255,255,255,.93);

 color:var(--orange);

 font-size:8px;

 box-shadow:
 0 4px 10px rgba(0,0,0,.08);

}

.thumbPriority.urgent{

 color:var(--red);

}


/* =========================================================
   LIST CONTENT
========================================================= */

.listBody{

 min-width:0;

 flex:1;

 padding:
 1px
 2px
 1px
 0;

}

.listMeta{

 display:flex;

 align-items:center;

 gap:5px;

 flex-wrap:wrap;

}

.listBadge{

 display:inline-flex;

 align-items:center;

 gap:4px;

 padding:
 4px
 7px;

 border-radius:99px;

 background:var(--soft);

 color:var(--green);

 font-size:6.5px;

 font-weight:800;

}

.listBadge.important{

 background:var(--orangeSoft);

 color:var(--orange);

}

.listBadge.urgent{

 background:var(--redSoft);

 color:var(--red);

}

.listDate{

 font-size:6.5px;

 color:var(--muted);

}

.listTitle{

 margin-top:5px;

 font-family:
 "Hind Siliguri",
 Inter,
 sans-serif;

 font-size:12px;

 line-height:1.38;

 font-weight:700;

 display:-webkit-box;

 -webkit-line-clamp:2;

 -webkit-box-orient:vertical;

 overflow:hidden;

}

.listEnglish{

 margin-top:2px;

 font-size:7.5px;

 color:var(--muted);

 font-weight:600;

 white-space:nowrap;

 overflow:hidden;

 text-overflow:ellipsis;

}

.listPreview{

 margin-top:5px;

 font-family:
 "Hind Siliguri",
 Inter,
 sans-serif;

 font-size:8px;

 line-height:1.5;

 color:#66746d;

 display:-webkit-box;

 -webkit-line-clamp:2;

 -webkit-box-orient:vertical;

 overflow:hidden;

}

.listArrow{

 position:absolute;

 right:9px;

 bottom:9px;

 width:22px;
 height:22px;

 border-radius:8px;

 display:grid;

 place-items:center;

 background:#f1f6f3;

 color:var(--green);

 font-size:7px;

}


/* =========================================================
   DETAIL OVERLAY
========================================================= */

.detailOverlay{

 position:fixed;

 inset:0;

 z-index:80;

 background:
 rgba(7,27,19,.42);

 backdrop-filter:
 blur(7px);

 display:none;

 align-items:flex-end;

 justify-content:center;

}

.detailOverlay.show{

 display:flex;

}

.detailSheet{

 width:100%;

 max-width:680px;

 max-height:96vh;

 overflow-y:auto;

 background:var(--bg);

 border-radius:
 27px
 27px
 0
 0;

 animation:
 detailUp .38s cubic-bezier(.2,.8,.2,1);

 scrollbar-width:none;

}

.detailSheet::-webkit-scrollbar{

 display:none;

}

@keyframes detailUp{

 from{

  opacity:0;

  transform:translateY(100%);

 }

 to{

  opacity:1;

  transform:none;

 }

}


/* =========================================================
   DETAIL TOP BAR
========================================================= */

.detailTop{

 position:sticky;

 top:0;

 z-index:10;

 height:52px;

 display:flex;

 align-items:center;

 justify-content:space-between;

 padding:
 0
 14px;

 background:
 rgba(255,255,255,.92);

 backdrop-filter:
 blur(12px);

 border-bottom:
 1px solid var(--line);

}

.backBtn,
.closeBtn{

 width:35px;
 height:35px;

 border:0;

 border-radius:11px;

 background:#f0f5f2;

 color:var(--ink);

 display:grid;

 place-items:center;

 font-size:11px;

}

.detailTopTitle{

 font-size:10px;

 font-weight:800;

}

.detailContent{

 padding-bottom:35px;

}


/* =========================================================
   DETAIL IMAGE
========================================================= */

.detailImageWrap{

 position:relative;

 width:100%;

 background:#e8efeb;

 overflow:hidden;

}

.detailImage{

 display:block;

 width:100%;

 max-height:310px;

 min-height:180px;

 object-fit:cover;

}

.detailImageShade{

 position:absolute;

 left:0;
 right:0;
 bottom:0;

 height:100px;

 background:
 linear-gradient(
  transparent,
  rgba(0,0,0,.23)
 );

 pointer-events:none;

}

.detailImagePriority{

 position:absolute;

 left:14px;
 top:14px;

 padding:
 8px
 11px;

 border-radius:99px;

 background:
 rgba(255,255,255,.94);

 backdrop-filter:
 blur(10px);

 font-size:7px;

 font-weight:800;

 box-shadow:
 0 7px 18px rgba(0,0,0,.08);

}


/* =========================================================
   DETAIL BODY
========================================================= */

.detailBody{

 background:#fff;

 padding:
 16px;

 border:
 1px solid var(--line);

 border-top:0;

 border-radius:
 0
 0
 23px
 23px;

 box-shadow:var(--shadow2);

}

.detailMeta{

 display:flex;

 align-items:center;

 flex-wrap:wrap;

 gap:6px;

}

.detailBadge{

 display:inline-flex;

 align-items:center;

 gap:5px;

 padding:
 6px
 9px;

 border-radius:99px;

 background:var(--soft);

 color:var(--green);

 font-size:7px;

 font-weight:800;

}

.detailBadge.important{

 background:var(--orangeSoft);

 color:var(--orange);

}

.detailBadge.urgent{

 background:var(--redSoft);

 color:var(--red);

}

.detailDate{

 color:var(--muted);

 font-size:7px;

}

.detailTitle{

 margin-top:10px;

 font-family:
 "Hind Siliguri",
 Inter,
 sans-serif;

 font-size:20px;

 line-height:1.42;

 font-weight:800;

}

.detailEnglishTitle{

 margin-top:4px;

 color:var(--muted);

 font-size:9px;

 line-height:1.55;

 font-weight:600;

}

.detailDivider{

 height:1px;

 background:#edf2ef;

 margin:
 15px
 0;

}

.detailDescription{

 font-family:
 "Hind Siliguri",
 Inter,
 sans-serif;

 font-size:12px;

 line-height:1.9;

 color:#405049;

 white-space:pre-line;

}

.detailDescription.en{

 margin-top:13px;

 font-family:Inter,sans-serif;

 font-size:9.5px;

 line-height:1.75;

 color:#66746d;

}


/* =========================================================
   LINK ACTIONS
========================================================= */

.detailActions{

 margin-top:17px;

 display:flex;

 gap:8px;

}

.detailAction{

 flex:1;

 min-height:42px;

 border:0;

 border-radius:13px;

 font-size:8px;

 font-weight:800;

 transition:.18s;

}

.detailAction:active{

 transform:scale(.96);

}

.openLinkBtn{

 background:var(--green);

 color:#fff;

}

.copyLinkBtn{

 background:var(--blueSoft);

 color:var(--blue);

}

.detailAction i{

 margin-right:4px;

}


/* =========================================================
   EMPTY / LOADING
========================================================= */

.state{

 text-align:center;

 padding:
 58px
 20px;

}

.stateIcon{

 width:70px;
 height:70px;

 margin:
 0
 auto
 14px;

 border-radius:23px;

 background:var(--soft);

 color:var(--green);

 display:grid;

 place-items:center;

 font-size:24px;

 animation:
 stateFloat 2.4s ease-in-out infinite;

}

@keyframes stateFloat{

 50%{
  transform:translateY(-5px);
 }

}

.state b{

 display:block;

 font-size:13px;

}

.state span{

 display:block;

 max-width:300px;

 margin:
 5px
 auto
 0;

 color:var(--muted);

 font-size:9px;

 line-height:1.65;

}

.retry{

 margin-top:13px;

 border:0;

 border-radius:13px;

 padding:
 10px
 15px;

 background:var(--green);

 color:#fff;

 font-size:8px;

 font-weight:800;

}

.loading{

 text-align:center;

 padding:
 65px
 20px;

 color:var(--muted);

 font-size:9px;

}

.loadingIcon{

 width:48px;
 height:48px;

 margin:
 0
 auto
 13px;

 border-radius:16px;

 display:grid;

 place-items:center;

 background:var(--soft);

 color:var(--green);

}

.loadingIcon i{

 animation:
 spin .8s linear infinite;

}

@keyframes spin{

 to{
  transform:rotate(360deg);
 }

}


/* =========================================================
   TOAST
========================================================= */

.toast{

 position:fixed;

 left:50%;
 bottom:18px;

 z-index:200;

 width:max-content;

 max-width:90%;

 padding:
 11px
 14px;

 border-radius:14px;

 background:#18251f;

 color:#fff;

 font-size:9px;

 font-weight:700;

 text-align:center;

 opacity:0;

 transform:
 translate(-50%,18px);

 pointer-events:none;

 transition:.25s;

 box-shadow:
 0 12px 30px rgba(0,0,0,.2);

}

.toast.show{

 opacity:1;

 transform:
 translate(-50%,0);

}


/* =========================================================
   MOBILE
========================================================= */

@media(max-width:390px){

 .headerTitle{
  font-size:24px;
 }

 .thumb{

  width:70px;
  height:70px;

 }

 .listTitle{

  font-size:11px;

 }

 .detailTitle{

  font-size:18px;

 }

 .detailDescription{

  font-size:11.5px;

 }

}


/* =========================================================
   REDUCED MOTION
========================================================= */

@media(prefers-reduced-motion:reduce){

 *,
 *::before,
 *::after{

  animation-duration:.01ms!important;

  animation-iteration-count:1!important;

  scroll-behavior:auto!important;

  transition:none!important;

 }

}

</style>
</head>


<body>


<div class="app">


<!-- =====================================================
     HEADER
===================================================== -->

<header class="header">

 <div class="headerContent">

  <div class="brandLine">

   <div class="brandIcon">
    <i class="fa-solid fa-bell"></i>
   </div>

   <div class="brandText">

    <small>
     WILDLIFE EXPLORER
    </small>

    <b>
     Notification Center
    </b>

   </div>

   <div class="liveBadge">

    <span class="liveDot"></span>

    LIVE

   </div>

  </div>


  <div class="headerTitle">
   Notifications
  </div>


  <div class="headerSubtitle">
   Latest updates, announcements & useful information.
  </div>

 </div>

</header>



<main class="content">


<!-- =====================================================
     SEARCH
===================================================== -->

<div class="utility">

 <div class="searchBox">

  <i class="fa-solid fa-magnifying-glass"></i>

  <input
   id="search"
   type="search"
   placeholder="Search notifications..."
   autocomplete="off"
  >

 </div>


 <button
  class="refresh"
  id="refreshBtn"
  onclick="loadNotifications(true)"
  aria-label="Refresh"
 >

  <i class="fa-solid fa-rotate-right"></i>

 </button>

</div>



<!-- =====================================================
     FILTERS
===================================================== -->

<div class="filters">

 <button
  class="filter active"
  onclick="setFilter('all',this)"
 >

  <i class="fa-solid fa-layer-group"></i>
  All

 </button>


 <button
  class="filter"
  onclick="setFilter('app',this)"
 >

  <i class="fa-solid fa-mobile-screen"></i>
  App

 </button>


 <button
  class="filter"
  onclick="setFilter('park',this)"
 >

  <i class="fa-solid fa-tree"></i>
  Park

 </button>


 <button
  class="filter"
  onclick="setFilter('ticket',this)"
 >

  <i class="fa-solid fa-ticket"></i>
  Tickets

 </button>


 <button
  class="filter"
  onclick="setFilter('wildlife',this)"
 >

  <i class="fa-solid fa-paw"></i>
  Wildlife

 </button>


 <button
  class="filter"
  onclick="setFilter('travel',this)"
 >

  <i class="fa-solid fa-route"></i>
  Travel

 </button>


 <button
  class="filter"
  onclick="setFilter('important',this)"
 >

  <i class="fa-solid fa-star"></i>
  Important

 </button>

</div>



<!-- =====================================================
     SUMMARY
===================================================== -->

<div class="summary">

 <div class="summaryLeft">

  <div class="summaryIcon">

   <i class="fa-regular fa-bell"></i>

  </div>


  <div class="summaryText">

   <b>
    Latest Notifications
   </b>

   <span>
    Stay updated with Wildlife Explorer
   </span>

  </div>

 </div>


 <div
  class="count"
  id="count"
 >
  0 Updates
 </div>

</div>



<!-- =====================================================
     LIST
===================================================== -->

<div id="list">

 <div class="loading">

  <div class="loadingIcon">

   <i class="fa-solid fa-spinner"></i>

  </div>

  Loading notifications...

 </div>

</div>


</main>

</div>



<!-- =====================================================
     DETAIL OVERLAY
===================================================== -->

<div
 id="detailOverlay"
 class="detailOverlay"
 onclick="overlayClose(event)"
>

 <div
  class="detailSheet"
  id="detailSheet"
 >

  <div class="detailTop">

   <button
    class="backBtn"
    onclick="closeDetail()"
    aria-label="Back"
   >

    <i class="fa-solid fa-arrow-left"></i>

   </button>


   <div class="detailTopTitle">
    Notification
   </div>


   <button
    class="closeBtn"
    onclick="closeDetail()"
    aria-label="Close"
   >

    <i class="fa-solid fa-xmark"></i>

   </button>

  </div>


  <div
   id="detailContent"
   class="detailContent"
  ></div>

 </div>

</div>



<!-- =====================================================
     TOAST
===================================================== -->

<div
 id="toast"
 class="toast"
></div>



<script>

/* =========================================================

/* =========================================================
   ESCAPE HTML
========================================================= */

function esc(value){

 return String(value ?? "")
  .replace(/&/g,"&amp;")
  .replace(/</g,"&lt;")
  .replace(/>/g,"&gt;")
  .replace(/"/g,"&quot;")
  .replace(/'/g,"&#039;");

}


/* =========================================================
   TOAST
========================================================= */

function toast(message){

 const box =
 document.getElementById("toast");

 box.textContent =
 message;

 box.classList.add("show");

 clearTimeout(
  window.toastTimer
 );

 window.toastTimer =
 setTimeout(()=>{

  box.classList.remove("show");

 },2500);

}


/* =========================================================
   DATE
========================================================= */

function formatDate(value){

 const d =
 new Date(value);

 if(
  isNaN(d.getTime())
 )
  return "";

 return d.toLocaleDateString(
  "bn-BD",
  {
   day:"numeric",
   month:"long",
   year:"numeric"
  }
 );

}


/* =========================================================
   TIME AGO
========================================================= */

function timeAgo(value){

 const d =
 new Date(value);

 if(
  isNaN(d.getTime())
 )
  return "";

 const diff =
 Math.floor(
  (Date.now()-
   d.getTime())/1000
 );


 if(diff<60)
  return "এইমাত্র";


 if(diff<3600)
  return (
   Math.floor(diff/60)
   +" মিনিট আগে"
  );


 if(diff<86400)
  return (
   Math.floor(diff/3600)
   +" ঘণ্টা আগে"
  );


 if(diff<604800)
  return (
   Math.floor(diff/86400)
   +" দিন আগে"
  );


 return formatDate(value);

}

/* =========================================================
   COPY LINK
========================================================= */

async function copyLink(url){

 if(!url){

  toast(
   "No link available"
  );

  return;

 }


 try{

  if(
   navigator.clipboard &&
   window.isSecureContext
  ){

   await navigator
   .clipboard
   .writeText(url);

  }else{

   const textarea =
   document.createElement(
    "textarea"
   );

   textarea.value =
   url;

   textarea.style.position =
   "fixed";

   textarea.style.opacity =
   "0";

   document.body.appendChild(
    textarea
   );

   textarea.focus();

   textarea.select();

   document.execCommand(
    "copy"
   );

   textarea.remove();

  }


  toast(
   "Link copied successfully"
  );


 }catch(error){

  toast(
   "Unable to copy link"
  );

 }

}


/* =========================================================
   OPEN LINK
========================================================= */

function openLink(url){

 if(!url)
  return;


 try{

  const parsed =
  new URL(url);


  if(
   parsed.protocol!=="http:" &&
   parsed.protocol!=="https:"
  ){

   toast(
    "Invalid link"
   );

   return;

  }


  window.open(
   parsed.href,
   "_blank",
   "noopener,noreferrer"
  );


 }catch{

  toast(
   "Invalid link"
  );

 }

}

/* =========================================================
   LOAD NOTIFICATIONS
========================================================= */

async function loadNotifications(
 showToast=false
){

 const list =
 document.getElementById(
  "list"
 );


 const refresh =
 document.getElementById(
  "refreshBtn"
 );


 refresh.classList.add(
  "loading"
 );


 list.innerHTML = `

  <div class="loading">

   <div class="loadingIcon">

    <i class="fa-solid fa-spinner"></i>

   </div>

   Loading notifications...

  </div>

 `;


 try{

  const {
   data,
   error
  } =
  await db
  .from("notifications")
  .select(`
   id,
   title_bn,
   title_en,
   description_bn,
   description_en,
   category,
   icon,
   priority,
   is_published,
   created_at,
   updated_at,
   image_url,
   action_url
  `)
  .eq(
   "is_published",
   true
  )
  .order(
   "created_at",
   {
    ascending:false
   }
  );


  if(error)
   throw error;


  notifications =
  Array.isArray(data)
  ? data
  : [];


  render();


  if(showToast){

   toast(
    "Notifications refreshed"
   );

  }


 }catch(error){

  console.error(
   "Notification loading error:",
   error
  );


  list.innerHTML = `

   <div class="state">

    <div class="stateIcon">

     <i
      class="fa-solid fa-cloud"
     ></i>

    </div>


    <b>
     Unable to load notifications
    </b>


    <span>
     Notifications could not be
     loaded right now.
     Please try again.
    </span>


    <button
     class="retry"
     onclick="loadNotifications(true)"
    >

     <i
      class="fa-solid fa-rotate-right"
     ></i>

     Try Again

    </button>

   </div>

  `;

 }finally{

  refresh.classList.remove(
   "loading"
  );

 }

}


/* =========================================================
   REALTIME
========================================================= */

try{

 db
 .channel(
  "notifications-live"
 )
 .on(
  "postgres_changes",
  {
   event:"*",
   schema:"public",
   table:"notifications"
  },
  payload=>{

   /*
    Whenever a notification is
    inserted/updated/deleted,
    refresh the public list.
   */

   loadNotifications(false);

  }
 )
 .subscribe();

}catch(error){

 console.warn(

 );

}
