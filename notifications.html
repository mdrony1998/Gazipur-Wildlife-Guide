<!doctype html>
<html lang="bn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">

<meta name="theme-color" content="#087d59">
<meta name="color-scheme" content="light">

<title>Notifications • Wildlife Explorer</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
:root{
 --bg:#f4f8f6;
 --white:#ffffff;
 --ink:#17251f;
 --text:#34453d;
 --muted:#78877f;
 --line:#e2ebe6;

 --green:#087d59;
 --green2:#0baa79;
 --greenSoft:#e8f7f1;

 --blue:#3978df;
 --blueSoft:#edf3ff;

 --orange:#d98a20;
 --orangeSoft:#fff3df;

 --red:#d65353;
 --redSoft:#ffebeb;

 --shadow:0 12px 35px rgba(20,70,53,.07);
 --shadow2:0 20px 60px rgba(20,70,53,.11);
}

*{
 box-sizing:border-box;
 -webkit-tap-highlight-color:transparent;
}

html,body{
 margin:0;
 padding:0;
 background:#dfe9e4;
 color:var(--ink);
}

body{
 font-family:Inter,"Hind Siliguri",sans-serif;
}

button,
input{
 font-family:inherit;
}

button{
 cursor:pointer;
}

.app{
 width:100%;
 max-width:680px;
 min-height:100vh;
 margin:auto;
 background:var(--bg);
 overflow:hidden;
 position:relative;
}

/* ================= HEADER ================= */

.header{
 position:relative;
 padding:20px 17px 24px;
 color:white;
 overflow:hidden;
 background:
 linear-gradient(135deg,#056b4b 0%,#087d59 48%,#0ba474 100%);
}

.header::before{
 content:"";
 position:absolute;
 width:230px;
 height:230px;
 right:-115px;
 top:-145px;
 border-radius:50%;
 background:rgba(255,255,255,.075);
 animation:headerFloat 8s ease-in-out infinite;
}

.header::after{
 content:"";
 position:absolute;
 width:130px;
 height:130px;
 left:-80px;
 bottom:-90px;
 border-radius:50%;
 background:rgba(255,255,255,.07);
 animation:headerFloat2 7s ease-in-out infinite;
}

@keyframes headerFloat{
 50%{transform:translate(-12px,12px) scale(1.05)}
}

@keyframes headerFloat2{
 50%{transform:translate(10px,-8px) scale(.95)}
}

.headerContent{
 position:relative;
 z-index:2;
}

.headerTop{
 display:flex;
 align-items:center;
 justify-content:space-between;
}

.brand{
 display:flex;
 align-items:center;
 gap:10px;
}

.brandIcon{
 width:43px;
 height:43px;
 border-radius:15px;
 display:grid;
 place-items:center;
 background:rgba(255,255,255,.14);
 border:1px solid rgba(255,255,255,.13);
 box-shadow:inset 0 1px 0 rgba(255,255,255,.15);
 font-size:17px;
}

.brandText small{
 display:block;
 font-size:7px;
 font-weight:800;
 letter-spacing:1.5px;
 opacity:.72;
}

.brandText strong{
 display:block;
 font-size:14px;
 margin-top:2px;
}

.live{
 display:flex;
 align-items:center;
 gap:5px;
 padding:6px 9px;
 border-radius:50px;
 font-size:7px;
 font-weight:800;
 background:rgba(255,255,255,.11);
 border:1px solid rgba(255,255,255,.12);
}

.liveDot{
 width:6px;
 height:6px;
 border-radius:50%;
 background:#baffd9;
 box-shadow:0 0 0 4px rgba(186,255,217,.08);
 animation:livePulse 1.8s infinite;
}

@keyframes livePulse{
 50%{opacity:.45;transform:scale(.75)}
}

.hero{
 margin-top:22px;
}

.heroLabel{
 font-size:8px;
 font-weight:800;
 letter-spacing:.8px;
 opacity:.68;
}

.heroTitle{
 margin:5px 0 3px;
 font-size:27px;
 line-height:1.15;
 font-weight:800;
 letter-spacing:-.5px;
}

.heroSub{
 font-size:9px;
 line-height:1.6;
 opacity:.78;
 max-width:420px;
}

/* ================= CONTENT ================= */

.content{
 padding:14px;
}

/* ================= CONTROL BAR ================= */

.control{
 display:flex;
 align-items:center;
 gap:8px;
 margin-bottom:13px;
}

.searchBox{
 flex:1;
 height:42px;
 position:relative;
}

.searchBox i{
 position:absolute;
 left:13px;
 top:50%;
 transform:translateY(-50%);
 color:#94a19b;
 font-size:11px;
 pointer-events:none;
}

.searchBox input{
 width:100%;
 height:100%;
 border:1px solid var(--line);
 border-radius:14px;
 background:white;
 outline:none;
 padding:0 12px 0 35px;
 color:var(--ink);
 font-size:9px;
 box-shadow:var(--shadow);
}

.searchBox input:focus{
 border-color:#9bd6c1;
 box-shadow:0 0 0 3px rgba(11,170,121,.07);
}

.refresh{
 width:42px;
 height:42px;
 border:1px solid var(--line);
 background:white;
 border-radius:14px;
 color:var(--green);
 box-shadow:var(--shadow);
 transition:.2s;
}

.refresh:active{
 transform:scale(.93);
}

.refresh.loading i{
 animation:spin .7s linear infinite;
}

@keyframes spin{
 to{transform:rotate(360deg)}
}

/* ================= FILTER ================= */

.filters{
 display:flex;
 gap:7px;
 overflow-x:auto;
 padding:1px 1px 5px;
 scrollbar-width:none;
}

.filters::-webkit-scrollbar{
 display:none;
}

.filter{
 flex:none;
 border:1px solid var(--line);
 background:#fff;
 color:#718078;
 border-radius:50px;
 padding:8px 12px;
 font-size:8px;
 font-weight:800;
 transition:.2s;
}

.filter i{
 margin-right:4px;
}

.filter.active{
 background:var(--green);
 color:#fff;
 border-color:var(--green);
 box-shadow:0 6px 16px rgba(8,125,89,.17);
}

.filter:active{
 transform:scale(.95);
}

/* ================= SUMMARY ================= */

.summary{
 margin:13px 0;
 padding:12px 13px;
 border-radius:17px;
 background:linear-gradient(135deg,#ffffff,#f7fbf9);
 border:1px solid var(--line);
 display:flex;
 align-items:center;
 justify-content:space-between;
 box-shadow:var(--shadow);
}

.summaryLeft{
 display:flex;
 align-items:center;
 gap:9px;
}

.summaryIcon{
 width:34px;
 height:34px;
 border-radius:12px;
 background:var(--greenSoft);
 color:var(--green);
 display:grid;
 place-items:center;
 font-size:11px;
}

.summaryText strong{
 display:block;
 font-size:9px;
}

.summaryText span{
 display:block;
 margin-top:2px;
 font-size:7px;
 color:var(--muted);
}

.count{
 min-width:32px;
 height:26px;
 padding:0 8px;
 border-radius:50px;
 display:grid;
 place-items:center;
 background:var(--greenSoft);
 color:var(--green);
 font-size:8px;
 font-weight:800;
}

/* ================= CARD ================= */

.card{
 background:#fff;
 border:1px solid var(--line);
 border-radius:23px;
 overflow:hidden;
 margin-bottom:12px;
 box-shadow:var(--shadow);
 animation:cardIn .45s cubic-bezier(.2,.7,.2,1) both;
}

@keyframes cardIn{
 from{
  opacity:0;
  transform:translateY(16px) scale(.985);
 }
 to{
  opacity:1;
  transform:none;
 }
}

.imageWrap{
 position:relative;
 overflow:hidden;
 background:#eef4f1;
}

.cardImage{
 width:100%;
 max-height:245px;
 min-height:120px;
 object-fit:cover;
 display:block;
 transition:transform .6s ease;
}

.card:hover .cardImage{
 transform:scale(1.025);
}

.imageShade{
 position:absolute;
 inset:auto 0 0;
 height:80px;
 background:linear-gradient(transparent,rgba(0,0,0,.22));
 pointer-events:none;
}

.priorityRibbon{
 position:absolute;
 top:12px;
 left:12px;
 padding:6px 9px;
 border-radius:50px;
 background:rgba(255,255,255,.92);
 backdrop-filter:blur(8px);
 font-size:7px;
 font-weight:800;
 box-shadow:0 5px 15px rgba(0,0,0,.08);
}

.priorityRibbon.important{
 color:var(--orange);
}

.priorityRibbon.urgent{
 color:var(--red);
}

.body{
 padding:15px;
}

.meta{
 display:flex;
 align-items:center;
 gap:6px;
 flex-wrap:wrap;
}

.badge{
 display:inline-flex;
 align-items:center;
 gap:5px;
 padding:6px 9px;
 border-radius:50px;
 background:var(--greenSoft);
 color:var(--green);
 font-size:7px;
 font-weight:800;
}

.badge.ticket{
 background:#edf3ff;
 color:var(--blue);
}

.badge.travel{
 background:#f0edff;
 color:#6955c7;
}

.badge.wildlife{
 background:#e9f7ed;
 color:#31814e;
}

.badge.park{
 background:#eaf6f2;
 color:#087d59;
}

.date{
 color:var(--muted);
 font-size:7px;
}

.title{
 margin-top:10px;
 font-family:"Hind Siliguri",Inter,sans-serif;
 font-size:17px;
 line-height:1.35;
 font-weight:800;
}

.titleEn{
 margin-top:3px;
 color:var(--muted);
 font-size:9px;
 font-weight:600;
 line-height:1.4;
}

.desc{
 margin-top:11px;
 color:#405048;
 font-family:"Hind Siliguri",Inter,sans-serif;
 font-size:11px;
 line-height:1.75;
 white-space:pre-line;
}

.descEn{
 margin-top:6px;
 color:#7b8982;
 font-family:Inter,sans-serif;
 font-size:9px;
 line-height:1.65;
 white-space:pre-line;
}

/* ================= CARD FOOTER ================= */

.cardBottom{
 margin-top:13px;
 padding-top:12px;
 border-top:1px solid #edf2ef;
 display:flex;
 align-items:center;
 justify-content:space-between;
 gap:8px;
}

.timeInfo{
 display:flex;
 align-items:center;
 gap:6px;
 color:var(--muted);
 font-size:7px;
}

.timeInfo i{
 color:var(--green);
}

.actions{
 display:flex;
 gap:6px;
}

.actionBtn{
 height:34px;
 padding:0 11px;
 border:0;
 border-radius:11px;
 font-size:7px;
 font-weight:800;
 transition:.2s;
}

.actionBtn:active{
 transform:scale(.94);
}

.openBtn{
 background:var(--green);
 color:#fff;
 box-shadow:0 5px 13px rgba(8,125,89,.15);
}

.copyBtn{
 background:var(--blueSoft);
 color:var(--blue);
}

.actionBtn i{
 margin-right:4px;
}

/* ================= EMPTY ================= */

.empty{
 padding:55px 20px;
 text-align:center;
}

.emptyIcon{
 width:70px;
 height:70px;
 border-radius:24px;
 background:var(--greenSoft);
 color:var(--green);
 display:grid;
 place-items:center;
 margin:0 auto 15px;
 font-size:23px;
 animation:emptyFloat 2.8s ease-in-out infinite;
}

@keyframes emptyFloat{
 50%{transform:translateY(-5px)}
}

.emptyTitle{
 display:block;
 font-family:"Hind Siliguri",Inter,sans-serif;
 font-size:14px;
 font-weight:800;
 color:var(--ink);
}

.emptyText{
 display:block;
 margin-top:5px;
 color:var(--muted);
 font-size:8px;
 line-height:1.65;
}

.retry{
 margin-top:13px;
 border:0;
 border-radius:12px;
 padding:10px 15px;
 background:var(--green);
 color:white;
 font-size:8px;
 font-weight:800;
}

/* ================= LOADING ================= */

.loading{
 padding:60px 20px;
 text-align:center;
 color:var(--muted);
}

.loadingIcon{
 width:58px;
 height:58px;
 border-radius:20px;
 display:grid;
 place-items:center;
 background:var(--greenSoft);
 color:var(--green);
 margin:0 auto 13px;
}

.loadingText{
 font-size:8px;
}

.spin{
 animation:spin .8s linear infinite;
}

/* ================= TOAST ================= */

.toast{
 position:fixed;
 left:50%;
 bottom:18px;
 z-index:100;
 max-width:90%;
 padding:11px 15px;
 border-radius:14px;
 background:#18251f;
 color:white;
 font-size:8px;
 font-weight:700;
 text-align:center;
 box-shadow:0 12px 35px rgba(0,0,0,.2);
 transform:translate(-50%,25px);
 opacity:0;
 pointer-events:none;
 transition:.28s ease;
}

.toast.show{
 opacity:1;
 transform:translate(-50%,0);
}

/* ================= RESPONSIVE ================= */

@media(max-width:390px){
 .heroTitle{
  font-size:24px;
 }

 .content{
  padding:11px;
 }

 .body{
  padding:13px;
 }

 .actionBtn{
  padding:0 9px;
 }
}
</style>
</head>

<body>

<div class="app">

<!-- ================= HEADER ================= -->

 <div class="headerContent">

   <div class="brand">

    <div class="brandIcon">
     <i class="fa-solid fa-bell"></i>

    <div class="brandText">

   </div>

   <div class="live">

    LIVE
   </div>

  </div>

  <div class="hero">

<!-- ================= MAIN ================= -->

<main class="content">

 <!-- Search + Refresh -->

   class="filter active"

   onclick="setFilter('all',this)"
  >

  <button
   class="filter"
   data-filter="app"
   onclick="setFilter('app',this)"
  >

   App
  </button>

  <button
   class="filter"
   data-filter="park"
   onclick="setFilter('park',this)"
  >
   <i class="fa-solid fa-tree"></i>
   Park
  </button>

  <button
   class="filter"
   data-filter="ticket"
   onclick="setFilter('ticket',this)"
  >
   <i class="fa-solid fa-ticket"></i>
   Tickets
  </button>

  <button
   class="filter"
   data-filter="wildlife"
   onclick="setFilter('wildlife',this)"
  >
   <i class="fa-solid fa-paw"></i>
   Wildlife
  </button>

  <button
   class="filter"
   data-filter="travel"
   onclick="setFilter('travel',this)"
  >
   <i class="fa-solid fa-route"></i>
   Travel
  </button>

  <button
   class="filter"
   data-filter="important"
   onclick="setFilter('important',this)"
  >
   <i class="fa-solid fa-star"></i>
   Important
  </button>

 </div>


 <!-- Summary -->

 <div class="summary">

  <div class="summaryLeft">

   <div class="summaryIcon">
    <i class="fa-solid fa-bell"></i>
   </div>

   <div class="summaryText">
    <strong>Latest Notifications</strong>
    <span>Published updates from Wildlife Explorer</span>
   </div>

  </div>

  <div class="count" id="count">
   0
  </div>

 </div>


 <!-- Dynamic List -->

 <div id="list">

  <div class="loading">

   <div class="loadingIcon">
    <i class="fa-solid fa-spinner spin"></i>
   </div>

   </div>

  </div>

 </div>

</main>

<!-- Toast -->

<div id="toast" class="toast"></div>


<script>

/* =========================================================
   SUPABASE
========================================================= */

const SUPABASE_URL =
"https://hnhphoqfylwbuptronqh.supabase.co";

const SUPABASE_KEY =
"sb_publishable_ZBJhCw5h6JKGRD29loq4bw_OV1G_Fz0";

const db =
window.supabase.createClient(
 SUPABASE_URL,
 SUPABASE_KEY
);


/* =========================================================
   STATE
========================================================= */

let notifications = [];

let currentFilter = "all";

let searchText = "";


/* =========================================================
   ICON SYSTEM
========================================================= */

const icons = {

 bell:"fa-bell",
 tree:"fa-tree",
 ticket:"fa-ticket",
 paw:"fa-paw",
 route:"fa-route",
 app:"fa-mobile-screen",
 info:"fa-circle-info",
 warning:"fa-triangle-exclamation",
 calendar:"fa-calendar-days",
 location:"fa-location-dot",
 binoculars:"fa-binoculars",
 sparkles:"fa-sparkles",
 megaphone:"fa-bullhorn",
 download:"fa-download"

};


/* =========================================================
   ESCAPE HTML
========================================================= */

function esc(value){

 return String(value ?? "")
 .replace(/[&<>"']/g,function(m){

  return {

   "&":"&amp;",
   "<":"&lt;",
   ">":"&gt;",
   '"':"&quot;",
   "'":"&#039;"

  }[m];

 });

}


/* =========================================================
   TOAST
========================================================= */

function toast(message){

 const box =
 document.getElementById("toast");

 box.textContent = message;

 box.classList.add("show");

 clearTimeout(window.toastTimer);

 window.toastTimer =
 setTimeout(function(){

  box.classList.remove("show");

 },2600);

}


/* =========================================================
   DATE
========================================================= */

function formatDate(value){

 if(!value) return "";

 const d = new Date(value);

 if(Number.isNaN(d.getTime())) return "";

 return d.toLocaleDateString(
  "bn-BD",
  {
   day:"numeric",
   month:"long",
   year:"numeric"
  }
 );

}


/* =========================================================
   RELATIVE TIME
========================================================= */

function relativeTime(value){

 if(!value) return "";

 const time =
 new Date(value).getTime();

 if(Number.isNaN(time)) return "";

 const diff =
 Date.now() - time;

 const minute =
 60 * 1000;

 const hour =
 60 * minute;

 const day =
 24 * hour;

 if(diff < minute)
  return "Just now";

 if(diff < hour)
  return Math.floor(diff / minute) + " min ago";

 if(diff < day)
  return Math.floor(diff / hour) + " hr ago";

 if(diff < 7 * day)
  return Math.floor(diff / day) + " days ago";

 return formatDate(value);

}


/* =========================================================
   CATEGORY CLASS
========================================================= */

function categoryClass(category){

 return String(category || "app")
  .toLowerCase()
  .replace(/[^a-z]/g,"");

}


/* =========================================================
   ICON
========================================================= */

function getIcon(icon){

 return icons[icon] || "fa-bell";

}


/* =========================================================
   PRIORITY
========================================================= */

function priorityInfo(priority){

 const p =
 String(priority || "normal").toLowerCase();

 if(p === "urgent"){

  return {
   className:"urgent",
   icon:"fa-triangle-exclamation",
   text:"Urgent"
  };

 }

 if(p === "important"){

  return {
   className:"important",
   icon:"fa-star",
   text:"Important"
  };

 }

 return null;

}


/* =========================================================
   FILTER
========================================================= */

function setFilter(value,button){

 currentFilter = value;

 document
 .querySelectorAll(".filter")
 .forEach(function(item){

  item.classList.remove("active");

 });

 button.classList.add("active");

 render();

}


/* =========================================================
   SEARCH
========================================================= */

document
.getElementById("search")
.addEventListener("input",function(){

 searchText =
 this.value
 .trim()
 .toLowerCase();

 render();

});


/* =========================================================
   COPY LINK
========================================================= */

async function copyLink(url){

 if(!url) return;

 try{

  if(
   navigator.clipboard &&
   window.isSecureContext
  ){

   await navigator.clipboard.writeText(url);

  }else{

   fallbackCopy(url);

  }

  toast("Link copied successfully");

 }catch(error){

  try{

   fallbackCopy(url);

   toast("Link copied successfully");

  }catch(e){

   toast("Unable to copy link");

  }

 }

}


/* =========================================================
   FALLBACK COPY
========================================================= */

function fallbackCopy(text){

 const area =
 document.createElement("textarea");

 area.value = text;

 area.style.position = "fixed";
 area.style.opacity = "0";

 document.body.appendChild(area);

 area.focus();
 area.select();

 document.execCommand("copy");

 area.remove();

}


/* =========================================================
   OPEN LINK
========================================================= */

function openLink(url){

 if(!url) return;

 window.open(
  url,
  "_blank",
  "noopener,noreferrer"
 );

}


/* =========================================================
   FILTER + SEARCH DATA
========================================================= */

function getFilteredData(){

 return notifications.filter(function(item){

  const category =
  String(item.category || "app")
   .toLowerCase();

  const priority =
  String(item.priority || "normal")
   .toLowerCase();

  const matchesFilter =
   currentFilter === "all" ||
   category === currentFilter ||
   (
    currentFilter === "important" &&
    (
     priority === "important" ||
     priority === "urgent"
    )
   );

  if(!matchesFilter)
   return false;


  if(!searchText)
   return true;


  const searchable = [

   item.title_bn,
   item.title_en,
   item.description_bn,
   item.description_en,
   item.category,
   item.priority

  ]
  .join(" ")
  .toLowerCase();


  return searchable.includes(searchText);

 });

}


/* =========================================================
   RENDER
========================================================= */

function render(){

 const list =
 document.getElementById("list");

 const data =
 getFilteredData();


 document.getElementById("count")
 .textContent = data.length;


 if(!data.length){

  list.innerHTML = `

   <div class="empty">

    <div class="emptyIcon">
     <i class="fa-regular fa-bell-slash"></i>
    </div>

    <span class="emptyTitle">
     কোনো বিজ্ঞপ্তি পাওয়া যায়নি
    </span>

    <span class="emptyText">
     এই ক্যাটাগরিতে বর্তমানে কোনো প্রকাশিত
     notification নেই।
     <br>
     No published notifications found.
    </span>

    <button
     class="retry"
     onclick="loadNotifications()"
    >
     <i class="fa-solid fa-rotate-right"></i>
     Refresh
    </button>

   </div>

  `;

  return;

 }


 list.innerHTML =
 data.map(function(item,index){

  const category =
  String(item.category || "app")
   .toLowerCase();

  const priority =
  priorityInfo(item.priority);

  const icon =
  getIcon(item.icon);

  const image =
  item.image_url
  ? `

   <div class="imageWrap">

    <img
     class="cardImage"
     src="${esc(item.image_url)}"
     alt="${esc(item.title_en || "Notification")}"
     loading="lazy"
     onerror="this.parentElement.style.display='none'"
    >

    <div class="imageShade"></div>

    ${
     priority
     ?
     `
     <div class="priorityRibbon ${priority.className}">
      <i class="fa-solid ${priority.icon}"></i>
      ${priority.text}
     </div>
     `
     :
     ""
    }

   </div>

  `
  :
  "";


  const priorityBadge =
  priority
  ?
  `
   <span class="badge">
    <i class="fa-solid ${priority.icon}"></i>
    ${priority.text}
   </span>
  `
  :
  "";


  const action =
  item.action_url
  ?
  `

   <div class="actions">

    <button
     class="actionBtn openBtn"
     onclick='openLink(${JSON.stringify(item.action_url)})'
    >
     <i class="fa-solid fa-arrow-up-right-from-square"></i>
     Open
    </button>

    <button
     class="actionBtn copyBtn"
     onclick='copyLink(${JSON.stringify(item.action_url)})'
    >
     <i class="fa-regular fa-copy"></i>
     Copy Link
    </button>

   </div>

  `
  :
  "";


  return `

   <article
    class="card"
    style="animation-delay:${Math.min(index * 55,450)}ms"
   >

    ${image}

    <div class="body">

     <div class="meta">

      <span class="badge ${categoryClass(category)}">

       <i class="fa-solid ${icon}"></i>

       ${esc(
        category.charAt(0).toUpperCase() +
        category.slice(1)
       )}

      </span>

      ${priorityBadge}

      <span class="date">

       <i class="fa-regular fa-calendar"></i>

       ${formatDate(item.created_at)}

      </span>

     </div>


     <div class="title">

      ${esc(item.title_bn)}

     </div>


     ${
      item.title_en
      ?
      `
      <div class="titleEn">
       ${esc(item.title_en)}
      </div>
      `
      :
      ""
     }


     ${
      item.description_bn
      ?
      `
      <div class="desc">
       ${esc(item.description_bn)}
      </div>
      `
      :
      ""
     }


     ${
      item.description_en
      ?
      `
      <div class="descEn">
       ${esc(item.description_en)}
      </div>
      `
      :
      ""
     }


     <div class="cardBottom">

      <div class="timeInfo">

       <i class="fa-regular fa-clock"></i>

       ${relativeTime(item.created_at)}

      </div>

      ${action}

     </div>

    </div>

   </article>

  `;

 }).join("");

}


/* =========================================================
   LOAD NOTIFICATIONS
========================================================= */

async function loadNotifications(){

 const list =
 document.getElementById("list");

 const refresh =
 document.getElementById("refreshBtn");


 refresh.classList.add("loading");

 list.innerHTML = `

  <div class="loading">

   <div class="loadingIcon">

    <i class="fa-solid fa-spinner spin"></i>

   </div>

   <div class="loadingText">
    Loading notifications...
   </div>

  </div>

 `;


 try{

  const result =
  await db
   .from("notifications")
   .select(`
    id,
    title_bn,
    title_en,
    description_bn,
    description_en,
    category,
    icon,
    priority,
    is_published,
    created_at,
    updated_at,
    image_url,
    action_url
   `)
   .eq("is_published",true)
   .order("created_at",{ascending:false});


  if(result.error)
   throw result.error;


  notifications =
  Array.isArray(result.data)
  ? result.data
  : [];


  render();


 }catch(error){

  console.error(
   "Supabase notification error:",
   error
  );


  list.innerHTML = `

   <div class="empty">

    <div class="emptyIcon">
     <i class="fa-solid fa-cloud-arrow-down"></i>
    </div>

    <span class="emptyTitle">
     বিজ্ঞপ্তি লোড করা যায়নি
    </span>

    <span class="emptyText">
     Notification service থেকে তথ্য পাওয়া যায়নি।
     <br>
     Please try again.
    </span>

    <button
     class="retry"
     onclick="loadNotifications()"
    >
     <i class="fa-solid fa-rotate-right"></i>
     Try Again
    </button>

   </div>

  `;

 }

 finally{

  refresh.classList.remove("loading");

 }

}


/* =========================================================
   ONLINE / OFFLINE
========================================================= */

window.addEventListener(
 "online",
 function(){

  toast("Connection restored");

  loadNotifications();

 }
);


window.addEventListener(
 "offline",
 function(){

  toast("You are offline");

 }
);


/* =========================================================
   INITIAL LOAD
========================================================= */

loadNotifications();


/* =========================================================
   OPTIONAL AUTO REFRESH
   Every 60 seconds
========================================================= */

setInterval(
 function(){

  if(
   document.visibilityState === "visible" &&
   navigator.onLine
  ){

   loadNotifications();

  }

 },
 60000
);

</script>
