<!doctype html>
<html lang="bn">

<head>

<meta charset="utf-8">

<meta name="viewport"
content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">

<meta name="theme-color" content="#087d59">

<meta name="apple-mobile-web-app-capable" content="yes">

<title>Notifications • Wildlife Explorer</title>


<link rel="preconnect" href="https://fonts.googleapis.com">

<link rel="preconnect"
href="https://fonts.gstatic.com"
crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&family=Inter:wght@400;500;600;700;800&display=swap"
rel="stylesheet">


<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">


<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>


<style>

/* =====================================================
   ROOT
===================================================== */

:root{

 --bg:#f3f8f5;
 --card:#ffffff;

 --ink:#15231e;
 --ink2:#405049;

 --muted:#78847e;

 --green:#087d59;
 --green2:#0ca978;

 --soft:#e8f6f0;

 --line:#dfe9e4;

 --blue:#3978df;
 --blueSoft:#edf3ff;

 --orange:#d58a25;
 --orangeSoft:#fff3df;

 --red:#d95353;
 --redSoft:#ffe9e9;

 --shadow:
 0 12px 38px rgba(20,70,53,.075);

 --shadow2:
 0 22px 65px rgba(10,50,38,.13);

}


/* =====================================================
   RESET
===================================================== */

*{
 box-sizing:border-box;
 -webkit-tap-highlight-color:transparent;
}

html,
body{
 margin:0;
 padding:0;
 width:100%;
 min-height:100%;
 background:#dfe9e4;
 color:var(--ink);
}

body{
 font-family:
 Inter,
 "Hind Siliguri",
 sans-serif;

 overflow-x:hidden;
}

button,
input{
 font-family:inherit;
}

button{
 cursor:pointer;
 border:0;
}

button:active{
 transform:scale(.97);
}


/* =====================================================
   APP
===================================================== */

.app{

 width:100%;
 max-width:680px;

 min-height:100vh;

 margin:auto;

 background:var(--bg);

 position:relative;

 overflow:hidden;

 box-shadow:
 0 0 60px rgba(0,0,0,.06);

}


/* =====================================================
   HEADER
===================================================== */

.header{

 position:relative;

 padding:
 18px
 16px
 20px;

 color:#fff;

 background:
 linear-gradient(
 135deg,
 #056b4b,
 #087d59 52%,
 #0ca777
 );

 overflow:hidden;

}

.header::before{

 content:"";

 position:absolute;

 width:230px;
 height:230px;

 right:-120px;
 top:-145px;

 border-radius:50%;

 background:
 rgba(255,255,255,.075);

 animation:
 headerFloat 8s ease-in-out infinite;

}

.header::after{

 content:"";

 position:absolute;

 width:130px;
 height:130px;

 left:-80px;
 bottom:-95px;

 border-radius:50%;

 background:
 rgba(255,255,255,.06);

 animation:
 headerFloat2 7s ease-in-out infinite;

}

@keyframes headerFloat{

 50%{
  transform:
  translate(-12px,10px)
  scale(1.05);
 }

}

@keyframes headerFloat2{

 50%{
  transform:
  translate(12px,-8px);
 }

}


.headerContent{

 position:relative;
 z-index:2;

}


.brandRow{

 display:flex;

 align-items:center;

 gap:10px;

}


.brandIcon{

 width:42px;
 height:42px;

 border-radius:15px;

 display:grid;

 place-items:center;

 background:
 rgba(255,255,255,.14);

 border:
 1px solid
 rgba(255,255,255,.12);

 box-shadow:
 0 8px 25px rgba(0,0,0,.08);

 animation:
 iconFloat 3s ease-in-out infinite;

}

@keyframes iconFloat{

 50%{
  transform:translateY(-2px);
 }

}


.brandText small{

 display:block;

 font-size:7px;

 font-weight:800;

 letter-spacing:1.3px;

 opacity:.68;

}

.brandText b{

 display:block;

 margin-top:2px;

 font-size:13px;

}


.live{

 margin-left:auto;

 display:flex;

 align-items:center;

 gap:5px;

 padding:6px 9px;

 border-radius:99px;

 background:
 rgba(255,255,255,.12);

 border:
 1px solid
 rgba(255,255,255,.1);

 font-size:7px;

 font-weight:800;

}

.liveDot{

 width:6px;
 height:6px;

 border-radius:50%;

 background:#baffdc;

 box-shadow:
 0 0 0 4px
 rgba(186,255,220,.1);

 animation:
 livePulse 1.8s infinite;

}

@keyframes livePulse{

 50%{
  box-shadow:
  0 0 0 8px
  rgba(186,255,220,.02);
 }

}


.headerTitle{

 margin-top:18px;

 font-size:26px;

 line-height:1.1;

 font-weight:800;

 letter-spacing:-.7px;

}

.headerSubtitle{

 margin-top:5px;

 font-size:9px;

 line-height:1.6;

 opacity:.78;

}


/* =====================================================
   CONTENT
===================================================== */

.content{

 padding:
 13px
 13px
 35px;

}


/* =====================================================
   SEARCH
===================================================== */

.utility{

 display:flex;

 gap:8px;

 margin-bottom:10px;

}

.searchBox{

 position:relative;

 flex:1;

}

.searchBox i{

 position:absolute;

 left:12px;

 top:50%;

 transform:
 translateY(-50%);

 color:#89958f;

 font-size:10px;

 pointer-events:none;

}

.searchBox input{

 width:100%;

 height:40px;

 padding:
 0 34px
 0 32px;

 border:
 1px solid
 var(--line);

 border-radius:14px;

 outline:none;

 background:#fff;

 color:var(--ink);

 font-size:9px;

 box-shadow:
 0 7px 20px
 rgba(20,70,53,.035);

}

.searchBox input:focus{

 border-color:#9ad3bd;

 box-shadow:
 0 0 0 3px
 rgba(11,169,120,.08);

}

.clearSearch{

 position:absolute;

 right:8px;

 top:50%;

 transform:
 translateY(-50%);

 width:25px;
 height:25px;

 display:none;

 place-items:center;

 border-radius:50%;

 background:#f0f4f2;

 color:#77847d;

 font-size:8px;

}

.clearSearch.show{

 display:grid;

}


.refresh{

 width:40px;
 height:40px;

 flex:none;

 border:
 1px solid
 var(--line);

 border-radius:14px;

 background:#fff;

 color:var(--green);

 display:grid;

 place-items:center;

 box-shadow:
 0 7px 20px
 rgba(20,70,53,.035);

}

.refresh.loading i{

 animation:
 spin .7s linear infinite;

}

@keyframes spin{

 to{
  transform:rotate(360deg);
 }

}


/* =====================================================
   FILTER
===================================================== */

.filters{

 display:flex;

 gap:7px;

 overflow-x:auto;

 padding:
 2px
 1px
 5px;

 scrollbar-width:none;

}

.filters::-webkit-scrollbar{
 display:none;
}

.filter{

 flex:none;

 padding:
 8px
 12px;

 border:
 1px solid
 var(--line);

 border-radius:99px;

 background:#fff;

 color:var(--muted);

 font-size:8px;

 font-weight:800;

 white-space:nowrap;

 transition:.2s;

}

.filter i{
 margin-right:4px;
}

.filter.active{

 background:var(--green);

 border-color:var(--green);

 color:#fff;

 box-shadow:
 0 7px 18px
 rgba(8,125,89,.16);

}


/* =====================================================
   SUMMARY
===================================================== */

.summary{

 display:flex;

 justify-content:space-between;

 align-items:center;

 margin:
 10px
 1px
 10px;

}

.summaryLeft{

 display:flex;

 align-items:center;

 gap:8px;

}

.summaryIcon{

 width:32px;
 height:32px;

 display:grid;

 place-items:center;

 border-radius:11px;

 background:var(--soft);

 color:var(--green);

 font-size:10px;

}

.summaryText b{

 display:block;

 font-size:10px;

}

.summaryText span{

 display:block;

 margin-top:2px;

 font-size:7px;

 color:var(--muted);

}

.count{

 padding:
 6px
 9px;

 border:
 1px solid
 var(--line);

 border-radius:99px;

 background:#fff;

 color:var(--green);

 font-size:7px;

 font-weight:800;

}


/* =====================================================
   NOTIFICATION LIST
===================================================== */

.notificationList{

 display:flex;

 flex-direction:column;

 gap:9px;

}


/* =====================================================
   LIST ITEM
===================================================== */

.notificationItem{

 position:relative;

 display:flex;

 gap:11px;

 width:100%;

 padding:11px;

 background:#fff;

 border:
 1px solid
 var(--line);

 border-radius:18px;

 box-shadow:
 0 8px 28px
 rgba(20,70,53,.055);

 animation:
 itemIn .4s
 cubic-bezier(.2,.8,.2,1)
 both;

 transition:
 transform .2s,
 box-shadow .2s,
 border-color .2s;

 overflow:hidden;

}

.notificationItem:active{

 transform:scale(.985);

}

@keyframes itemIn{

 from{
  opacity:0;
  transform:
  translateY(12px);
 }

 to{
  opacity:1;
  transform:none;
 }

}


/* unread */

.notificationItem.unread{

 border-color:#b9ddcf;

 background:
 linear-gradient(
 135deg,
 #fff,
 #f9fdfb
 );

}

.notificationItem.unread::before{

 content:"";

 position:absolute;

 left:0;
 top:13px;
 bottom:13px;

 width:3px;

 border-radius:0 5px 5px 0;

 background:var(--green);

}


/* thumbnail */

.thumb{

 position:relative;

 width:72px;
 height:72px;

 flex:none;

 border-radius:15px;

 overflow:hidden;

 background:
 linear-gradient(
 135deg,
 #e7f4ef,
 #d8ebe4
 );

 display:grid;

 place-items:center;

 color:var(--green);

}

.thumb img{

 width:100%;
 height:100%;

 object-fit:cover;

 display:block;

}

.thumbIcon{

 font-size:18px;

}

.priorityMini{

 position:absolute;

 right:5px;
 bottom:5px;

 width:19px;
 height:19px;

 display:grid;

 place-items:center;

 border-radius:50%;

 background:
 rgba(255,255,255,.92);

 backdrop-filter:
 blur(8px);

 font-size:7px;

}

.priorityMini.important{
 color:var(--orange);
}

.priorityMini.urgent{
 color:var(--red);
}


/* list body */

.itemBody{

 min-width:0;

 flex:1;

 display:flex;

 flex-direction:column;

 justify-content:center;

}

.itemTop{

 display:flex;

 align-items:center;

 gap:6px;

 min-width:0;

}

.itemCategory{

 display:inline-flex;

 align-items:center;

 gap:4px;

 max-width:120px;

 padding:
 4px
 7px;

 border-radius:99px;

 background:var(--soft);

 color:var(--green);

 font-size:6.5px;

 font-weight:800;

 white-space:nowrap;

 overflow:hidden;

 text-overflow:ellipsis;

}

.itemCategory.important{

 background:var(--orangeSoft);

 color:var(--orange);

}

.itemCategory.urgent{

 background:var(--redSoft);

 color:var(--red);

}

.itemTime{

 margin-left:auto;

 color:#89958f;

 font-size:6.5px;

 white-space:nowrap;

}


.itemTitle{

 margin-top:6px;

 font-family:
 "Hind Siliguri",
 sans-serif;

 font-size:14px;

 line-height:1.35;

 font-weight:700;

 display:-webkit-box;

 -webkit-line-clamp:2;

 -webkit-box-orient:vertical;

 overflow:hidden;

}

.itemPreview{

 margin-top:4px;

 font-family:
 "Hind Siliguri",
 sans-serif;

 color:#74817b;

 font-size:9px;

 line-height:1.5;

 display:-webkit-box;

 -webkit-line-clamp:2;

 -webkit-box-orient:vertical;

 overflow:hidden;

}


.unreadDot{

 position:absolute;

 right:9px;

 top:9px;

 width:6px;
 height:6px;

 border-radius:50%;

 background:var(--green);

 box-shadow:
 0 0 0 4px
 rgba(8,125,89,.08);

}


/* =====================================================
   DETAIL OVERLAY
===================================================== */

.detailView{

 position:fixed;

 inset:0;

 z-index:200;

 display:none;

 background:var(--bg);

 max-width:680px;

 margin:auto;

 overflow-y:auto;

 overscroll-behavior:
 contain;

 animation:
 detailIn .3s
 cubic-bezier(.2,.8,.2,1);

}

.detailView.show{

 display:block;

}

@keyframes detailIn{

 from{
  opacity:0;
  transform:
  translateY(18px);
 }

 to{
  opacity:1;
  transform:none;
 }

}


/* =====================================================
   DETAIL HEADER
===================================================== */

.detailHeader{

 position:sticky;

 top:0;

 z-index:10;

 display:flex;

 align-items:center;

 gap:8px;

 padding:
 11px
 13px;

 background:
 rgba(255,255,255,.88);

 backdrop-filter:
 blur(18px);

 -webkit-backdrop-filter:
 blur(18px);

 border-bottom:
 1px solid
 rgba(220,230,225,.8);

}

.backBtn{

 width:38px;
 height:38px;

 display:grid;

 place-items:center;

 border-radius:13px;

 background:#f0f5f2;

 color:var(--ink);

 font-size:11px;

}

.detailHeaderTitle{

 flex:1;

 font-size:10px;

 font-weight:800;

}

.langSwitch{

 display:flex;

 padding:3px;

 border-radius:11px;

 background:#eef4f1;

}

.langBtn{

 min-width:31px;

 padding:
 6px
 7px;

 border-radius:8px;

 background:transparent;

 color:#77837d;

 font-size:7px;

 font-weight:800;

}

.langBtn.active{

 background:#fff;

 color:var(--green);

 box-shadow:
 0 3px 10px
 rgba(0,0,0,.07);

}


/* =====================================================
   DETAIL CONTENT
===================================================== */

.detailContent{

 padding:
 13px
 13px
 40px;

}


.detailHero{

 position:relative;

 width:100%;

 overflow:hidden;

 border-radius:21px;

 background:#e8f0ed;

}

.detailHero img{

 width:100%;

 max-height:270px;

 min-height:120px;

 object-fit:cover;

 display:block;

 cursor:pointer;

}

.detailHeroFallback{

 min-height:125px;

 display:grid;

 place-items:center;

 color:var(--green);

 font-size:32px;

}


.detailBadges{

 display:flex;

 flex-wrap:wrap;

 align-items:center;

 gap:6px;

 margin-top:13px;

}

.detailBadge{

 display:inline-flex;

 align-items:center;

 gap:5px;

 padding:
 6px
 9px;

 border-radius:99px;

 background:var(--soft);

 color:var(--green);

 font-size:7px;

 font-weight:800;

}

.detailBadge.important{

 background:var(--orangeSoft);

 color:var(--orange);

}

.detailBadge.urgent{

 background:var(--redSoft);

 color:var(--red);

}

.detailDate{

 color:var(--muted);

 font-size:7px;

}


/* title */

.detailTitle{

 margin-top:11px;

 font-family:
 "Hind Siliguri",
 sans-serif;

 font-size:23px;

 line-height:1.38;

 font-weight:700;

 letter-spacing:-.2px;

}

.detailDescription{

 margin-top:14px;

 font-family:
 "Hind Siliguri",
 sans-serif;

 font-size:12px;

 line-height:1.9;

 color:#3f4d47;

 white-space:pre-line;

 overflow-wrap:anywhere;

}


/* =====================================================
   DETAIL ACTIONS
===================================================== */

.detailActions{

 display:flex;

 gap:7px;

 margin-top:18px;

 padding-top:14px;

 border-top:
 1px solid
 #e7eeea;

}

.detailAction{

 flex:1;

 min-height:40px;

 border-radius:13px;

 font-size:8px;

 font-weight:800;

 transition:.18s;

}

.detailOpen{

 background:var(--green);

 color:#fff;

}

.detailCopy{

 background:var(--blueSoft);

 color:var(--blue);

}

.detailShare{

 background:#f1f5f3;

 color:var(--ink);

}

.detailAction i{

 margin-right:4px;

}


/* =====================================================
   IMAGE VIEWER
===================================================== */

.imageViewer{

 position:fixed;

 inset:0;

 z-index:500;

 display:none;

 align-items:center;

 justify-content:center;

 padding:15px;

 background:
 rgba(0,0,0,.93);

}

.imageViewer.show{

 display:flex;

 animation:
 viewerIn .2s ease;

}

@keyframes viewerIn{

 from{
  opacity:0;
 }

 to{
  opacity:1;
 }

}

.viewerImage{

 max-width:100%;

 max-height:86vh;

 object-fit:contain;

 border-radius:12px;

}

.viewerClose{

 position:absolute;

 right:14px;
 top:14px;

 width:40px;
 height:40px;

 border-radius:50%;

 display:grid;

 place-items:center;

 background:
 rgba(255,255,255,.12);

 color:#fff;

 font-size:13px;

}


/* =====================================================
   EMPTY / ERROR / LOADING
===================================================== */

.state{

 text-align:center;

 padding:
 60px
 20px;

}

.stateIcon{

 width:68px;
 height:68px;

 margin:
 0 auto
 14px;

 display:grid;

 place-items:center;

 border-radius:23px;

 background:var(--soft);

 color:var(--green);

 font-size:23px;

 animation:
 stateFloat 2.3s
 ease-in-out infinite;

}

@keyframes stateFloat{

 50%{
  transform:translateY(-5px);
 }

}

.state b{

 display:block;

 font-size:13px;

}

.state span{

 display:block;

 max-width:310px;

 margin:
 5px auto 0;

 color:var(--muted);

 font-size:9px;

 line-height:1.65;

}

.retry{

 margin-top:13px;

 padding:
 10px
 15px;

 border-radius:13px;

 background:var(--green);

 color:#fff;

 font-size:8px;

 font-weight:800;

}

.loading{

 text-align:center;

 padding:
 60px
 20px;

 color:var(--muted);

 font-size:9px;

}

.loadingIcon{

 width:48px;
 height:48px;

 margin:
 0 auto
 13px;

 display:grid;

 place-items:center;

 border-radius:16px;

 background:var(--soft);

 color:var(--green);

}

.loadingIcon i{

 animation:
 spin .8s
 linear infinite;

}


/* =====================================================
   TOAST
===================================================== */

.toast{

 position:fixed;

 left:50%;
 bottom:18px;

 z-index:1000;

 width:max-content;

 max-width:90%;

 padding:
 11px
 14px;

 border-radius:14px;

 background:#18251f;

 color:#fff;

 font-size:9px;

 font-weight:700;

 text-align:center;

 opacity:0;

 pointer-events:none;

 transform:
 translate(-50%,18px);

 transition:.25s;

 box-shadow:
 0 12px 35px
 rgba(0,0,0,.22);

}

.toast.show{

 opacity:1;

 transform:
 translate(-50%,0);

}


/* =====================================================
   SMALL DEVICES
===================================================== */

@media(max-width:390px){

 .headerTitle{
  font-size:24px;
 }

 .itemTitle{
  font-size:13px;
 }

 .itemPreview{
  font-size:8.5px;
 }

 .thumb{
  width:66px;
  height:66px;
 }

 .detailTitle{
  font-size:21px;
 }

}

</style>

</head>


<body>


<div class="app">


<!-- =================================================
     MAIN HEADER
================================================= -->

<header class="header">

 <div class="headerContent">

  <div class="brandRow">

   <div class="brandIcon">
    <i class="fa-solid fa-bell"></i>
   </div>

   <div class="brandText">

    <small>
     WILDLIFE EXPLORER
    </small>

    <b>
     Notification Center
    </b>

   </div>

   <div class="live">

    <span class="liveDot"></span>

    LIVE

   </div>

  </div>


  <div class="headerTitle">
   Notifications
  </div>

  <div class="headerSubtitle">
   Latest updates, announcements & useful information.
  </div>

 </div>

</header>


<!-- =================================================
     LIST PAGE
================================================= -->

<main class="content">


 <!-- SEARCH -->

 <div class="utility">

  <div class="searchBox">

   <i class="fa-solid fa-magnifying-glass"></i>

   <input
    id="search"
    type="search"
    placeholder="Search notifications..."
    autocomplete="off"
   >

   <button
    class="clearSearch"
    id="clearSearch"
    aria-label="Clear search"
   >

    <i class="fa-solid fa-xmark"></i>

   </button>

  </div>


  <button
   class="refresh"
   id="refreshBtn"
   aria-label="Refresh notifications"
  >

   <i class="fa-solid fa-rotate-right"></i>

  </button>

 </div>


 <!-- FILTERS -->

 <div class="filters">


  <button
   class="filter active"
   data-filter="all"
  >
   <i class="fa-solid fa-layer-group"></i>
   All
  </button>


  <button
   class="filter"
   data-filter="app"
  >
   <i class="fa-solid fa-mobile-screen"></i>
   App
  </button>


  <button
   class="filter"
   data-filter="park"
  >
   <i class="fa-solid fa-tree"></i>
   Park
  </button>


  <button
   class="filter"
   data-filter="ticket"
  >
   <i class="fa-solid fa-ticket"></i>
   Tickets
  </button>


  <button
   class="filter"
   data-filter="wildlife"
  >
   <i class="fa-solid fa-paw"></i>
   Wildlife
  </button>


  <button
   class="filter"
   data-filter="travel"
  >
   <i class="fa-solid fa-route"></i>
   Travel
  </button>


  <button
   class="filter"
   data-filter="important"
  >
   <i class="fa-solid fa-star"></i>
   Important
  </button>


 </div>


 <!-- SUMMARY -->

 <div class="summary">

  <div class="summaryLeft">

   <div class="summaryIcon">

    <i class="fa-regular fa-bell"></i>

   </div>

   <div class="summaryText">

    <b>
     Latest Notifications
    </b>

    <span>
     Stay updated with Wildlife Explorer
    </span>

   </div>

  </div>


  <div
   class="count"
   id="count"
  >
   0 Updates
  </div>

 </div>


 <!-- LIST -->

 <div id="list">

  <div class="loading">

   <div class="loadingIcon">

    <i class="fa-solid fa-spinner"></i>

   </div>

   Loading notifications...

  </div>

 </div>


</main>


</div>


<!-- =================================================
     DETAIL VIEW
================================================= -->

<section
 id="detailView"
 class="detailView"
 aria-hidden="true"
>


 <header class="detailHeader">


  <button
   id="backBtn"
   class="backBtn"
   aria-label="Back"
  >

/* =====================================================

function safeUrl(value){

 if(!value)

 try{

  if(
   url.protocol !== "http:" &&
   url.protocol !== "https:"

   month:"long",

/* =====================================================
   TIME AGO
===================================================== */

function timeAgo(value){

 const d =
 new Date(value);

 if(isNaN(d.getTime()))
  return "";

 const diff =
 Math.floor(
  (Date.now()-d.getTime())/1000
 );

 if(diff < 60)
  return currentLanguage === "bn"
   ? "এইমাত্র"
   : "Just now";

 if(diff < 3600){

  const n =
  Math.floor(diff/60);

  return currentLanguage === "bn"
   ? `${n} মিনিট আগে`
   : `${n} min ago`;

 }

 if(diff < 86400){

  const n =
  Math.floor(diff/3600);

  return currentLanguage === "bn"
   ? `${n} ঘণ্টা আগে`
   : `${n} hr ago`;

 }

 if(diff < 604800){

  const n =
  Math.floor(diff/86400);

  return currentLanguage === "bn"
   ? `${n} দিন আগে`
   : `${n} days ago`;

 return formatDate(value);

}

function openLink(url){

 if(!safe){

}


/* =====================================================
   COPY
===================================================== */

async function copyLink(url){

 const safe =
 safeUrl(url);

 if(!safe){

  toast("No valid link");

  return;

 }


 try{

  if(
   navigator.clipboard &&
   window.isSecureContext
  ){

   await navigator.clipboard.writeText(
    safe
   );

  }
  else{

   const textarea =
   document.createElement(
    "textarea"
   );

   textarea.value =
   safe;

   textarea.style.position =
   "fixed";

   textarea.style.opacity =
   "0";

   document.body.appendChild(
    textarea
   );

   textarea.focus();

   textarea.select();

   document.execCommand(
    "copy"
   );

   textarea.remove();

  }


  toast(
   currentLanguage === "bn"
   ? "লিংক কপি হয়েছে ✓"
   : "Link copied ✓"
  );


 }catch(error){

  toast(
   currentLanguage === "bn"
   ? "লিংক কপি করা যায়নি"
   : "Unable to copy link"
  );

 }

}

    title
   )
   : (

    title
   ),

   location.href

 };


 try{

  if(
   navigator.share
  ){

   await navigator.share(
    shareData
   );

  }
  else{

   await copyLink(
    shareData.url
   );

   toast(
    currentLanguage === "bn"
    ? "Share link কপি হয়েছে"
    : "Share link copied"
   );

  }

 }catch(error){

  if(
   error &&
   error.name === "AbortError"
  )
   return;

 }

}

  }


 }catch(error){

  console.error(
   "Notifications error:",
   error
  );


  list.innerHTML = `

   <div class="state">

    <div class="stateIcon">

     <i class="fa-solid fa-cloud"></i>

    </div>

    <b>

     ${
      currentLanguage === "bn"
      ? "Notification লোড করা যায়নি"
      : "Unable to load notifications"
     }

    </b>

    <span>

     ${
      currentLanguage === "bn"
      ? "ইন্টারনেট অথবা database connection পরীক্ষা করে আবার চেষ্টা করুন।"
      : "Please check your connection and try again."
     }

    </span>

    <button
     class="retry"
     id="retryBtn"
    >

     <i
      class="fa-solid fa-rotate-right"
     ></i>

     ${
      currentLanguage === "bn"
      ? "আবার চেষ্টা করুন"
      : "Try Again"
     }

    </button>

   </div>

  `;


  document
  .getElementById("retryBtn")
  ?.addEventListener(
   "click",
   ()=>loadNotifications(true)
  );

 }finally{

  refreshBtn.classList.remove(
   "loading"
  );

 }

}


/* =====================================================
   REFRESH
===================================================== */

refreshBtn.addEventListener(
 "click",
 ()=>{

  loadNotifications(true);

 }
);


/* =====================================================
   REALTIME
===================================================== */

function setupRealtime(){

 try{

  realtimeChannel =
  db

  .channel(
   "wildlife-notifications-live"
  )

  .on(
   "postgres_changes",
   {
    event:"*",
    schema:"public",
    table:"notifications"
   },
   payload=>{

    /*
     Small delay prevents multiple
     database events from causing
     unnecessary simultaneous requests.
    */

    clearTimeout(
     window.__reloadTimer
    );

    window.__reloadTimer =
    setTimeout(
     ()=>{
      loadNotifications(false);
     },
     350
    );

   }
  )

  .subscribe();

 }catch(error){

  console.warn(
   "Realtime unavailable:",
   error
  );

 }

}


/* =====================================================
   ONLINE
===================================================== */

window.addEventListener(
 "online",
 ()=>{

  toast(
   currentLanguage === "bn"
   ? "Connection restored ✓"
   : "Connection restored ✓"
  );

  loadNotifications(false);

 }
);


/* =====================================================
   OFFLINE
===================================================== */

window.addEventListener(
 "offline",
 ()=>{

  toast(
   currentLanguage === "bn"
   ? "আপনি এখন offline"
   : "You are offline"
  );

 }
);


/* =====================================================
   INITIAL LOAD
===================================================== */

loadNotifications(false);

setupRealtime();


/* =====================================================
   AUTO UPDATE TIME
===================================================== */

setInterval(
 ()=>{

  if(
   notifications.length
  ){

   renderList();

  }

 },
 60000
);

</script>

</body>
</html>
