<!doctype html>
<html lang="bn">
<head>

<meta charset="utf-8">

<meta name="viewport"
content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">

<meta name="theme-color" content="#087d59">

<title>Notifications • Wildlife Explorer</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect"
href="https://fonts.gstatic.com"
crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700;800&display=swap"
rel="stylesheet">

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>


<style>

/* =========================================================
   ROOT
========================================================= */

:root{

 --bg:#f3f8f5;
 --card:#ffffff;

 --ink:#16251f;
 --muted:#74817b;

 --green:#087d59;
 --green2:#0ba978;

 --soft:#e8f6f0;

 --line:#dfeae5;

 --blue:#3978df;
 --blueSoft:#edf3ff;

 --orange:#d98a24;
 --orangeSoft:#fff3df;

 --red:#d65353;
 --redSoft:#ffe8e8;

 --shadow:0 14px 40px rgba(20,70,53,.075);

}


/* =========================================================
   RESET
========================================================= */

*{
 box-sizing:border-box;
 -webkit-tap-highlight-color:transparent;
}

html,
body{

 margin:0;
 padding:0;

 background:#e3ece8;

 color:var(--ink);

}

body{

 font-family:
 Inter,
 "Hind Siliguri",
 sans-serif;

}

button,
input{

 font-family:inherit;

}

button{

 border:0;
 cursor:pointer;

}


/* =========================================================
   APP
========================================================= */

.app{

 width:100%;
 max-width:680px;

 min-height:100vh;

 margin:auto;

 background:var(--bg);

 overflow:hidden;

 position:relative;

}


/* =========================================================
   HEADER
========================================================= */

.header{

 position:relative;

 padding:20px 17px 22px;

 color:#fff;

 overflow:hidden;

 background:
 linear-gradient(
 135deg,
 #056b4b 0%,
 #087d59 48%,
 #0ca777 100%
 );

}

.header:before,
.header:after{

 content:"";

 position:absolute;

 border-radius:50%;

 background:
 rgba(255,255,255,.075);

 pointer-events:none;

}

.header:before{

 width:220px;
 height:220px;

 right:-110px;
 top:-140px;

 animation:
 floatOne 8s ease-in-out infinite;

}

.header:after{

 width:140px;
 height:140px;

 left:-80px;
 bottom:-95px;

 animation:
 floatTwo 7s ease-in-out infinite;

}

@keyframes floatOne{

 50%{
  transform:
  translate(-10px,10px)
  scale(1.05);
 }

}

@keyframes floatTwo{

 50%{
  transform:
  translate(10px,-7px);
 }

}


.headerContent{

 position:relative;
 z-index:2;

}


.brandLine{

 display:flex;

 align-items:center;

 gap:10px;

}


.brandIcon{

 width:43px;
 height:43px;

 border-radius:15px;

 display:grid;
 place-items:center;

 background:
 rgba(255,255,255,.14);

 border:
 1px solid rgba(255,255,255,.14);

 box-shadow:
 0 8px 22px rgba(0,0,0,.08);

 animation:
 iconFloat 3s ease-in-out infinite;

}

@keyframes iconFloat{

 50%{
  transform:translateY(-2px);
 }

}


.brandText small{

 display:block;

 font-size:7px;

 font-weight:800;

 letter-spacing:1.2px;

 opacity:.7;

}

.brandText b{

 display:block;

 margin-top:2px;

 font-size:13px;

}


.liveBadge{

 margin-left:auto;

 display:flex;

 align-items:center;

 gap:5px;

 padding:6px 9px;

 border-radius:99px;

 font-size:7px;

 font-weight:800;

 background:
 rgba(255,255,255,.12);

 border:
 1px solid rgba(255,255,255,.12);

}


.liveDot{

 width:6px;
 height:6px;

 border-radius:50%;

 background:#b9ffda;

 box-shadow:
 0 0 0 4px rgba(185,255,218,.1);

 animation:
 livePulse 1.8s infinite;

}

@keyframes livePulse{

 50%{
  box-shadow:
  0 0 0 7px
  rgba(185,255,218,.03);
 }

}


.headerTitle{

 margin-top:20px;

 font-size:27px;

 line-height:1.1;

 font-weight:800;

 letter-spacing:-.7px;

}


.headerSubtitle{

 margin-top:5px;

 font-size:9px;

 line-height:1.55;

 opacity:.78;

}


/* =========================================================
   CONTENT
========================================================= */

.content{

 padding:14px 14px 35px;

}


/* =========================================================
   SEARCH
========================================================= */

.utility{

 display:flex;

 gap:8px;

 margin-bottom:11px;

}


.searchBox{

 position:relative;

 flex:1;

}


.searchBox i{

 position:absolute;

 left:12px;

 top:50%;

 transform:
 translateY(-50%);

 color:#89958f;

 font-size:10px;

}


.searchBox input{

 width:100%;

 height:40px;

 padding:
 0 12px 0 32px;

 border:
 1px solid var(--line);

 border-radius:14px;

 outline:none;

 background:#fff;

 color:var(--ink);

 font-size:9px;

 box-shadow:
 0 7px 20px
 rgba(20,70,53,.035);

}


.searchBox input:focus{

 border-color:#9ad3bd;

 box-shadow:
 0 0 0 3px
 rgba(11,169,120,.08);

}


.refresh{

 width:40px;
 height:40px;

 border:
 1px solid var(--line);

 border-radius:14px;

 background:#fff;

 color:var(--green);

 display:grid;

 place-items:center;

 box-shadow:
 0 7px 20px
 rgba(20,70,53,.035);

}


.refresh:active{

 transform:scale(.94);

}


.refresh.loading i{

 animation:
 spin .7s linear infinite;

}


/* =========================================================
   FILTERS
========================================================= */

.filters{

 display:flex;

 gap:7px;

 overflow-x:auto;

 padding:
 1px 1px 5px;

 scrollbar-width:none;

}

.filters::-webkit-scrollbar{

 display:none;

}


.filter{

 flex:none;

 padding:
 8px 12px;

 border:
 1px solid var(--line);

 border-radius:99px;

 background:#fff;

 color:var(--muted);

 font-size:8px;

 font-weight:800;

 white-space:nowrap;

 transition:.2s;

}


.filter i{

 margin-right:4px;

}


.filter.active{

 background:var(--green);

 color:#fff;

 border-color:var(--green);

 box-shadow:
 0 7px 18px
 rgba(8,125,89,.16);

}


/* =========================================================
   SUMMARY
========================================================= */

.summary{

 display:flex;

 align-items:center;

 justify-content:space-between;

 margin:
 11px 0 12px;

}


.summaryLeft{

 display:flex;

 align-items:center;

 gap:8px;

}


.summaryIcon{

 width:32px;
 height:32px;

 border-radius:11px;

 background:var(--soft);

 color:var(--green);

 display:grid;

 place-items:center;

 font-size:10px;

}


.summaryText b{

 display:block;

 font-size:10px;

}


.summaryText span{

 display:block;

 margin-top:2px;

 font-size:7px;

 color:var(--muted);

}


.count{

 padding:
 6px 9px;

 border:
 1px solid var(--line);

 border-radius:99px;

 background:#fff;

 color:var(--green);

 font-size:7px;

 font-weight:800;

}


/* =========================================================
   NOTIFICATION LIST
========================================================= */

.notificationList{

 display:flex;

 flex-direction:column;

 gap:9px;

}


/* =========================================================
   LIST ITEM
========================================================= */

.notificationItem{

 display:flex;

 gap:11px;

 padding:11px;

 background:#fff;

 border:
 1px solid var(--line);

 border-radius:18px;

 box-shadow:
 0 8px 26px
 rgba(20,70,53,.055);

 cursor:pointer;

 position:relative;

 overflow:hidden;

 opacity:0;

 transform:
 translateY(12px);

 animation:
 listIn .42s
 cubic-bezier(.2,.8,.2,1)
 forwards;

 transition:
 transform .18s,
 box-shadow .18s,
 border-color .18s;

}


@keyframes listIn{

 to{

  opacity:1;

  transform:none;

 }

}


.notificationItem:active{

 transform:scale(.985);

 box-shadow:
 0 4px 15px
 rgba(20,70,53,.08);

}


.notificationItem.important{

 border-color:#efd5a4;

}


.notificationItem.urgent{

 border-color:#edbbbb;

}


/* =========================================================
   THUMBNAIL
========================================================= */

.thumb{

 width:74px;
 height:74px;

 flex:none;

 border-radius:14px;

 overflow:hidden;

 background:
 linear-gradient(
 135deg,
 #e8f6f0,
 #dceee7
 );

 display:grid;

 place-items:center;

 color:var(--green);

 position:relative;

}


.thumb img{

 width:100%;
 height:100%;

 object-fit:cover;

 display:block;

}


.thumbPlaceholder{

 font-size:19px;

 opacity:.75;

}


.thumbPriority{

 position:absolute;

 left:5px;
 bottom:5px;

 padding:
 4px 6px;

 border-radius:99px;

 background:
 rgba(255,255,255,.92);

 backdrop-filter:blur(6px);

 color:var(--ink);

 font-size:6px;

 font-weight:800;

}


/* =========================================================
   LIST CONTENT
========================================================= */

.itemContent{

 min-width:0;

 flex:1;

 padding-top:1px;

}


.itemTop{

 display:flex;

 align-items:center;

 gap:5px;

 min-width:0;

}


.categoryBadge{

 display:inline-flex;

 align-items:center;

 gap:4px;

 padding:
 5px 7px;

 border-radius:99px;

 background:var(--soft);

 color:var(--green);

 font-size:6.5px;

 font-weight:800;

 max-width:100px;

 white-space:nowrap;

 overflow:hidden;

 text-overflow:ellipsis;

}


.categoryBadge.important{

 background:var(--orangeSoft);

 color:var(--orange);

}


.categoryBadge.urgent{

 background:var(--redSoft);

 color:var(--red);

}


.itemTime{

 margin-left:auto;

 color:#87928d;

 font-size:6.5px;

 white-space:nowrap;

}


.itemTitle{

 margin-top:7px;

 font-family:
 "Hind Siliguri",
 Inter,
 sans-serif;

 font-size:12.5px;

 line-height:1.4;

 font-weight:700;

 display:-webkit-box;

 -webkit-line-clamp:2;

 -webkit-box-orient:vertical;

 overflow:hidden;

}


.itemPreview{

 margin-top:3px;

 font-family:
 "Hind Siliguri",
 Inter,
 sans-serif;

 font-size:8px;

 line-height:1.55;

 color:var(--muted);

 display:-webkit-box;

 -webkit-line-clamp:2;

 -webkit-box-orient:vertical;

 overflow:hidden;

}


.itemBottom{

 display:flex;

 align-items:center;

 justify-content:space-between;

 margin-top:6px;

}


.readMore{

 color:var(--green);

 font-size:6.5px;

 font-weight:800;

}


.arrow{

 width:23px;
 height:23px;

 border-radius:8px;

 background:#f1f7f4;

 color:var(--green);

 display:grid;

 place-items:center;

 font-size:7px;

}


/* =========================================================
   DETAIL VIEW
========================================================= */

.detailView{

 display:none;

 position:fixed;

 inset:0;

 z-index:200;

 background:
 rgba(227,236,232,.98);

}


.detailView.active{

 display:block;

 animation:
 detailFade .25s ease;

}


@keyframes detailFade{

 from{
  opacity:0;
 }

 to{
  opacity:1;
 }

}


.detailShell{

 width:100%;

 max-width:680px;

 height:100%;

 margin:auto;

 background:var(--bg);

 overflow-y:auto;

 overflow-x:hidden;

}


/* =========================================================
   DETAIL TOPBAR
========================================================= */

.detailTopbar{

 height:58px;

 position:sticky;

 top:0;

 z-index:10;

 display:flex;

 align-items:center;

 padding:
 0 13px;

 color:#fff;

 background:
 linear-gradient(
 135deg,
 #056b4b,
 #087d59,
 #0ca777
 );

 box-shadow:
 0 5px 18px
 rgba(0,0,0,.08);

}


.backBtn{

 width:38px;
 height:38px;

 border-radius:12px;

 background:
 rgba(255,255,255,.12);

 color:#fff;

 display:grid;

 place-items:center;

 font-size:13px;

}


.backBtn:active{

 transform:scale(.93);

}


.detailTopTitle{

 margin-left:10px;

 font-size:11px;

 font-weight:800;

}


.detailTopSpacer{

 margin-left:auto;

 width:38px;

}


/* =========================================================
   DETAIL CONTENT
========================================================= */

.detailContent{

 padding-bottom:35px;

}


.detailImageWrap{

 width:100%;

 background:#e9f0ed;

 position:relative;

 overflow:hidden;

}


.detailImage{

 width:100%;

 max-height:390px;

 min-height:180px;

 object-fit:cover;

 display:block;

}


.detailImageShade{

 position:absolute;

 left:0;
 right:0;
 bottom:0;

 height:100px;

 background:
 linear-gradient(
 transparent,
 rgba(0,0,0,.3)
 );

 pointer-events:none;

}


.detailPriority{

 position:absolute;

 left:15px;
 top:15px;

 padding:
 8px 11px;

 border-radius:99px;

 background:
 rgba(255,255,255,.94);

 backdrop-filter:blur(8px);

 color:var(--ink);

 font-size:7px;

 font-weight:800;

 box-shadow:
 0 7px 20px
 rgba(0,0,0,.08);

}


.detailBody{

 padding:
 17px 17px 30px;

 background:#fff;

}


.detailMeta{

 display:flex;

 align-items:center;

 flex-wrap:wrap;

 gap:6px;

}


.detailBadge{

 display:inline-flex;

 align-items:center;

 gap:5px;

 padding:
 6px 9px;

 border-radius:99px;

 background:var(--soft);

 color:var(--green);

 font-size:7px;

 font-weight:800;

}


.detailBadge.important{

 background:var(--orangeSoft);

 color:var(--orange);

}


.detailBadge.urgent{

 background:var(--redSoft);

 color:var(--red);

}


.detailDate{

 color:var(--muted);

 font-size:7px;

}


.detailTitle{

 margin-top:11px;

 font-family:
 "Hind Siliguri",
 Inter,
 sans-serif;

 font-size:22px;

 line-height:1.4;

 font-weight:800;

 letter-spacing:-.2px;

}


.detailEnglishTitle{

 margin-top:4px;

 color:#74817b;

 font-size:10px;

 line-height:1.55;

 font-weight:600;

}


.detailDivider{

 height:1px;

 background:#edf2ef;

 margin:
 16px 0;

}


.detailDescription{

 font-family:
 "Hind Siliguri",
 Inter,
 sans-serif;

 font-size:12px;

 line-height:1.9;

 color:#405049;

 white-space:pre-line;

}


.detailDescription.en{

 margin-top:15px;

 padding-top:14px;

 border-top:1px dashed #dfe8e4;

 font-family:Inter,sans-serif;

 font-size:9.5px;

 line-height:1.75;

 color:#68756f;

}


/* =========================================================
   LINK ACTION
========================================================= */

.detailActions{

 display:flex;

 gap:8px;

 margin-top:18px;

 padding-top:15px;

 border-top:
 1px solid #edf2ef;

}


.detailAction{

 flex:1;

 min-height:42px;

 border-radius:13px;

 font-size:8px;

 font-weight:800;

 transition:.18s;

}


.detailAction:active{

 transform:scale(.96);

}


.openLinkBtn{

 background:var(--green);

 color:#fff;

 box-shadow:
 0 8px 20px
 rgba(8,125,89,.15);

}


.copyLinkBtn{

 background:var(--blueSoft);

 color:var(--blue);

}


/* =========================================================
   NO IMAGE DETAIL
========================================================= */

.noDetailImage{

 height:120px;

 display:grid;

 place-items:center;

 background:
 linear-gradient(
 135deg,
 #e7f5ef,
 #dceee7
 );

 color:var(--green);

 font-size:32px;

}


/* =========================================================
   LOADING
========================================================= */

.loading{

 text-align:center;

 padding:65px 20px;

 color:var(--muted);

 font-size:9px;

}


.loadingIcon{

 width:48px;
 height:48px;

 margin:
 0 auto 13px;

 border-radius:16px;

 display:grid;

 place-items:center;

 background:var(--soft);

 color:var(--green);

}


.loadingIcon i{

 animation:
 spin .8s linear infinite;

}


@keyframes spin{

 to{
  transform:rotate(360deg);
 }

}


/* =========================================================
   EMPTY / ERROR
========================================================= */

.state{

 text-align:center;

 padding:
 60px 20px;

}


.stateIcon{

 width:70px;
 height:70px;

 margin:
 0 auto 14px;

 border-radius:23px;

 background:var(--soft);

 color:var(--green);

 display:grid;

 place-items:center;

 font-size:24px;

 animation:
 stateFloat 2.4s ease-in-out infinite;

}


@keyframes stateFloat{

 50%{
  transform:translateY(-5px);
 }

}


.state b{

 display:block;

 font-size:13px;

}


.state span{

 display:block;

 max-width:310px;

 margin:
 5px auto 0;

 color:var(--muted);

 font-size:9px;

 line-height:1.65;

}


.retry{

 margin-top:13px;

 border:0;

 border-radius:13px;

 padding:
 10px 15px;

 background:var(--green);

 color:#fff;

 font-size:8px;

 font-weight:800;

}


/* =========================================================
   TOAST
========================================================= */

.toast{

 position:fixed;

 left:50%;

 bottom:18px;

 z-index:500;

 width:max-content;

 max-width:90%;

 padding:
 11px 14px;

 border-radius:14px;

 background:#18251f;

 color:#fff;

 font-size:9px;

 font-weight:700;

 text-align:center;

 opacity:0;

 transform:
 translate(-50%,18px);

 pointer-events:none;

 transition:.25s;

 box-shadow:
 0 12px 30px
 rgba(0,0,0,.2);

}


.toast.show{

 opacity:1;

 transform:
 translate(-50%,0);

}


/* =========================================================
   RESPONSIVE
========================================================= */

@media(max-width:390px){

 .headerTitle{
  font-size:24px;
 }

 .detailTitle{
  font-size:20px;
 }

 .detailImage{
  max-height:300px;
 }

 .thumb{
  width:68px;
  height:68px;
 }

 .itemTitle{
  font-size:12px;
 }

}

</style>

</head>


<body>


<!-- ======================================================
     LIST VIEW
====================================================== -->

<div class="app" id="listView">

<header class="header">

 <div class="headerContent">

  <div class="brandLine">

   <div class="brandIcon">
    <i class="fa-solid fa-bell"></i>
   </div>

   <div class="brandText">

    <small>

    </small>

    <b>
     Notification Center
    </b>

   </div>

  </div>

 </div>

<!-- SEARCH -->

<div class="utility">

 <div class="searchBox">

  <input

   type="search"
   placeholder="Search notifications..."
   autocomplete="off"
  >

 </div>


 <button

  <i class="fa-solid fa-rotate-right"></i>

 >

 <button
  class="filter"
  onclick="setFilter('park',this)"
 >

  <i class="fa-solid fa-tree"></i>
  Park

 </button>


 <button
  class="filter"
  onclick="setFilter('ticket',this)"
 >

  <i class="fa-solid fa-ticket"></i>
  Tickets

 </button>


 <button
  class="filter"
  onclick="setFilter('wildlife',this)"
 >

  <i class="fa-solid fa-paw"></i>
  Wildlife

 </button>


 <button
  class="filter"
  onclick="setFilter('travel',this)"
 >

  <i class="fa-solid fa-route"></i>
  Travel

 </button>


 <button

 >

  <i class="fa-solid fa-star"></i>
  Important

</div>


<!-- SUMMARY -->

<div class="summary">

 <div class="summaryLeft">

  <div class="summaryIcon">
   <i class="fa-regular fa-bell"></i>
  </div>

  <div class="summaryText">

   <b>
    Latest Notifications
   </b>

   <span>
    Stay updated with Wildlife Explorer
   </span>

  </div>

 </div>


 <div
  class="count"

 >
  0 Updates
 </div>

</div>


<!-- LIST -->

<div id="list">

 <div class="loading">

  <div class="loadingIcon">
   <i class="fa-solid fa-spinner"></i>

  Loading notifications...

 </div>

</div>


</main>

</div>


<!-- ======================================================
     DETAIL VIEW
====================================================== -->

<div
 class="detailView"
 id="detailView"
>

 <div class="detailShell">

  <div class="detailTopbar">

   <button
    class="backBtn"

   </button>


   <div class="detailTopTitle">

   </div>


   <div class="detailTopSpacer"></div>

  </div>


  <div
   class="detailContent"
   id="detailContent"
  ></div>

 </div>

</div>

<div

 class="toast"

<script>


/* =========================================================
   SUPABASE
========================================================= */

const SUPABASE_URL =
"https://hnhphoqfylwbuptronqh.supabase.co";

const SUPABASE_KEY =
"sb_publishable_ZBJhCw5h6JKGRD29loq4bw_OV1G_Fz0";

const db =
window.supabase.createClient(
 SUPABASE_URL,
 SUPABASE_KEY
);


/* =========================================================
   STATE
========================================================= */

let notifications = [];

let currentFilter = "all";

let searchTimer = null;

let currentNotification = null;


/* =========================================================
   ICONS
========================================================= */

const ICONS = {

 bell:"fa-bell",

 tree:"fa-tree",

 ticket:"fa-ticket",

 paw:"fa-paw",

 route:"fa-route",

 app:"fa-mobile-screen",

 info:"fa-circle-info",

 warning:"fa-triangle-exclamation",

 calendar:"fa-calendar-days",

 location:"fa-location-dot",

 binoculars:"fa-binoculars",

 sparkles:"fa-sparkles",

 megaphone:"fa-bullhorn",

 download:"fa-download"

};


/* =========================================================
   CATEGORY
========================================================= */

const CATEGORY = {

 app:"App",

 park:"Park",

 ticket:"Tickets",

 wildlife:"Wildlife",

 travel:"Travel"

};


/* =========================================================
   ESCAPE
========================================================= */

function esc(value){

 return String(value ?? "")
 .replace(/&/g,"&amp;")
 .replace(/</g,"&lt;")
 .replace(/>/g,"&gt;")
 .replace(/"/g,"&quot;")
 .replace(/'/g,"&#039;");

}


/* =========================================================
   TOAST
========================================================= */

function toast(message){

 const box =
 document.getElementById("toast");

 box.textContent = message;

 box.classList.add("show");

 clearTimeout(window.toastTimer);

 window.toastTimer =
 setTimeout(()=>{

  box.classList.remove("show");

 },2500);

}


/* =========================================================
   DATE
========================================================= */

function formatDate(value){

 const d =
 new Date(value);

 if(isNaN(d.getTime()))
  return "";

 return d.toLocaleDateString(
  "bn-BD",
  {
   day:"numeric",
   month:"long",
   year:"numeric"
  }
 );

}


/* =========================================================
   TIME AGO
========================================================= */

function timeAgo(value){

 const d =
 new Date(value);

 if(isNaN(d.getTime()))
  return "";

 const diff =
 Math.floor(
  (Date.now()-d.getTime())/1000
 );


 if(diff < 60)
  return "এইমাত্র";


 if(diff < 3600)
  return Math.floor(diff/60)+" মিনিট আগে";


 if(diff < 86400)
  return Math.floor(diff/3600)+" ঘণ্টা আগে";


 if(diff < 604800)
  return Math.floor(diff/86400)+" দিন আগে";


 return formatDate(value);

}


/* =========================================================
   ICON NAME
========================================================= */

function iconName(value){

 return ICONS[value] || "fa-bell";

}


/* =========================================================
   PRIORITY
========================================================= */

function priorityInfo(priority){

 if(priority==="urgent"){

  return {

   cls:"urgent",

   label:"Urgent",

   icon:"fa-triangle-exclamation"

  };

 }


 if(priority==="important"){

  return {

   cls:"important",

   label:"Important",

   icon:"fa-star"

  };

 }


 return {

  cls:"",

  label:"Update",

  icon:"fa-circle-info"

 };

}


/* =========================================================
   FILTER
========================================================= */

function setFilter(value,button){

 currentFilter =
 value;

 document
 .querySelectorAll(".filter")
 .forEach(el=>{

  el.classList.remove("active");

 });


 button.classList.add("active");

 render();

}


/* =========================================================
   SEARCH
========================================================= */

document
.getElementById("search")
.addEventListener(
 "input",
 ()=>{

  clearTimeout(searchTimer);

  searchTimer =
  setTimeout(
   render,
   120
  );

 }
);


/* =========================================================
   COPY LINK
========================================================= */

async function copyLink(url){

 if(!url){

  toast("No link available");

  return;

 }


 try{

  if(
   navigator.clipboard &&
   window.isSecureContext
  ){

   await navigator.clipboard.writeText(url);

  }else{

   const textarea =
   document.createElement("textarea");

   textarea.value =
   url;

   textarea.style.position =
   "fixed";

   textarea.style.opacity =
   "0";

   document.body.appendChild(
    textarea
   );

   textarea.focus();

   textarea.select();

   document.execCommand(
    "copy"
   );

   textarea.remove();

  }


  toast(
   "Link copied successfully"
  );


 }catch(error){

  toast(
   "Unable to copy link"
  );

 }

}


/* =========================================================
   OPEN LINK
========================================================= */

function openLink(url){

 if(!url)
  return;


 try{

  const parsed =
  new URL(url);


  if(
   parsed.protocol!=="http:" &&
   parsed.protocol!=="https:"
  ){

   toast("Invalid link");

   return;

  }


  window.open(
   parsed.href,
   "_blank",
   "noopener,noreferrer"
  );


 }catch{

  toast("Invalid link");

 }

}


/* =========================================================
   IMAGE ERROR
========================================================= */

function imageError(img){

 const wrap =
 img.closest(
  ".thumb, .detailImageWrap"
 );

 if(!wrap)
  return;


 if(
  wrap.classList.contains(
   "detailImageWrap"
  )
 ){

  wrap.innerHTML = `

   <div class="noDetailImage">

    <i class="fa-solid fa-image"></i>

   </div>

  `;

 }else{

  wrap.innerHTML = `

   <div class="thumbPlaceholder">

    <i class="fa-regular fa-bell"></i>

   </div>

  `;

 }

}


/* =========================================================
   FILTER DATA
========================================================= */

function filteredData(){

 const search =
 document
 .getElementById("search")
 .value
 .trim()
 .toLowerCase();


 return notifications.filter(
  item=>{

   if(
    currentFilter==="important"
   ){

    if(
     item.priority!=="important" &&
     item.priority!=="urgent"
    )
     return false;

   }

   else if(
    currentFilter!=="all" &&
    item.category!==currentFilter
   ){

    return false;

   }


   if(!search)
    return true;


   const searchable = [

    item.title_bn,

    item.title_en,

    item.description_bn,

    item.description_en,

    item.category,

    item.priority

   ]
   .join(" ")
   .toLowerCase();


   return searchable.includes(
    search
   );

  }
 );

}


/* =========================================================
   RENDER LIST
========================================================= */

function render(){

 const data =
 filteredData();


 document.getElementById(
  "count"
 ).textContent =
 data.length+" Updates";


 const list =
 document.getElementById(
  "list"
 );


 if(!data.length){

  list.innerHTML = `

   <div class="state">

    <div class="stateIcon">

     <i class="fa-regular fa-bell-slash"></i>

    </div>

    <b>
     No notifications found
    </b>

    <span>
     এই মুহূর্তে এই category-তে কোনো published notification পাওয়া যায়নি।
    </span>

   </div>

  `;

  return;

 }


 list.innerHTML = `

  <div class="notificationList">

   ${data.map(
    (item,index)=>
    createListItem(
     item,
     index
    )
   ).join("")}

  </div>

 `;

}


/* =========================================================
   CREATE LIST ITEM
========================================================= */

function createListItem(
 item,
 index
){

 const priority =
 priorityInfo(
  item.priority
 );


 const category =
 CATEGORY[item.category] ||
 item.category ||
 "App";


 const hasImage =
 !!item.image_url;


 return `

  <article

   class="notificationItem ${priority.cls}"

   style="
    animation-delay:
    ${Math.min(index*45,450)}ms
   "

   onclick="
    openNotification('${esc(item.id)}')
   "

  >


   <div class="thumb">

    ${
     hasImage

     ?

     `

      <img

       src="${esc(item.image_url)}"

       alt="${esc(
        item.title_en ||
        "Notification"
       )}"

       loading="lazy"

       onerror="imageError(this)"

      >

     `

     :

     `

      <div class="thumbPlaceholder">

       <i class="fa-solid ${iconName(item.icon)}"></i>

      </div>

     `
    }


    ${
     item.priority==="important" ||
     item.priority==="urgent"

     ?

     `

      <div class="thumbPriority">

       <i class="fa-solid ${priority.icon}"></i>

       ${esc(priority.label)}

      </div>

     `

     :""

    }

   </div>


   <div class="itemContent">


    <div class="itemTop">

     <span
      class="categoryBadge ${priority.cls}"
     >

      <i
       class="fa-solid ${iconName(item.icon)}"
      ></i>

      ${esc(category)}

     </span>


     <span class="itemTime">

      ${esc(
       timeAgo(item.created_at)
      )}

     </span>

    </div>


    <div class="itemTitle">

     ${esc(
      item.title_bn ||
      item.title_en ||
      "Notification"
     )}

    </div>


    <div class="itemPreview">

     ${esc(
      item.description_bn ||
      item.description_en ||
      "Tap to view notification details."
     )}

    </div>


    <div class="itemBottom">

     <span class="readMore">

      View details

      <i class="fa-solid fa-arrow-right"></i>

     </span>


     <span class="arrow">

      <i class="fa-solid fa-chevron-right"></i>

     </span>

    </div>


   </div>

  </article>

 `;

}


/* =========================================================
   OPEN NOTIFICATION
========================================================= */

function openNotification(id){

 const item =
 notifications.find(
  notification =>
  String(notification.id) ===
  String(id)
 );


 if(!item){

  toast(
   "Notification not found"
  );

  return;

 }


 currentNotification =
 item;


 renderDetail(item);


 const detail =
 document.getElementById(
  "detailView"
 );


 detail.classList.add(
  "active"
 );


 document.body.style.overflow =
 "hidden";


 /*
  Browser history support.
 */

 try{

  history.pushState(
   {
    notification:id
   },
   "",
   "#notification-"+id
  );

 }catch{}


 const shell =
 document.querySelector(
  ".detailShell"
 );

 if(shell)
  shell.scrollTop = 0;

}

   RENDER DETAIL

/* =========================================================
   CLOSE DETAIL
========================================================= */

function closeNotification(){

 const detail =
 document.getElementById(
  "detailView"
 );


 detail.classList.remove(
  "active"
 );


 document.body.style.overflow =
 "";


 currentNotification =
 null;


 /*
  Remove hash without
  reloading page.
 */

 try{

  if(
   location.hash.startsWith(
    "#notification-"
   )
  ){

   history.back();

  }

 }catch{}

}


/* =========================================================
   BROWSER BACK BUTTON
========================================================= */

window.addEventListener(
 "popstate",
 ()=>{

  const detail =
  document.getElementById(
   "detailView"
  );


  if(
   detail.classList.contains(
    "active"
   )
  ){

   detail.classList.remove(
    "active"
   );

   document.body.style.overflow =
   "";

   currentNotification =
   null;

  }

 }
);


/* =========================================================
   LOAD NOTIFICATIONS
========================================================= */

async function loadNotifications(
 showToast=false
){

 const list =
 document.getElementById(
  "list"
 );


 const refresh =
 document.getElementById(
  "refreshBtn"
 );


 refresh.classList.add(
  "loading"
 );


 list.innerHTML = `

  <div class="loading">

   <div class="loadingIcon">

    <i class="fa-solid fa-spinner"></i>

   </div>

   Loading notifications...

  </div>

 `;


 try{

  const {
   data,
   error
  } =

  await db

  .from("notifications")

  .select(`

   id,

   title_bn,

   title_en,

   description_bn,

   description_en,

   category,

   icon,

   priority,

   is_published,

   created_at,

   updated_at,

   image_url,

   action_url

  `)

  .eq(
   "is_published",
   true
  )

  .order(
   "created_at",
   {
    ascending:false
   }
  );


  if(error)
   throw error;


  notifications =
  Array.isArray(data)
  ? data
  : [];


  render();


  if(showToast){

   toast(
    "Notifications refreshed"
   );

  }


 }catch(error){

  console.error(
   "Notification loading error:",
   error
  );


  list.innerHTML = `

   <div class="state">

    <div class="stateIcon">

     <i class="fa-solid fa-cloud"></i>

    </div>


    <b>
     Unable to load notifications
    </b>


    <span>
     Notifications could not be loaded right now. Please check your connection and try again.
    </span>


    <button
     class="retry"
     onclick="loadNotifications(true)"
    >

     <i
      class="fa-solid fa-rotate-right"
     ></i>

     Try Again

    </button>

   </div>

  `;

 }finally{

  refresh.classList.remove(
   "loading"
  );

 }

}


/* =========================================================
   REALTIME
========================================================= */

try{

 db

 .channel(
  "notifications-live"
 )

 .on(

  "postgres_changes",

  {
   event:"*",
   schema:"public",
   table:"notifications"
  },

  payload=>{

   loadNotifications(false);

  }

 )

 .subscribe();

}catch(error){

 console.warn(
  "Realtime unavailable:",
  error
 );

}


/* =========================================================
   ONLINE / OFFLINE
========================================================= */

window.addEventListener(
 "online",
 ()=>{

  toast(
   "Connection restored"
  );

  loadNotifications(false);

 }
);


window.addEventListener(
 "offline",
 ()=>{

  toast(
   "You are offline"
  );

 }
);


/* =========================================================
   INITIAL LOAD
========================================================= */

loadNotifications(false);

</script>
