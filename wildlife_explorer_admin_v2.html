<!doctype html><html lang="bn"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#087d59"><title>Admin • Wildlife Explorer</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{--bg:#f3f8f5;--card:#fff;--ink:#17251f;--muted:#718078;--line:#dfeae5;--green:#087d59;--soft:#e8f6f0;--red:#d65353;--blue:#3978df;--shadow:0 18px 45px rgba(20,70,53,.09)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;background:#dfe9e4;color:var(--ink)}body{font-family:Inter,"Hind Siliguri",sans-serif}.app{max-width:680px;min-height:100vh;margin:auto;background:var(--bg);overflow:hidden}.hidden{display:none!important}
.header{padding:20px 17px 18px;color:#fff;background:linear-gradient(135deg,#056b4b,#0b9b6d);position:relative;overflow:hidden}.header:before,.header:after{content:"";position:absolute;border-radius:50%;background:rgba(255,255,255,.08);animation:float 7s ease-in-out infinite}.header:before{width:180px;height:180px;right:-80px;top:-110px}.header:after{width:110px;height:110px;left:-65px;bottom:-75px}@keyframes float{50%{transform:translate(10px,8px)}}.headrow{display:flex;justify-content:space-between;align-items:center;position:relative;z-index:2}.brand{display:flex;gap:10px;align-items:center}.logo,.loginlogo{display:grid;place-items:center;background:rgba(255,255,255,.15)}.logo{width:43px;height:43px;border-radius:15px}.brand small{font-size:8px;font-weight:800;letter-spacing:1px;opacity:.75}.brand strong{display:block;font-size:15px;margin-top:2px}.logout{border:1px solid rgba(255,255,255,.22);background:rgba(255,255,255,.1);color:#fff;border-radius:12px;padding:9px 11px;font-size:9px;font-weight:800}.hero{position:relative;z-index:2;margin-top:20px}.hero h1{margin:0;font-size:25px}.hero p{margin:4px 0 0;font-size:9px;opacity:.78}.content{padding:15px}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.stat{background:#fff;border:1px solid var(--line);border-radius:19px;padding:13px 11px;box-shadow:var(--shadow);animation:rise .45s ease both}.stat i{color:var(--green);font-size:12px}.stat b{display:block;font-size:20px;margin-top:6px}.stat span{font-size:8px;color:var(--muted);font-weight:700}@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}.actions{display:flex;gap:8px;margin:13px 0}.primary,.secondary,.save{border:0;border-radius:14px;font-weight:800;cursor:pointer}.primary{padding:12px 14px;font-size:9px;background:var(--green);color:#fff;flex:1;box-shadow:0 8px 20px rgba(8,125,89,.2)}.secondary{width:45px;background:#fff;border:1px solid var(--line)}.panel{background:#fff;border:1px solid var(--line);border-radius:21px;padding:14px;box-shadow:var(--shadow)}.panel-head{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:10px}.panel-title{font-size:12px;font-weight:800}.search{flex:0 1 175px;border:1px solid var(--line);border-radius:11px;padding:8px;font-size:9px;outline:0}.item{display:flex;align-items:center;gap:9px;padding:12px 0;border-top:1px solid #edf2ef}.item:first-child{border-top:0}.thumb,.preview{border-radius:14px;background:var(--soft);display:grid;place-items:center;color:var(--green);overflow:hidden}.thumb{width:43px;height:43px;flex:none}.thumb img,.preview img{width:100%;height:100%;object-fit:cover}.itembody{min-width:0;flex:1}.itemtitle{font-size:10px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.itemmeta,.linkpill{font-size:7px;color:var(--muted);margin-top:3px}.linkpill{color:var(--blue);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.status{font-size:7px;font-weight:800;padding:5px 7px;border-radius:99px;background:#e8f7f0;color:var(--green)}.status.draft{background:#fff2dc;color:#b97816}.itembuttons{display:flex;gap:5px}.ib{width:30px;height:30px;border:0;border-radius:10px;background:#f2f6f4;color:var(--muted)}.ib.delete{color:var(--red)}
.overlay{position:fixed;inset:0;background:rgba(7,28,20,.4);backdrop-filter:blur(7px);display:none;align-items:flex-end;justify-content:center;z-index:50}.overlay.show{display:flex}.sheet{width:100%;max-width:680px;max-height:94vh;overflow:auto;background:#fff;border-radius:28px 28px 0 0;padding:9px 18px 28px;animation:up .3s ease}@keyframes up{from{transform:translateY(100%)}to{transform:none}}.handle{width:40px;height:4px;border-radius:9px;background:#dbe4df;margin:0 auto 16px}.sheethead{display:flex;justify-content:space-between;align-items:center}.sheettitle{font-size:17px;font-weight:800}.x{width:32px;height:32px;border:0;border-radius:10px;background:#f0f5f2}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:9px}label{display:block;font-size:8px;font-weight:800;color:#526159;margin:11px 0 6px}input,textarea,select{width:100%;border:1px solid var(--line);border-radius:12px;padding:11px;font:inherit;font-size:10px;outline:0;background:#fbfdfc}textarea{min-height:80px;resize:vertical}.upload{border:1px dashed #a9c9bc;border-radius:15px;padding:11px;background:#f8fcfa}.uploadrow{display:flex;gap:10px;align-items:center}.preview{width:62px;height:62px;flex:none}.upload input{padding:6px;border:0;background:transparent}.upload small{font-size:7px;color:var(--muted)}.checkrow{display:flex;align-items:center;gap:8px;margin-top:12px;padding:11px;background:#f5f9f7;border-radius:13px}.checkrow input{width:16px}.checkrow label{margin:0;font-size:9px}.save{width:100%;margin-top:15px;padding:13px;background:var(--green);color:#fff;font-size:10px}.login{min-height:100vh;display:flex;align-items:center;padding:20px;background:radial-gradient(circle at 100% 0,rgba(11,170,121,.13),transparent 35%),var(--bg)}.loginbox{width:100%;background:#fff;border:1px solid var(--line);border-radius:26px;padding:25px 20px;box-shadow:var(--shadow)}.loginlogo{width:60px;height:60px;border-radius:20px;background:var(--soft);color:var(--green);font-size:23px;margin-bottom:17px}.login h1{font-size:24px;margin:0}.login p{font-size:10px;color:var(--muted);line-height:1.6}.login button{width:100%;border:0;border-radius:14px;padding:13px;background:var(--green);color:#fff;font-weight:800;font-size:10px;margin-top:12px}.error{color:var(--red);font-size:9px;margin-top:9px}.toast{position:fixed;left:50%;bottom:18px;transform:translate(-50%,20px);opacity:0;z-index:80;background:#18251f;color:#fff;border-radius:13px;padding:11px 14px;font-size:9px;font-weight:700;transition:.25s;max-width:92%;text-align:center}.toast.show{opacity:1;transform:translate(-50%,0)}.empty{text-align:center;padding:30px 10px;color:var(--muted);font-size:9px}.spin{animation:spin .8s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}
</style></head><body>
<div id="loginView" class="login"><div class="loginbox"><div class="loginlogo"><i class="fa-solid fa-shield-halved"></i></div><h1>Admin Control</h1><p>Wildlife Explorer notification management.</p><label>Email</label><input id="email" type="email" autocomplete="username" placeholder="Admin email"><label>Password</label><input id="password" type="password" autocomplete="current-password" placeholder="Password"><button onclick="login()"><i class="fa-solid fa-right-to-bracket"></i> Sign in</button><div id="loginError" class="error"></div></div></div>
<div id="adminView" class="app hidden"><header class="header"><div class="headrow"><div class="brand"><div class="logo"><i class="fa-solid fa-leaf"></i></div><div><small>WILDLIFE EXPLORER</small><strong>Admin Control</strong></div></div><button class="logout" onclick="logout()"><i class="fa-solid fa-arrow-right-from-bracket"></i> Logout</button></div><div class="hero"><h1>Notification Center</h1><p>Create, publish and manage updates.</p></div></header>
<main class="content"><section class="stats"><div class="stat"><i class="fa-solid fa-layer-group"></i><b id="total">0</b><span>Total</span></div><div class="stat"><i class="fa-solid fa-circle-check"></i><b id="published">0</b><span>Published</span></div><div class="stat"><i class="fa-solid fa-file-pen"></i><b id="draft">0</b><span>Draft</span></div></section><div class="actions"><button class="primary" onclick="openForm()"><i class="fa-solid fa-plus"></i> New Notification</button><button class="secondary" onclick="loadData()"><i class="fa-solid fa-rotate-right"></i></button></div><section class="panel"><div class="panel-head"><div class="panel-title">All Notifications</div><input class="search" id="search" oninput="render()" placeholder="Search..."></div><div id="items"><div class="empty">Loading...</div></div></section></main></div>
<div id="formOverlay" class="overlay" onclick="outsideClose(event)"><div class="sheet"><div class="handle"></div><div class="sheethead"><div class="sheettitle" id="formTitle">New Notification</div><button class="x" onclick="closeForm()"><i class="fa-solid fa-xmark"></i></button></div><input id="editId" type="hidden"><input id="existingImage" type="hidden">
<label>বাংলা Title</label><input id="title_bn" maxlength="180" placeholder="বাংলা শিরোনাম"><label>English Title</label><input id="title_en" maxlength="180" placeholder="English title"><label>বাংলা Description</label><textarea id="description_bn" maxlength="5000"></textarea><label>English Description</label><textarea id="description_en" maxlength="5000"></textarea>
<div class="grid2"><div><label>Category</label><select id="category"><option>app</option><option>update</option><option>announcement</option><option>important</option><option>park</option><option>ticket</option><option>wildlife</option><option>travel</option></select></div><div><label>Icon</label><select id="icon"><option value="bell">Bell</option><option value="tree">Tree</option><option value="ticket">Ticket</option><option value="paw">Paw</option><option value="route">Route</option><option value="app">App</option><option value="info">Info</option><option value="warning">Warning</option><option value="calendar">Calendar</option><option value="location">Location</option><option value="binoculars">Binoculars</option><option value="sparkles">Sparkles</option><option value="megaphone">Megaphone</option><option value="download">Download</option></select></div></div>
<div class="grid2"><div><label>Priority</label><select id="priority"><option value="normal">Normal</option><option value="important">Important</option><option value="urgent">Urgent</option></select></div><div><label>Optional Link</label><input id="action_url" type="url" placeholder="https://..."></div></div>
<label>Optional Image</label><div class="upload"><div class="uploadrow"><div class="preview" id="preview"><i class="fa-regular fa-image"></i></div><input id="imageFile" type="file" accept="image/*" onchange="previewImage(event)"></div><small>JPG / PNG / WebP • max 2 MB</small></div>
<div class="checkrow"><input id="published" type="checkbox"><label for="published">Publish immediately</label></div><button class="save" id="saveBtn" onclick="saveNotification()"><i class="fa-solid fa-cloud-arrow-up"></i> Save Notification</button></div></div><div id="toast" class="toast"></div>
<script>
const SUPABASE_URL="https://hnhphoqfylwbuptronqh.supabase.co",SUPABASE_KEY="sb_publishable_ZBJhCw5h6JKGRD29loq4bw_OV1G_Fz0",BUCKET="notification-images";
const db=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);let rows=[];
const icons={bell:"fa-bell",tree:"fa-tree",ticket:"fa-ticket",paw:"fa-paw",route:"fa-route",app:"fa-mobile-screen",info:"fa-circle-info",warning:"fa-triangle-exclamation",calendar:"fa-calendar-days",location:"fa-location-dot",binoculars:"fa-binoculars",sparkles:"fa-sparkles",megaphone:"fa-bullhorn",download:"fa-download"};
function esc(v){return String(v??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]))}
function toast(m){const t=document.getElementById("toast");t.textContent=m;t.classList.add("show");clearTimeout(window.tt);window.tt=setTimeout(()=>t.classList.remove("show"),2800)}
function loginError(m){document.getElementById("loginError").textContent=m}
async function login(){loginError("");const email=document.getElementById("email").value.trim(),password=document.getElementById("password").value;if(!email||!password)return loginError("Email and password are required.");const {error}=await db.auth.signInWithPassword({email,password});if(error)return loginError(error.message);showAdmin()}
async function showAdmin(){document.getElementById("loginView").classList.add("hidden");document.getElementById("adminView").classList.remove("hidden");loadData()}
async function logout(){await db.auth.signOut();location.reload()}
async function loadData(){document.getElementById("items").innerHTML='<div class="empty"><i class="fa-solid fa-spinner spin"></i><br>Loading...</div>';const {data,error}=await db.from("notifications").select("*").order("created_at",{ascending:false});if(error){document.getElementById("items").innerHTML='<div class="empty">Unable to load data.<br>'+esc(error.message)+'</div>';return}rows=data||[];render()}
function render(){const q=document.getElementById("search").value.trim().toLowerCase(),data=rows.filter(x=>!q||[x.title_bn,x.title_en,x.category,x.priority].join(" ").toLowerCase().includes(q));document.getElementById("total").textContent=rows.length;document.getElementById("published").textContent=rows.filter(x=>x.is_published).length;document.getElementById("draft").textContent=rows.filter(x=>!x.is_published).length;if(!data.length){document.getElementById("items").innerHTML='<div class="empty">No notifications found.</div>';return}document.getElementById("items").innerHTML=data.map(x=>`<div class="item"><div class="thumb">${x.image_url?`<img src="${esc(x.image_url)}">`:`<i class="fa-solid ${icons[x.icon]||"fa-bell"}"></i>`}</div><div class="itembody"><div class="itemtitle">${esc(x.title_bn||x.title_en)}</div><div class="itemmeta">${esc(x.category)} • ${esc(x.priority)}</div>${x.action_url?`<div class="linkpill"><i class="fa-solid fa-link"></i> ${esc(x.action_url)}</div>`:""}</div><span class="status ${x.is_published?"":"draft"}">${x.is_published?"LIVE":"DRAFT"}</span><div class="itembuttons"><button class="ib" onclick="editNotification(${x.id})"><i class="fa-solid fa-pen"></i></button><button class="ib delete" onclick="deleteNotification(${x.id})"><i class="fa-solid fa-trash"></i></button></div></div>`).join("")}
function previewImage(e){const f=e.target.files?.[0];if(!f)return;if(f.size>2*1024*1024){toast("Image must be 2 MB or smaller.");e.target.value="";return}const r=new FileReader();r.onload=()=>document.getElementById("preview").innerHTML=`<img src="${r.result}">`;r.readAsDataURL(f)}
function openForm(row=null){document.getElementById("editId").value=row?.id||"";document.getElementById("existingImage").value=row?.image_url||"";document.getElementById("formTitle").textContent=row?"Edit Notification":"New Notification";["title_bn","title_en","description_bn","description_en"].forEach(k=>document.getElementById(k).value=row?.[k]||"");document.getElementById("category").value=row?.category||"app";document.getElementById("icon").value=row?.icon||"bell";document.getElementById("priority").value=row?.priority||"normal";document.getElementById("action_url").value=row?.action_url||"";document.getElementById("published").checked=row?!!row.is_published:true;document.getElementById("imageFile").value="";document.getElementById("preview").innerHTML=row?.image_url?`<img src="${esc(row.image_url)}">`:'<i class="fa-regular fa-image"></i>';document.getElementById("formOverlay").classList.add("show")}
function closeForm(){document.getElementById("formOverlay").classList.remove("show")}function outsideClose(e){if(e.target.id==="formOverlay")closeForm()}function editNotification(id){const r=rows.find(x=>Number(x.id)===Number(id));if(r)openForm(r)}
async function uploadImage(f){const ext=(f.name.split(".").pop()||"jpg").toLowerCase().replace(/[^a-z0-9]/g,"")||"jpg",path=`${crypto.randomUUID()}.${ext}`;const {error}=await db.storage.from(BUCKET).upload(path,f,{contentType:f.type||"image/jpeg"});if(error)throw error;return db.storage.from(BUCKET).getPublicUrl(path).data.publicUrl}
async function saveNotification(){const id=document.getElementById("editId").value,file=document.getElementById("imageFile").files?.[0]||null;const payload={title_bn:document.getElementById("title_bn").value.trim(),title_en:document.getElementById("title_en").value.trim(),description_bn:document.getElementById("description_bn").value.trim(),description_en:document.getElementById("description_en").value.trim(),category:document.getElementById("category").value,icon:document.getElementById("icon").value,priority:document.getElementById("priority").value,action_url:document.getElementById("action_url").value.trim()||null,is_published:id?document.getElementById("published").checked:true,image_url:document.getElementById("existingImage").value||null};if(!payload.title_bn||!payload.title_en||!payload.description_bn||!payload.description_en)return toast("Please fill all title and description fields.");const b=document.getElementById("saveBtn");b.disabled=true;b.innerHTML='<i class="fa-solid fa-spinner spin"></i> Saving...';try{if(file)payload.image_url=await uploadImage(file);const result=id?await db.from("notifications").update(payload).eq("id",id).select().single():await db.from("notifications").insert(payload).select().single();if(result.error)throw result.error;if(!id&&result.data?.is_published!==true)throw new Error("Database returned is_published=false");closeForm();toast(id?"Notification updated":"Notification published");await loadData()}catch(e){toast("Save failed: "+e.message)}finally{b.disabled=false;b.innerHTML='<i class="fa-solid fa-cloud-arrow-up"></i> Save Notification'}}
async function deleteNotification(id){if(!confirm("Delete this notification?"))return;const {error}=await db.from("notifications").delete().eq("id",id);if(error)return toast("Delete failed: "+error.message);toast("Notification deleted");loadData()}
db.auth.getSession().then(({data})=>{if(data.session)showAdmin()});
</script></body></html>
