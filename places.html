<style>

const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
function tr(x){return lang==="bn"?x.bn:x.en}
function esc(s){return String(s).replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]))}
function img(x){return IMAGE_OVERRIDES[x.en]||x.img}
function applyLang(){
 document.documentElement.lang=lang;
 $$("[data-en]").forEach(e=>e.textContent=lang==="bn"?e.dataset.bn:e.dataset.en);
 $("#lang").textContent=lang==="bn"?"English":"বাংলা";
 $("#label").textContent=lang==="bn"?"ভ্রমণ স্থানসমূহ":"Explore Places";
 const inp=$("#search");inp.placeholder=lang==="bn"?inp.dataset.bnph:inp.dataset.enph;
 render();
}
function filtered(){
 return PLACES.filter(x=>{
  const ok=active==="All"||x.category===active;
  const text=(x.en+" "+x.bn+" "+x.location+" "+x.category+" "+x.category_bn).toLowerCase();
  return ok&&(!q||text.includes(q.toLowerCase()));
 });
}
function render(){
 const list=filtered();$("#grid").innerHTML="";
 $("#count").textContent=lang==="bn"?`${list.length}টি স্থান`:`${list.length} places`;
 $("#empty").style.display=list.length?"none":"block";
 list.forEach((x,i)=>{
  const a=document.createElement("article");a.className="place";a.style.animationDelay=Math.min(i,15)*25+"ms";
  a.innerHTML=`<div class="pic"><img loading="lazy" src="${img(x)}" alt="${esc(tr(x))}"><span class="tag">${esc(lang==="bn"?x.category_bn:x.category)}</span><span class="mapdot"><svg viewBox="0 0 24 24" width="16" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 10c0 5-8 11-8 11S4 15 4 10a8 8 0 1 1 16 0Z"/><circle cx="12" cy="10" r="2.5"/></svg></span></div>
  <div class="body"><h3>${esc(tr(x))}</h3><div class="loc">${esc(x.location)}</div><p>${esc(lang==="bn"?x.desc_bn:x.desc)}</p><div class="more">${lang==="bn"?"বিস্তারিত দেখুন":"View details"} →</div></div>`;
  a.onclick=()=>open(x);$("#grid").appendChild(a);
 });
}
function open(x){
 $("#mimg").src=img(x);$("#mtitle").textContent=tr(x);$("#mloc").textContent=x.location;
 $("#mdesc").textContent=lang==="bn"?x.desc_bn:x.desc;$("#mcat").textContent=lang==="bn"?x.category_bn:x.category;
 $("#marea").textContent=x.location;$("#mwhere").textContent=(lang==="bn"?"কোথায়: ":"Where: ")+x.where;$("#map").href=x.map;
 $("#modal").classList.add("open");
}
function close(){ $("#modal").classList.remove("open") }
$("#close").onclick=close;$("#modal").onclick=e=>{if(e.target.id==="modal")close()};
$("#share").onclick=async()=>{let title=$("#mtitle").textContent;if(navigator.share){try{await navigator.share({title,text:title,url:location.href})}catch(e){}}else alert(lang==="bn"?"লিংক কপি/শেয়ার করতে ব্রাউজারের শেয়ার অপশন ব্যবহার করুন।":"Use your browser's share option to share this page.")};
$("#lang").onclick=()=>{lang=lang==="en"?"bn":"en";localStorage.setItem("gwg-place-lang",lang);applyLang()};
$("#search").oninput=e=>{q=e.target.value;render()};
$("#filters").onclick=e=>{const b=e.target.closest(".filter");if(!b)return;$$(".filter").forEach(x=>x.classList.remove("active"));b.classList.add("active");active=b.dataset.filter;render()};
$("#topSearch").onclick=()=>{$("#searchArea").scrollIntoView({behavior:"smooth",block:"center"});setTimeout(()=>$("#search").focus(),300)};

$("#total").textContent=PLACES.length;$("#regions").textContent=new Set(PLACES.map(x=>x.location)).size;
const featured=PLACES.find(x=>x.en==="Gazipur Safari Park")||PLACES[0];
$("#fimg").src=img(featured);$("#ftitle").textContent=tr(featured);$("#fdesc").textContent=lang==="bn"?featured.desc_bn:featured.desc;
$("#feature").onclick=()=>open(featured);
applyLang();
</script>
</body>
</html>
